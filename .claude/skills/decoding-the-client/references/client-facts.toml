# Message 0x262's player fields and the world-entry fields: what the client does with them

["opcode.0x262.player_fields"]
statement = "What the client does with each value of message 0x262's type 20 data (a player character) after gender, in wire order. The 64-bit value is the unit's group id: Unit:IsInYourGroup is true only when the player has a group and that group's id equals it; 0 is never a group's id, so 0 means no group. The 8-bit count and its 32-bit values are unit ids the character owns (pets): each non-zero id is added once to the unit's owned list, which a pet unit (types 24 and 25) also joins on its own creation when it names this unit as owner; an empty list owns nothing. The wide text is the guild name (Unit:GetGuildName, and Unit:GetAffiliationName before any other affiliation); an empty text gives nil. The 4-bit value is the guild type (Unit:GetGuildType; 0 gives nil). The 5-bit count and its 64-bit values are the ids of the guilds the unit is a member of (Guild:IsUnitMember compares the guild's id with each); empty means no guild. The 6-bit count and its 32-bit values are the character's bone values (float bits, as message 0x25b sends them): they are kept only when the race and gender have bones, and the model applies them only when the list is not empty, so an empty list leaves the default face. The 3-bit value the schema calls the path is the unit's PvP flags, not its path: bit 0 is what Unit:IsPvpFlagged reports, and bit 1 is read by two other checks; Unit:GetPlayerPathType reads a value this message does not set. The 8-bit value is the premium tier (Unit:GetPremiumTier; 255 is kept as 0). The 14-bit value is the title, a CharacterTitle id: when the unit has a name the client builds the title text from that row, and 0 (no row) gives an empty title and Unit:HasTitle false. For a newly made character standing in the world, 0 or empty in each of these is the client's own no-value case."
proof = "Field places: ReadUnitCreatePlayerData 0x1400962d0 stores the type data from record 0x8 (character id 0x8, realm 0x10, name 0x18, race 0x20, class 0x24, gender 0x28, 64-bit value 0x30, count 0x38 and list 0x40, text 0x48, 4-bit 0x50, count 0x54 and list 0x58, count 0x60 and list 0x68, 3-bit 0x70, 8-bit 0x74, 14-bit 0x78). InitUnitFromCreate 0x140456960 case 0x14 (listing): 0x140456c5a mov rax, qword ptr [rbx+0x30]; 0x140456bf4 cmp byte ptr [rbx+0x38], sil; 0x140456c00 mov rax, qword ptr [rbx+0x40]; 0x140456e6b mov rdx, qword ptr [rbx+0x48]; 0x140456e77 mov eax, dword ptr [rbx+0x50]; 0x140456e80 movzx r8d, byte ptr [rbx+0x54]; 0x140456e85 mov rdx, qword ptr [rbx+0x58]; 0x140456eeb cmp si, word ptr [rbx+0x60]; 0x140456f00 mov rax, qword ptr [rbx+0x68]; 0x140456f37 mov eax, dword ptr [rbx+0x70]; 0x140456f40 movzx eax, byte ptr [rbx+0x74]; 0x140456f53 mov edx, dword ptr [rbx+0x78]. Decompiled: record 0x30 to the unit's 0x18a0; each non-zero list value to AddOwnedUnit 0x14047c1a0; text to SetUnitGuildName 0x14045b940 (unit 0x90); 4-bit to the unit's 0x98; count and list appended to the unit's vector at 0xa0 (0x1403705b0); bone list copied to the vector at 0xd28 only when 0x1400323e0 (race below 17, gender below 3: the race/gender entry of the object at 0x140c658e8) has entries; 3-bit to the unit's 0x15a8; 8-bit to the unit's byte 0x1b2 (255 to 0); 14-bit to SetUnitTitle 0x14045b6f0. Readers: IsInYourGroup 0x140660d00 (the world's group at 0x6c50, its 0x48 against the unit's 0x18a0); GetGuildName 0x140660bd0 and GetAffiliationName 0x140652910 (unit 0x90, else 0xb0); GetGuildType 0x140660c80 (unit 0x98, 0 gives nil); Guild:IsUnitMember 0x14069aae0 (registered at 0x14069625f with 'IsUnitMember', 'Game.Guild' and 'Game.Unit' arguments, loops the unit's 0xa0 list against the guild id); 0x140584240 replaces the 0xa0 list and raises 'UnitMemberOfGuildChange'; bones: 0x140467990 and 0x1404f69b0 call the actor's bone setter only when the vector's 0xd30 and 0xd38 differ; PvP: IsPvpFlagged 0x140661240 calls 0x1403b48b0 (0x1403b48b6 test byte ptr [rcx+0x15a8], 0x1); 0x1403b5f13 and 0x1403c92a9 test bit 0x2; 0x1403ddc60 stores a new value there (0x1403ddcdb) and raises 'UnitPvpFlagsChanged'; GetPlayerPathType 0x140658f70 reads the unit's 0x3700 for type 0x14; GetPremiumTier 0x140662110 (byte 0x1b2); HasTitle 0x1406529d0 (unit 0x168 non-zero); GetTitle 0x140652a40 (text at 0x178). Owned list: AddOwnedUnit adds to the vector at 0x2b8 (count 0x2c0) unless present; 0x140458ec0 (type 25) and InitUnitFromCreate's case 0x18 (type 24) add the new unit to the owner named at its 0x2b0; GetUnitOwner 0x140661d20 reads 0x2b0 for type 0x18; 0x14047c1e0 tests membership. Lua names from the Unit method pairs 0x140c5a770..0x140c5b8a0."
