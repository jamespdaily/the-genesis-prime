grade = "sure"
name = "RunMainLoop"

["0x1400094f0"]
statement = "One pass of the main loop: runs a frame (RunFrame), draws it (DrawFrame) when the frame asked for drawing, then waits. It does nothing when the application is not running or a pass is already in progress, and returns at once when another thread holds the pass. The wait lasts until one second divided by video.framerateMax has passed since the frame began, counting at most one second of the frame's own time, except when the display mode's vertical sync flag (video.verticalSync) is on: then that wait is skipped and the client sets no frame rate of its own. When the application is not in the foreground, or the renderer could not draw, the pass also waits at least half the frame's time. The wait sleeps whole milliseconds and spins for the rest. With vertical sync off the client therefore starts at most video.framerateMax frames a second."
proof = "0x1400094fc test al, 1 and 0x14000950b test al, 4 (running) else 0x80004005; 0x140009517 call [0x140959368] (GetCurrentThreadId): the owner at 0x20 counts up on the same thread (0x140009526), another thread fails 0x140009534 lock cmpxchg and returns 0; 0x140009551 test al, 0x10 (pass in progress) then 0x140009559 or eax, 0x10; 0x14000956f call [rax+0x40] (slot 0x40 of the class 0x140b55120: 0x1400097d0) unless bit 8; 0x140009589..0x14000959a: when bit 0x80 is set, clear it and call [rax+0x48] (0x140009b70). The wait: 0x1400095bb QueryPerformanceCounter (0x140959660); 0x1400095c1 mov rax, [rbx+0xb8] (counts a second); 0x1400095d7 sub r9, [rbx+0xc8] (the frame's start, stored by 0x1400097d0 at 0x1400098d9); 0x1400095e1 cmovb r9, rax (at most one second); 0x1400095e5 test dword [rbx+0x40], 0x100; 0x1400095f1 shr rdi (half); 0x1400095f9 test byte [rbx+0x70], 4; 0x1400095fd jne 0x140009635 (vertical sync: no frame-rate wait); 0x140009608 mov ecx, [0x140c3feb0]; 0x140009610 cmovl ecx, edx (the settings level in use); 0x14000961d mov r8d, [rdx+4*rcx] with rdx 0x140c3fec0 (video.framerateMax); 0x140009623 div r8 (counts per frame); 0x140009626 cmp r9, rax; 0x14000962b sub rax, r9; 0x140009631 cmovb rdi, rax; 0x140009660 div qword [rbx+0xb0] (counts a millisecond); 0x1400096e0 call [0x140959280] (Sleep); 0x140009710 pause, looping at 0x14000972f until the time since 0x1400095bb reaches the wait; 0x140009731 and dword [rbx+0x40], ~0x100. Fields set in 0x140008910: 0x140008b41 [rbx+0xb8] = [0x140c636b8] (from 0x14018ccf0), 0x140008b71 [rbx+0xb0] = that / 1000, 0x140008b9a [rbx+0xc0] = 1 / that. Bit 0x2000 (foreground): set at 0x140008b8d, cleared in MainWindowProc at 0x140009e35; 0x1400097d0 sets 0x100 when it is clear (0x140009b49..0x140009b4f); 0x140009b70 sets 0x100 when the renderer is not ready (0x140009ccf). Bit 4 of [rbx+0x70] is set from video.verticalSync at 0x140017bf7. Callers: 0x140008cdb (0x140008bc0) and 0x140009fd9 (0x140009d00)."
grade = "fairly sure"
gap = "A frame run by an indirect call of slot 0x40 other than this pass's is not excluded (the slot's routine 0x1400097d0 has no direct caller and one data reference, the class at 0x140b55120); the counts-per-frame division truncates, so a frame may be one counter count shorter than one second divided by the setting."
name = "RunFramePass"

["0x1400097d0"]
