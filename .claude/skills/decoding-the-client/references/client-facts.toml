proof = "In SetWorldConnection 0x1403e7ea0, with the kept character record: 0x1403e7fa6 movss xmm0, dword ptr [rsi+0x5c]; 0x1403e7fab movss xmm2, dword ptr [rsi+0x58]; 0x1403e7fb0 mov edx, dword ptr [rsi+0x50]; 0x1403e7fb3 xorps xmm1, xmm1; 0x1403e7fbe movss xmm3, dword ptr [rsi+0x54]; 0x1403e7fc3 unpcklps xmm2, xmm1; 0x1403e7fc6 unpcklps xmm3, xmm0; 0x1403e7fc9 unpcklps xmm3, xmm2; 0x1403e7fcc movaps xmmword ptr [rsp+0x40], xmm3; 0x1403e7fd1 call 0x1403e70d0. LoadWorld copies the four words to the world's start position (0x7260..0x726c)."
grade = "sure"

["0x140458140"]
statement = "Sets a new unit's stats from message 0x262's tagged list (the 5-bit count and the 5-bit/2-bit entries): each entry's 5-bit value is the stat and its 2-bit tag the value's form (0, a 32-bit integer; 1, a float; 2, two 32-bit integers). Stat 0 is the unit's health (what Unit:GetHealth returns; a unit that can die is created dead when it is 0, 0x140457bc5); stat 10 is the unit's level, set without any event; stat 11, 19 to 22 and others set further unit values; a stat above 25 is reported. A stat the list leaves out keeps the unit's starting value, so a player unit created with no stat 10 is level 1 (0x1404543c1)."
proof = "Called by InitUnitFromCreate 0x140456960 with record 0x88 and the count at record 0x81. Decompiled: a switch on the entry's first word (0x1404581e8 cmp eax, 0x19; 0x1404581fc jmp rcx): case 10 stores the integer at the unit's 0x38, the word ApplyUnitStat 0x1403d9a60 reads as the level (0x1403d9e8a mov r14d, dword ptr [rbx+0x38]); tag 1 values feed cases 1 to 9 and 23 to 25. The three tag readers are the 0x262 record's (0x14007ab50, 0x140080c60, 0x14007a040)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile apart from the switch; the other stats' meanings are not read, and that tag 1 is a float is inferred from its use; the reader 0x140080c60's width is in the 0x262 record."
name = "SetUnitStatsFromCreate"

["0x1404543c1"]
statement = "A new unit starts at level 1: the unit constructor sets the level word to 1, and only stat 10 (in message 0x262's stats, or the stat change of message 0x935) changes it."
proof = "Unit constructor 0x140454380 (called by HandleMessage0262 0x1403d9760): 0x1404543c1 mov qword ptr [rcx+0x38], 0x1 (the level word 1, the next word 0). The level word is read by ApplyUnitStat at 0x1403d9e8a mov r14d, dword ptr [rbx+0x38] and by GetPendingLevelUpUnlockList at 0x1404b0f2b mov ecx, dword ptr [rdx+0x38]; SetUnitStatsFromCreate 0x140458140 writes it for stat 10."
grade = "sure"

["0x1403d9a60"]
statement = "Applies one stat change to a unit, given the stat, an integer value and a float value. For the player's unit and stat 10 (level) with the integer value: a level above the unit's level sets it, queues the level's Communicator messages for each level passed and, 2000 ms later, runs the level-up fanfare, which raises PlayerLevelChange; a lower level sets it and raises PlayerLevelChange at once. Message 0x935's case is its only direct caller and passes an integer of 0."
proof = "0x1403d9add cmp r14d, 0x1a / 0x1403d9af9 jmp rcx (stats 0 to 26). Case 10: 0x1403d9e8a mov r14d, dword ptr [rbx+0x38] (the old level); 0x1403d9e96 call qword ptr [rax+0x30] (sets the level to the integer, kept in ebp from r9d at 0x1403d9a8e); 0x1403d9ec0 cmp r14d, ebp; 0x1403d9ec5 lea rax, [0x14045edd0]; 0x1403d9ede mov edx, 0x7d0; 0x1403d9ef6 call 0x140195960 (the timer); 0x1403d9f0a call 0x14043b4a0 per level; a fall: 0x1403d9f44 lea rdx, [0x140afc3f8] ('PlayerLevelChange'), 0x1403d9f56 call 0x1400ea3e0. Callers: a scan of every E8 and E9 call and every RIP-relative lea in .text finds one, 0x1403ed542 in message 0x935's case."
grade = "fairly sure"
gap = "A call through a pointer would not be found by the scan; another caller that passes a real integer level is not found, so how the server raises a player's level is not read."
name = "ApplyUnitStat"

["0x1400975b0"]
statement = "Reads message 0x935's body: a 32-bit unit id, a 5-bit stat and a float value."
proof = "0x1400975d5 mov r8d, 0x20 / 0x1400975de call 0x14006c090; 0x1400975eb mov r8d, 0x5 / 0x1400975f4 call 0x14006c090; 0x140097604 call 0x14006c1c0 (ReadFloat). Registered with 0x935 at 0x140074c78 (0x140074c5a lea rcx, [0x1400975b0])."
grade = "sure"
name = "ReadMessage0935Body"

["opcode.0x935"]
statement = "Message 0x935 (2357), game server to client: a unit's stat changed. Body: the unit id (32 bits), the stat (5 bits) and the value (a float). The client finds the unit (an unknown id does nothing) and applies the stat with the float and an integer of 0 (ApplyUnitStat), so a stat 10 (level) sent this way does not raise the level."
proof = "Registered at 0x140074c78 mov edx, 0x935; 0x140074c71 lea r8d, [r9+0xc] (record size); reader 0x1400975b0. HandleWorldMessage's jump table entry for 0x935 is 0x1403ed517: 0x1403ed51c call 0x1403d90d0 (FindUnit with the first word); 0x1403ed524 je 0x1403ec71b; 0x1403ed52a movss xmm0, dword ptr [rdi+0x8]; 0x1403ed52f xor r9d, r9d; 0x1403ed532 mov r8d, dword ptr [rdi+0x4]; 0x1403ed542 call 0x1403d9a60."
grade = "fairly sure"
gap = "Whether the client has a writer for it is not checked; which stats retail sent this way is not in the client."

["0x14045edd0"]
statement = "The player's level-up fanfare, run 2000 ms after a level rise: builds the text of localized text 2673 with the new level, marks the unit's faction changed, plays the level-up effects, queues the level's Communicator messages and raises PlayerLevelChange with the level and two values of the level's XpPerLevel row. Text 2673 is used nowhere else."
proof = "Only reference: 0x1403d9ec5 lea rax, [0x14045edd0] in ApplyUnitStat. 0x14045ee11 mov edx, 0xa71 / 0x14045ee16 call 0x14034bdd0 (localized text); 0x14045ee1b mov r9d, dword ptr [rsi+0x38]; 0x14045ee1f lea rdx, [0x140b07e30] ('%s %d'). Decompiled: 0x14024dfc0 with the level (its row words 0x10 and 0xc), 'PlayerLevelChange' (the text at 0x140afc3f8). A scan of .text for the bytes ba710a0000 finds only 0x14045ee11."
grade = "fairly sure"
gap = "Text 2673 is not looked up in en-US.bin; that 0x14024dfc0 is the XpPerLevel lookup is inferred."
name = "RunLevelUpFanfare"

["0x1404b0e70"]
statement = "Lists the player's pending level-up unlocks (GameLib.GetPendingLevelUpUnlocks): with a player, and only when the client holds an entry for the player's character id, it takes for the Level system the LevelUpUnlock rows from level 1 up to the player unit's level, and for the Path system those up to the path level, leaves out every unlock marked viewed, and keeps each whose prerequisite passes. A new level-1 character with nothing marked viewed has the level-1 Level unlocks pending."
proof = "Called by the GameLib function 0x1407033e0 (GetPendingLevelUpUnlocks, its name 0x140b43200 paired with it at 0x140b731e0). 0x1404b0e99 mov r9, qword ptr [rbp+0x88] (a map keyed by character id); 0x1404b0eac mov r8, qword ptr [rdx+0x1a8] (the player unit's character id, set by InitUnitFromCreate from 0x262); 0x1404b0f2b mov ecx, dword ptr [rdx+0x38] (the unit's level); 0x1404b0fd7 mov rax, qword ptr [rbp+0x68] (the viewed set). Decompiled: the path level from 0x140c65970 slot 0x10; two systems; per row the viewed set and 0x1404af7d0 (the prerequisite)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile apart from the loads. The per-character entry and the viewed set are the client's own state, saved to LevelUpUnlocks.xml (SaveLevelUpUnlocks 0x1404b2680), and no message writes them; how the entry is first made at start, from that file or by GameLib.GetUnlocksForLevel, is not read."
