["0x140331620"]
statement = "Parses one whole frame held in memory, the decrypted body of message 0x76 or 0x3dc: its 32-bit length must be at least 6; it reads the 32-bit length and the 16-bit message id, looks the message up and reads its body with the message's reader into a record. An unknown id or one with no reader is logged and fails. Failures are logged under Network at level Error with the id: 'Malformed Packet: Unknown Message: <id, name>' (8), 'Overflow' when the record space is too small (4, no id), 'Msg <id, name> failed to find unPackFromStreamFn function' (11), 'Malformed Packet: unPackFromStreamFn failure : <id, name>' (8)."
proof = "Slot 0x100 of the class table at 0x140b647b0. Decompiled: no buffer -> 0xe; *buffer < 6 -> 5; a stream (class table 0x140b64918) over buffer .. buffer + *buffer; 0x140336c60 with 0x20 then 0x10; the id to the caller's id slot; slot 0x130; reader at descriptor 0x20 into a record from 0x1403374e0; reader failure -> 8. Decompiled: no buffer -> 0xe; length < 6 -> 5; ReadBits 0x20, 0x10; slot 0x130; null -> 0x1401a2e50(0xb, 0, 0x141debb58 'Malformed Packet: Unknown Message: <%d, %s>', id, name); space 0x18 < record size -> 0x141debc20 'Overflow', 4; AllocateMessageSpace null -> 6; no reader -> LogMessage 0x141debbb0, 0xb; reader < 0 -> 0x141debc88 'Malformed Packet: unPackFromStreamFn failure : <%d, %S>', 8. HandleServerMessage turns any nonzero result into 0x80004005 (0x140015299)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile."
name = "ParseWrappedMessage"

["0x140014f10"]
statement = "The game's handler for a message received on a connection, given the connection id, the message id and the message. It accepts message 3 (the hello) arriving bare only from the auth connection. Message 0x76 it decrypts with the auth connection's cipher and message 0x3dc with the game connection's (DecryptMessageBody over the inner frame after its 4-byte length), then parses the inner frame (ParseWrappedMessage) and handles the inner message; a parse failure returns an error. Any other message arriving bare is reported as an error and dropped. The message then goes, in this order, to HandleMessages0966To0980 (ids 2406 to 2432 but 2418) when the game holds that handler, to HandleMessages0981To0985 (ids 2433 to 2437) and to HandleMessages0987To0991 (ids 2439 to 2449 but 2447) when the global objects they serve exist; a message one of them takes goes no further. Otherwise message 0x763 is handled here, and any other goes to the game's handler list in order: each handler is given the connection id, the id and the message, and the first that returns 0 ends the walk; a negative result is reported as an error with the message's name. A message no handler takes is logged as unhandled and dropped. The handlers that can be on that list and take messages are HandleLoginMessage, HandleCharacterSelectMessage, HandleRealmSelectMessage, HandleWorldMessage, HandleMessages03CFTo03D2 and ForwardServerMessage, which passes the message to the handler it wraps."
proof = "Every instruction of the .pdata range 0x140014f10..0x140015ae1 read in llvm-objdump's listing. Slot 2 of the class table at 0x140b55100 (bytes at 0x140b55110: 0x140014f10), which the game constructor puts at game 0x100 (0x14000a4bf mov qword ptr [rbx+0x100], rax), so its 0x1620 and 0x1628 are game 0x1720 (the auth connection, 0x140029fd7 mov [rax+0x1720], rsi) and game 0x1728 (the game connection, 0x140029fc7 mov [rax+0x1728], rsi). Arguments: 0x140014f15 mov [rsp+0x18], r8d (connection id, later [rbp+0x60]); 0x140014f34 mov edi, r9d (id); the message at [rbp+0x70]. 0x140014f46 cmp r9d, 3 -> 0x1400152b0 mov rax, [rcx+0x1620], 0x14001540c cmp r8d, [rax+0x98], 0x140015413 je 0x140015589; else report and 0x140015232 mov eax, 1. 0x140014f54 cmp r9d, 0x76 -> 0x14001524b mov rax, [rcx+0x1620]; 0x140014f5e cmp r9d, 0x3dc -> 0x14001523f mov rax, [rcx+0x1628]; 0x140015257 mov rax, [rax+0x10] (the cipher); 0x140015260 mov r8d, [rdi] (the inner length); 0x140015263 mov rcx, [rax+0x18]; 0x140015267 lea rdx, [rdi+0x4]; 0x14001526b sub r8d, 0x4; 0x14001526f call [rax+0x20] (DecryptMessageBody); 0x14001528f call [rax+0x100] of the network object 0x140c65808 (0x140331620) gives the inner id and record; 0x140015299 mov eax, 0x80004005 on failure. Any other id: 0x140014f81 call [rax+0x30], report through 0x1401971e0, 0x140015232 mov eax, 1. Dispatch from 0x14001559a: mov rcx, [r12+0x14d0] (game 0x15d0, built by 0x140003970 and stored at 0x14000c17b); 0x1400155b7 call 0x140003fb0; 0x14001565c cmove ebx, r15d (taken on 0); 0x140015660 cmp [0x140c65910], 0 / 0x14001566f call 0x140452670; 0x1400156a5 cmp [0x140c65908], 0 / 0x1400156b4 call 0x14044b630, 0x1400156de je 0x140015ac4 (taken: return 0); a negative result from any of the three goes to 0x1400155c6 (name lookup 0x140335f10, 0x140015622 call 0x140015ec0). 0x1400156ec test ebx, ebx / jne 0x140015ac4; 0x1400156f4 cmp edi, 0x763 (handled at 0x140015700..0x14001581a); 0x14001581f mov rsi, [r12+0x14b0] (game 0x15b0, the list h