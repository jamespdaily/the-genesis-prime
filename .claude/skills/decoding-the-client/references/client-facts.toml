statement = "The client's start-up, in stages. The first stage takes the RealmDataCenter row named by the argument realmDataCenterId, logging 'Expected RealmDataCenterId' when the argument is absent (id 0) and 'Invalid RealmDataCenterId' when no row has that id; keeps the auth host (argument Auth) and the NC platform host (argument AuthNc); keeps gmode and amode (1 or 0; absent or 2 and above become 0); and keeps ncProgramId, taken from the row's ncProgramAuth (902 in every row) when absent. A later stage starts the network and the NC platform: it loads StsConnLib64.MT.dll (LoadStsConnLib) and starts it with the AuthNc host, using port 6600 when the host text gives none (StartNcPlatform)."
