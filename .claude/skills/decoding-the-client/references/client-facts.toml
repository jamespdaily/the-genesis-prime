["StsConnLib64.MT.dll!0x18002d0f0"]
statement = "The SRP group the library uses: N is the 1024-bit prime of RFC 5054 (EEAF0AB9ADB38DD69C33F80AFA8FC5E86072618775FF3C0B9EA2314C9C256576D674DF7496EA81D3383B4813D692C6E0E0D5D8E250B98BE48E495C1D6089DAD15DC7D7B46154D6B6CE8EF4AD69B15D4982559B297BCF1885C529F566660E57EC68EDBC3C05726CC02FD4CBF4976EAA9AFD5138FE8376435B9FC61D2FC0EB06E3), g is 2, k = H(N | g) and the proof's first part is H(N) xor H(g), H being SHA-256 over each number's bytes. A number's bytes, here and on the wire, are its 32-bit words low word first, each little-endian, with no zero top word (so N is 128 bytes and g is 02 00 00 00). A digest becomes a number by reading each of its eight 4-byte groups as a little-endian word, the first group the most significant (the groups are loaded in reverse into the little-endian word list, so the last group is word 0); this is not the digest read big-endian, which differs by the byte order inside each group: the digest of N | g starts 8F 05 78 7D and k starts 0x7D78058F, k = 0x7D78058F0E39285AB924601B3E49AC400652ABEF7D9CCE1D52AABFBC57FF397A. The vector vector.StsConnLib64.MT.dll!0x18002d4e0.srp confirms it: with this reading of each digest (k, u and x) a model of the exchange reproduces the vector's verifier, B, S, session key, M1 and M2 byte for byte, and with the big-endian reading it reproduces none of them."
proof = "Decompiled: 32 dwords of the table 0x18012cd30 copied in reverse order into BigNumFromBytes 0x1800f48c0 (dword i of the input is word i, little-endian); 0x1800f4ce0(g, 2); Sha256Parts 0x180039a30 of (BigNumBytes(N), BigNumBytes(g)) loaded with the groups reversed into k 0x1801b9018; H(N) into 0x1801b8fb8 xor H(g). BigNumBytes 0x1800f4650 returns the word array and top*4. Emulator: run with the three numbers initialised by BigNumInit 0x1800f5360, read back N, g = 2, k and 0x1801b8fb8 equal to the hand model (vector.StsConnLib64.MT.dll!0x18002d4e0.srp)."
