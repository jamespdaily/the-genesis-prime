name = "StartPreGameInterface"

["0x1400447f0"]
statement = "The Lua function ReloadUI(): reloads the in-world interface (ReloadWorldInterface) and returns no values. Only a protected addon has it: the Options addon, under UI\\ProtectedAddons, calls it, while a user addon that calls ReloadUI finds a nil global (live, 2026-10-28: GenesisReport.lua raised 'attempt to call global ReloadUI (a nil value)'). A user addon reloads the interface with RequestReloadUI(), as Carbine's /reloadui command does (UI/Macros/Macros.lua line 119), which wrote GenesisReport's saved data in the same session."
