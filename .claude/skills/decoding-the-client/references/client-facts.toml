["opcode.0x637"]
statement = "Message 0x637 (1591), client to server: the player's movement commands. Fields: the client clock in milliseconds when sent, the number of commands, and the commands. It is sent only by FlushPlayerMovementCommands, at most once per movement send interval (125 ms until the server sets it with message 0xf1, then 25 to 1000 ms), only while the player unit is under client control, and only when the queued commands hold a change; a player standing still sends none. A dash flushes it on every movement update while the dash lasts."
proof = "0x14057a333 mov edx, 0x637; 0x14057a340 mov eax, [0x140c636a8] (the clock) stored first; 0x14057a34d mov [rbp-0x3c], ecx (the count from 0x140799e80's output); 0x14057a357 the command pointer; 0x14057a35b call 0x1403f4900. Registered in 0x1400a8190 with size 0x10 and routines 0x1400b04c0, 0x1400b0560, 0x1400b06f0. No other send site passes 0x637: the immediate ids before every call of 0x1403f4900 and 0x1403f4740 were collected from the disassembly. Sending rule: see the records of 0x14057a2c0, 0x140799e80 and 0x1403a25c0."
grade = "fairly sure"
gap = "The wire layout of the commands (routines 0x1400b0560 and 0x1400b06f0) is not read, nor the message's id in the outer wrapping (0x1403f4900 nests it in message 0x38c, sent as 0x244)."

["opcode.0xf1"]
statement = "Message 0xf1 (241), server to client. Body: values of 2, 32, 8 and 32 bits, in that order, none aligned to a byte (74 bits, padded to 10 bytes). Its handler stores the first three, and the fourth is the player's movement send interval in milliseconds: values below 25 become 25 and above 1000 become 1000. Until it arrives the interval is 125 ms. The client has no writer for it. Its handler also sets the world flag that the end of loading waits for (CheckWorldLoaded), so the client does not finish entering a world without it."
proof = "Registered at 0x140078d86 mov edx, 0xf1 with 0x140078d7f lea r8d, [r9+0x10] (size), 0x140078d68 lea rcx, [0x1400a37d0] stored at 0x140078d7a (reader) and 0x140078d8b mov qword ptr [rsp+0x20], 0x0 (no writer). ReadMessage00F1Body: ReadBits32 width 2 (record offset 0), 0x20 (offset 4), ReadBits8 width 8 (offset 8), ReadBits32 width 0x20 (offset 0xc). HandleWorldMessage's jump table entry for 241 is 0x1403ec80b: 0x1403ec811 call 0x1403b67e0. There 0x1403b69b0 mov eax, dword ptr [r14+0xc]; 0x1403b69b4 cmp eax, 0x19; jae; 0x1403b69b9 mov dword ptr [0x140c3a004], 0x19; 0x1403b69c5 mov ecx, 0x3e8; 0x1403b69ca cmp eax, ecx; 0x1403b69cc cmova eax, ecx; 0x1403b69cf mov dword ptr [0x140c3a004], eax. Bytes at 0x140c3a004: 7d000000 (125). Emulator: vector.opcode.0xf1.body. HandleMessage00F1 0x1403b67e0: 0x1403b6806 mov dword ptr [rcx+0x6420], 0x1 on the world handler; CheckWorldLoaded 0x1403e8399 cmp dword ptr [rbx+0x6420], r13d returns not loaded while it is 0; the only other store, 0x1403b711c in 0x1403b6de0, is on a world change."
grade = "fairly sure"
gap = "What the first three fields mean is not read."

["0x140c3a004"]
statement = "The player's movement send interval in milliseconds: 125 in the file, set by server message 0xf1 and kept between 25 and 1000. FlushPlayerMovementCommands re-arms itself after this interval; each queued batch of commands is stamped with the clock plus twice this interval; a unit's server-time estimate takes a new sample only when half this interval has passed since the last."
proof = "Bytes at 0x140c3a004: 7d000000. Writes: 0x1403b69b9 and 0x1403b69cf (the clamp in 0x1403b67e0). Reads: 0x14057a3a8 mov edx, [0x140c3a004] then 0x14057a3d2 call 0x140195960 (the timer, due time = the scheduler's time plus this argument); 0x14057a4c1 in 0x14057a450 (the same re-arm when control is taken); 0x14057a1b4 mov r8d, [0x140c3a004]; 0x14057a1c0 lea esi, [rax + 2*r8] with eax the clock at 0x140c636a8; 0x14079abd2 mov eax, [0x140c3a004]; 0x14079abd8 shr eax. The clock is milliseconds: 0x14018cddc stores 0x14018cdf0's count of performance-counter ticks divided by the divisor 0x140c88498, which 0x14018ccf0 sets to the counter frequency divided by 1000, rounded."
grade = "sure"

["0x14057a2c0"]
statement = "Sends the player's queued movement commands, as a self-repeating timer. When there is no player unit or it is not under client control, it clears the queue and stops the timer. Otherwise it collapses the queue (CollapseMovementCommands) and, when any command is left to send, sends message 0x637 with the clock, the count and the commands; it sends message 0x63a with the old and new value when a unit state value has changed; then it re-arms itself to run again after the movement send interval. UpdatePlayerMovement also calls it directly to send at once."
proof = "0x14057a2e0 cmp dword [rax+0xd50], 0 (the player unit at game object 0x6490, its client-control flag); not set: 0x14079a4f0 clears the queue at game 0x7088 and 0x140195d70 stops the timer at game 0x7030. 0x14057a2f8 add rcx, 0x7088; 0x14057a312 call 0x140799e80; 0x14057a329 test ecx, ecx; je (no send when nothing is left); 0x14057a333 mov edx, 0x637; 0x14057a35b call 0x1403f4900. 0x14057a367 mov edi, [rax+0x17e8]; 0x14057a373 cmp edi, eax (game 0x7150); 0x14057a37d mov edx, 0x63a; 0x14057a38f call 0x1403f4900. Re-arm: callback 0x14057a2c0 stored, 0x14057a3a8 mov edx, [0x140c3a004]; 0x14057a3ae lea rcx, [rbx+0x7030]; 0x14057a3d2 call 0x140195960. Callers: 0x1403988d0 (2 sites), 0x1403a25c0 (4 sites), 0x14053a990; armed by 0x14057a450."
grade = "sure"
name = "FlushPlayerMovementCommands"

["0x14057a190"]
statement = "Appends a batch of movement commands to the player's send queue, first adding a time command (type 0) whose time is the clock plus twice the movement send interval, then the batch's commands, each 0x48 bytes; it empties the batch. Does nothing when the send timer is not set up."
proof = "Decompiled: returns unless game object 0x7040 is set; 0x14057a1b4 mov r8d, [0x140c3a004]; 0x14057a1c0 lea esi, [rax + 2*r8] (rax the clock 0x140c636a8); grows the array at game 0x7098 (count 0x7088, capacity 0x708c) by doubling from 8, entry size 0x48; new entry type 0 with the time at entry offset 8; memcpy of count x 0x48 bytes from the batch; batch count and its second word set to 0. Callers: 0x14039daf0, 0x14039fb30, 0x14039fff0, 0x1403a0670, 0x1403a25c0, 0x14046bb00, 0x14046bd10, 0x14047fc40, 0x14057a450, 0x1405b3fc0."
grade = "sure"
name = "QueuePlayerMovementCommands"

["0x140799e80"]
statement = "Collapses the player's movement command queue into the commands to send. Commands fall in 8 classes by type (type 0, the time command, in none). For each class it drops a new command equal to the previous one of its class, and a middle command its neighbours predict (MovementCommandIsRedundant); a time command is kept only when a command after it is kept. It returns the kept commands and leaves in the queue the latest command of each class, for the next comparison. When nothing changed since the last send the result is empty."
proof = "Decompiled: per-entry class from the table at 0x140b50f70 (bytes read: type 0 -> 8, 1 -> 0, 2..7 -> 1, 8..10 -> 2, 11..13 -> 3, 14..21 -> 4, 22..23 -> 5, 24..26 -> 6, 27..29 -> 7); entries before the queue's kept count (queue word 2) start not-to-send; chains of the same class: 0x1407999e0 on (older, middle, newer) clears the middle; per class tail 0x140799880(previous, last) clears the last; reverse pass marks a type-0 entry to send when a later entry of its group is sent; the send array (count 0x48-byte entries) goes to the output, the kept array becomes the queue with its count stored in queue words 0, 1 and 2. Called by 0x14057a2c0 at 0x14057a312."
grade = "fairly sure"
gap = "The pass that builds the per-class chains (decompiled lines with the predecessor array) is read from Ghidra's decompile only, not checked by emulation."
name = "CollapseMovementCommands"

["0x140799880"]
statement = "Tells whether two movement commands are equal: same type, and for types 1, 10, 13, 21, 24, 26 and 27 the same 32-bit value; for 2, 14 and 19 the same three values and flag; for 8 and 11 the same packed vector and flag; for 18 and 22 their two fields; type 29 always equal; other types never equal."
proof = "Decompiled switch on the first word: cases 1, 0xa, 0xd, 0x15, 0x18, 0x1a compare word 2; 2, 0xe, 0x13 compare the 8 bytes at word 2, word 4 and word 5; 8, 0xb compare words 4, 2 and the short at word 3; 0x12 words 3 and 2; 0x16 word 3 and the short at word 2; 0x1b word 2; 0x1d returns true; default false."
grade = "fairly sure"
gap = "Read from Ghidra's decompile, not from the instructions or by emulation; what each command type means beyond 0 (time), 1 (platform unit), 2 (position), 8 and 11 (packed vectors), 14 (rotation) is not read."
name = "MovementCommandsEqual"

["0x1407999e0"]
statement = "Tells whether the middle of three movement commands of one type can be left out: true when all three are equal, or when the middle one lies close to the value its neighbours give by linear interpolation in time: for positions (type 2) within 0.1 world units, for the packed vectors (types 8 and 11) within 1, for rotations (type 14) within an angle step, for type 22 within a small threshold; only when the middle command's interpolate flag is set."
proof = "Decompiled: types differ -> false; equal times -> true; both pairs equal (0x140799880) -> true; type 2 with word 5 set: squared distance from the time interpolation < the float at 0x140b79d3c (bytes 0ad7233c = 0.01, so 0.1 units); types 8 and 0xb with word 4 set: after unpacking (0x1401adb90), squared distance < the float at 0x140b79ed0 (1.0); type 0xe with word 5 set: per-axis angle test against 0x140c3b438 scaled; type 0x16 with word 3 set: absolute difference < 0x140b79da4."
grade = "fairly sure"
gap = "Read from Ghidra's decompile, not by emulation; the rotation and type 22 thresholds are not worked out as numbers."
name = "MovementCommandIsRedundant"

["0x1403a25c0"]
statement = "Updates the player's own movement once per game update, while the player unit exists, is the controlled unit and is under client control: it moves the unit and builds a batch of movement commands (platform, position, two packed vectors, rotation (left out in one unit state), state flags and mode), applies it to the unit and queues it to be sent (QueuePlayerMovementCommands). It sends the queue at once (FlushPlayerMovementCommands) while a dash is in progress, when a dash ends, before reporting a fall (message 0xfb) and before message 0xfc."
proof = "Early returns 0x1403a25c0..: game 0x6490 null, not equal to game 0x6488, unit 0xd50 zero, unit 0xdf4 == 1, unit 0x16e8 null. Batch: entries type 1 (word 2 the platform id), 2 (position, word 0x17 the interpolate flag), 8 and 0xb (0x1401c9800 packs a vector), then 0x14079a780 (type 0xe, skipped when unit 0x1620 is set), 0x14079a810 (type 0x18), 0x14079a990 (type 0x1b); 0x1405b3b80 applies it; 0x1403a62b3 call 0x14057a190. Direct sends: 0x14057a2c0 called when game 0x78d8 is set (set to 1 with 'DashCastSuccess' in 0x14039eff0), when the dash window from GameFormula rows 0x10c and 0x11b ends (game 0x78d8 cleared), before 0x1403f4900 with 0xfb and before 0xfc. Caller: 0x1403e85d0 (UpdateGame) at 0x1403e8942, once in each of its runs; it runs once a frame: 0x140008bc0 -> 0x1400094f0 -> 0x1400097d0 -> 0x140013d00 -> each stage's update, the world stage's 0x1400344d0 calling 0x1403e85d0 until it hands the game object over as a stage of its own, which 0x140013d00 then updates directly."
grade = "fairly sure"
gap = "Whether the frame of the hand-over runs 0x1403e85d0 twice is not read (see 0x1400344d0); the meaning of command types 8, 11, 24 and 27 is not read."
name = "UpdatePlayerMovement"

