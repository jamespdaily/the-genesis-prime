# The main loop, the frame rate and the video settings

["0x140008bc0"]
statement = "The client's main loop, run on the application object (the object at 0x140c635f0). It fails when the application is not set up or is already running; otherwise it marks it running and loops until a quit message arrives: it takes every waiting window message and dispatches it (after the window's accelerators), then either applies a pending window-mode change (ApplyWindowMode) or runs one pass (RunFramePass). After the loop it releases the renderer."
