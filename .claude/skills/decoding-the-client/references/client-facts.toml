["0x140334f90"]
statement = "Builds an IPv4 socket address from host text and a default port. Text of the form host:port takes its port from after the colon; otherwise the default port is used. A host starting with a digit is read as a dotted address; the host '$host$' means this machine (its own name, looked up); any other host is looked up by name. A failed lookup leaves the address 0.0.0.0."
proof = "Decompiled: family 2; 0x140335470 finds ':' (0x140335045); the part after it through 0x1407df3e4 then htons, else htons(default) (0x140335189 call [0x140959b30]); first character in '0'..'9' -> inet_addr (0x14033517a call [0x140959b40]); case-insensitive compare with '$host$' (bytes at 0x140c58bb8: '$host$'); different -> gethostbyname (0x140335219 call [0x140959b48]); equal -> gethostname (ordinal 57) then gethostbyname (0x14033523a). Callers: 0x140039456 (the auth host) and 0x14000d3a0 (the NC platform host)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile; that 0x1407df3e4 is a decimal parse is inferred. Ordinals 9, 11, 52 and 57 are read as htons, inet_addr, gethostbyname and gethostname from Windows' ws2_32.dll export table."
name = "SocketAddressFromHostText"

["0x140334bb0"]
