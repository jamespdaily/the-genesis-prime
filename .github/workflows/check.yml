name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # tested reads the check runs of the pull request head a merge came from.
  checks: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a push to main: whether the commit holds the files a passed run of the check
  # and tools jobs tested (the merge commit of a pull request that was current with
  # main does, and each job records the tree it tested as a notice). Then those two
  # jobs skip and warm-caches runs instead: a second run of the same files only adds
  # the chance of a flaky failure. Any error here leaves `tested` empty, and both
  # jobs run.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev/play_service/tested_tree.sh
          sparse-checkout-cone-mode: false
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if parent=$(dev/play_service/tested_tree.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" check tools); then
            echo "$GITHUB_SHA has the files that passed runs of check and tools tested on $parent"
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "no tested pull request head holds the files of $GITHUB_SHA (status $?)"
          fi

  # The tests of the tools that gate a merge (the check script, the setup check,
  # the table extractor). None needs the client, the database or the patched OTP, so
  # this job runs beside check instead of after it.
  tools:
    name: tools
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Record the tree tested
        run: echo "::notice title=tested tree::tested tree $(git rev-parse 'HEAD^{tree}')"
      - run: python3.13 -I -m unittest discover -s setup_check -p 'test_*.py'

  check:
    name: check
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    # A cold run builds the patched OTP in 146 seconds on the runner and the
    # whole cold job takes 3 minutes 11 seconds (run 40316762854). With the client's
    # data, ./check took 181 s on a normal runner and 359 s on a slow one (the world-data
    # test alone past 300 s), and its hang limit is 720 s (see GENESIS_CHECK_BUDGET_SECONDS
    # below); 20 minutes covers the cold setup, that limit and the steps after it.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The client's data is in the private repository dev/client_data.sh publishes to,
      # read with the secret CLIENT_DATA_KEY. A run without the secret (a fork's pull
      # request) has no client, and its check skips the client's parts. The patched OTP is
      # required either way, from GENESIS_OTP_DIR (set by the toolchain action), and first
      # on PATH for ./check.
      GENESIS_NO_CLIENT: ${{ secrets.CLIENT_DATA_KEY == '' && '1' || '' }}
      # The wall time ./check warns over, and a third of its hang limit (the only time
      # limit that fails the run): 181 s on a normal runner, 359 s on a slow one, so 240
      # warns on a slow runner and the hang limit of 720 s is twice the slowest run seen.
      GENESIS_CHECK_BUDGET_SECONDS: "240"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: toolchain
        uses: ./.github/actions/toolchain
      # The client's data is never cached: a fork's pull request can restore caches.
      - name: Fetch the client's data
        if: ${{ env.GENESIS_NO_CLIENT != '1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/genesis-client-data
          ssh-key: ${{ secrets.CLIENT_DATA_KEY }}
          path: client-data
          persist-credentials: false
      # Fails, naming the publishing command, when the data was packed from other versions
      # of the files it is made with. Variables name the client's exe and the world data, as
      # env.sh does on a development machine; there is no Ghidra here.
      - name: Unpack the client's data
        if: ${{ env.GENESIS_NO_CLIENT != '1' }}
        run: |
          dev/client_data.sh unpack client-data
          rm -rf client-data
          {
            echo "WILDSTAR_CLIENT_EXE=$HOME/.genesis-prime/client/Client64/WildStar64.exe"
            echo "GENESIS_WORLD_DATA=$HOME/.genesis-prime/world-data"
            echo "GENESIS_NO_QUERY_PROCESS=1"
          } >> "$GITHUB_ENV"
      # The client scripts' tests and the fact checker's name rule disassemble WildStar64.exe.
      - name: Install llvm-objdump
        if: ${{ env.GENESIS_NO_CLIENT != '1' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18
          echo "GENESIS_LLVM_OBJDUMP=/usr/lib/llvm-18/bin/llvm-objdump" >> "$GITHUB_ENV"
      - name: Record the tree tested
        run: echo "::notice title=tested tree::tested tree $(git rev-parse 'HEAD^{tree}')"
      - run: ./check
      # Saved after the check (also a failed one) when the key was new.
      - name: Save the Gleam build
        if: ${{ always() && steps.toolchain.outputs.gleam-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build
            !build/test_folder
            !build/apply_migrations_*
          key: ${{ steps.toolchain.outputs.gleam-cache-key }}

  # The test files a pull request adds or changes, run many times at once (see
  # dev/repeat_tests.py), so a test that depends on timing fails in the pull request
  # that brings it. It runs beside check on the same toolchain and build cache,
  # builds the code itself and saves no cache (check does). A pull request's checkout
  # is the merge of its head into its base, so the full history is fetched for the
  # merge base with the base branch. The files are chosen first, and the toolchain,
  # the build and the repeat run only when there are any. It does not wait for
  # `tested`, which runs only on a push.
  repeat:
    name: repeat
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GENESIS_NO_CLIENT: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Choose the added or changed test files
        id: files
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          files=$(python3.13 -I dev/repeat_tests.py --list "origin/$BASE_BRANCH")
          echo "$files"
          if [ -n "$files" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no added or changed test file, so nothing to repeat"
          fi
      - if: steps.files.outputs.any == 'true'
        uses: ./.github/actions/toolchain
      - name: Build the Gleam build
        if: steps.files.outputs.any == 'true'
        run: PATH="$GENESIS_OTP_DIR/bin:$PATH" gleam build
      - name: Repeat the added or changed test files
        if: steps.files.outputs.any == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: PATH="$GENESIS_OTP_DIR/bin:$PATH" python3.13 -I dev/repeat_tests.py "origin/$BASE_BRANCH"

  # On a push to main whose check was skipped: the caches a pull request restores
  # are only those saved on main, so this builds and saves what the key says is
  # missing, and does nothing when both are there.
  warm-caches:
    name: warm-caches
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          gleam-lookup-only: "true"
      - name: Build the Gleam build
        if: steps.toolchain.outputs.gleam-cache-hit != 'true'
        run: PATH="$GENESIS_OTP_DIR/bin:$PATH" gleam build
      - name: Save the Gleam build
        if: steps.toolchain.outputs.gleam-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build
            !build/test_folder
            !build/apply_migrations_*
          key: ${{ steps.toolchain.outputs.gleam-cache-key }}
