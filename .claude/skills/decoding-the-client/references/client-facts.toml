proof = "Slot 0x140 of the model class table 0x140b60160 (bytes at 0x140b60298). 0x1401e358f mov rbx, qword ptr [rdx+0x8]; 0x1401e35c3 mov rdi, qword ptr [rsi+0x8] (the list); 0x1401e35f5 cmp dword ptr [rax+0x20], edx (the adjustment search); 0x1401e3634 cmp dword ptr [rbx+0x1c], 0x1; 0x1401e363a mov ecx, dword ptr [rbx+0x18]; 0x1401e363d cmp ecx, 0x8; 0x1401e3650 jmp rdx (part 0..8 to the adjustment's words 0x40, 0x44, 0x48, 0x54, 0x50, 0x58, 0x60, 0x64, 0x68, decompiled)."
