["StsConnLib64.MT.dll!0x18000a350"]
statement = "Handles the reply to LoginStart and to each KeyData: reads its root element's KeyData child (base64), and gives the decoded bytes to the SRP client. While the SRP exchange is not finished it sends POST /Auth/KeyData with <Request><KeyData>base64 of the SRP client's answer</KeyData></Request> and the next sequence; when it is finished (the reply carried a valid M2) it takes the 64-byte session key, puts RC4 under that key on the connection, and only then reports success (0) to the client, which answers by sending LoginFinish. So every byte up to the end of the server's reply carrying M2 travels in clear both ways, the client's LoginFinish is the first message it ciphers, and the server's reply to LoginFinish is the first the client deciphers. A reply with no root element, or KeyData the SRP client refuses, fails the login with error 4; a failure to make the cipher fails it with error 48."
