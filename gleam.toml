name = "genesis_prime"
version = "0.1.0"
gleam = ">= 1.19.2 and < 2.0.0"
description = "A server for WildStar that the original client connects to and plays on."
licences = ["Apache-2.0"]
repository = { type = "github", user = "jamespdaily", repo = "the-genesis-prime" }

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
xmlm = ">= 1.0.1 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
ranch = ">= 2.3.0 and < 3.0.0"

[dev_dependencies]
argv = ">= 1.1.0 and < 2.0.0"
unitest = ">= 1.6.1 and < 2.0.0"
glinter = ">= 2.19.2 and < 3.0.0"
squirrel = ">= 4.7.0 and < 5.0.0"
glance = ">= 7.0.0 and < 8.0.0"
glexer = ">= 2.5.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
mug = ">= 3.1.0 and < 4.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[erlang]
# `crypto` is the OTP application behind SHA-256, HMAC and modular powers.
extra_applications = ["crypto"]
# OTP starts the application with this module's `start` and stops it with its
# `stop` (genesis_prime/application).
application_start_module = "genesis_prime/application"

[tools.glinter]
include = ["src/", "test/", "dev/"]
warnings_as_errors = true

[tools.glinter.rules]
# The writing-gleam skill allows `let assert` and `panic` with a message where
# a crash is the intended result; `panic_without_message` stays on.
assert_ok_pattern = "off"
avoid_panic = "off"

[tools.glinter.ignore]
# A generated table module exports what the engines use: its row type, `schema`,
# `get` and `all`. Only the registry and the tests call them until an engine
# does, which is no defect in generated code.
"src/genesis_prime/table/*.gleam" = ["unused_exports"]
# OTP calls the application's `start` and `stop` by the names in the application
# file, which the lint does not see.
"src/genesis_prime/application.gleam" = ["unused_exports"]
# squirrel writes each query's function with unlabelled `db` and `arg_1`
# parameters; the file is regenerated by `squirrel`, never edited by hand.
# The store's also holds the save query of the player's movement, which only
# the worker's save will call; the build commit of the step removes its
# `unused_exports` entry.
"src/genesis_prime/store/sql.gleam" = ["label_possible", "unused_exports"]
"src/genesis_prime/wire_recording/fixture/sql.gleam" = ["label_possible"]
"dev/genesis_prime/add_account/sql.gleam" = ["label_possible"]
"dev/genesis_prime/add_character/sql.gleam" = ["label_possible"]
"dev/genesis_prime/mark_rename/sql.gleam" = ["label_possible"]
# The player's movement is the shape the build is made on: its moves, speed
# setting, descriptions and answers, the game connection's `AfterSave` (public
# until the rule constructs its variants) and the start place's `moved` and
# `turned` are called only once the rule is built. The build commit of the step
# removes these three entries and makes `AfterSave` private.
"src/genesis_prime/game/movement.gleam" = ["unused_exports"]
"src/genesis_prime/game/connection.gleam" = ["unused_exports"]
"src/genesis_prime/game/start_place.gleam" = ["unused_exports"]
# The test runner finds public `_test` functions by name, and test-support
# modules are shared across test modules, so no other module calls them.
"test/**/*.gleam" = ["unused_exports"]
"test/*.gleam" = ["unused_exports"]

# Modules that may have effects; every other module is a pure rule.
[tools.code_rules]
effectful_modules = [
  { module = "genesis_prime", reason = "loads the game tables and the migration files and keeps the node alive" },
  { module = "genesis_prime/table/loader/store", reason = "reads the table files and keeps the loaded tables in persistent terms" },
  { module = "genesis_prime/application", reason = "is the OTP application: starts the root supervisor, starts the server's tree under it and waits for the tree to end" },
  { module = "genesis_prime/readiness", reason = "asks the store for the readiness probe and waits for its answer, retrying until a deadline" },
  { module = "genesis_prime/server", reason = "starts the supervision tree" },
  { module = "genesis_prime/connection/closer", reason = "closes every listener to new sockets when the server stops" },
  { module = "genesis_prime/seed", reason = "draws a seed from the operating system's random source" },
  { module = "genesis_prime/connection/script", reason = "draws a connection's seed from the operating system and starts its timers with the operating system's timer" },
  { module = "genesis_prime/connection/shell", reason = "owns a client socket and carries out its rule's effects" },
  { module = "genesis_prime/connection/listener", reason = "starts a Ranch listener under the supervision tree" },
  { module = "genesis_prime/connection/registry", reason = "starts OTP's pg scope under the supervision tree, and joins and looks in it for a connection shell" },
  { module = "genesis_prime/wire_recording/recorder", reason = "writes a connection's wire recording to a file, a line after each socket read and write" },
  { module = "genesis_prime/wire_recording/fixture/sql", reason = "the queries squirrel generates, run on pog's pool" },
  { module = "genesis_prime/wire_recording/fixture", reason = "writes the rows a recorded session starts from to a file and runs them on a database" },
  { module = "genesis_prime/step/runtime", reason = "reads the clock and the node's unique numbers and writes log lines for a shell" },
  { module = "genesis_prime/step/watch", reason = "monitors the processes a shell's rule watches, for the service shell and the connection shell" },
  { module = "genesis_prime/service", reason = "reaches a named service by a send, for an asker's directory" },
  { module = "genesis_prime/service/shell", reason = "runs a service's rule as a named actor and carries out its effects" },
  { module = "genesis_prime/store/worker", reason = "runs one ask's query on the database pool in a worker of its own" },
  { module = "genesis_prime/store/sql", reason = "the queries squirrel generates, run on pog's pool" },
  { module = "genesis_prime/world_map/registry", reason = "the registry actor that finds a map by its id and starts it under the map supervisor, monitoring each" },
]
# Erlang functions a rule module's externals may call.
pure_erlang = [
  "genesis_prime_tbl_file_ffi:utf16_text",
  "genesis_prime_tbl_file_ffi:gap",
  "genesis_prime_tbl_file_ffi:table_of",
  "genesis_prime_tbl_file_ffi:row",
  "genesis_prime_tbl_file_ffi:rows",
  "genesis_prime_login_ffi:mod_pow",
  "genesis_prime_sts_wire_ffi:find",
  "erlang:term_to_binary",
]
# Modules that may make an atom from a string or read a term from bytes.
atom_or_term = []

# The licences a package may carry; a package with none of them fails the check.
[tools.licences]
accepted = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
# A package that states no licence where the rule reads it, checked by hand.
declared = [
  { package = "ranch", licence = "ISC", evidence = "its LICENSE file and its Hex metadata, checked 2026-10-27" },
]
