name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # tested reads the check runs of the pull request head a merge came from.
  checks: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a push to main: whether the commit holds the files a passed run of the gate (the
  # job named check) and tools tested (the merge commit of a pull request that was
  # current with main does, and each job records the tree it tested as a notice). Then
  # the part jobs, the gate and tools skip and warm-caches runs instead: a second run of
  # the same files only adds the chance of a flaky failure. Any error here leaves
  # `tested` empty, and every job runs.
  tested:
    if: github.event_name == 'push'
    # ubuntu-24.04, not ubuntu-latest: the llvm-18 package and the prebuilt OTP the jobs install exist for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev/play_service/tested_tree.sh
          sparse-checkout-cone-mode: false
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if parent=$(dev/play_service/tested_tree.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" check tools); then
            echo "$GITHUB_SHA has the files that passed runs of check and tools tested on $parent"
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "no tested pull request head holds the files of $GITHUB_SHA (status $?)"
          fi

  # The tests of the tools that gate a merge (the check script, the setup check,
  # the table extractor). None needs the client, the database or an OTP, so
  # this job runs beside the part jobs instead of after them.
  tools:
    name: tools
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # A pull request's checkout is the merge commit of the head into the base, so its first
      # parent is the base: a migration the base has is never modified, deleted or renamed.
      - name: No migration of the base is changed
        if: ${{ github.event_name == 'pull_request' }}
        run: python3.13 -I dev/migration_base.py HEAD^1
      - name: Record the tree tested
        run: echo "::notice title=tested tree::tested tree $(git rev-parse 'HEAD^{tree}')"
      - run: python3.13 -I -m unittest discover -s setup_check -p 'test_*.py'

  # On a pull request: whether the files it changes are all in the light set of ./check
  # (guidance and untested tools), which only the parts of ./check fast read. The checkout
  # is the merge commit of the head into the base, so its first parent is the base and the
  # files changed against it are the pull request's. Any error here leaves `light` empty,
  # and every leg runs.
  scope:
    name: scope
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        run: |
          status=0
          ./check scope HEAD^1 || status=$?
          if [ "$status" = 0 ]; then
            echo "light=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 1 ]; then
            exit "$status"
          fi

  # One leg per part of ./check, each on a runner of its own (`./check part NAME`; gleam-test
  # in shards of the test modules, `./check part gleam-test K/N`). Every leg sets itself up
  # the same way, so the setup is stated once; a leg that needs no client, database or build
  # pays for them beside its own work, which costs no wall time. A change in the light set
  # runs the `fast` legs only: the steps of the others are skipped, so their jobs end
  # `success` and the gate never accepts a skipped job. A network step is run again once
  # when it fails, and a second failure fails the leg. The build is saved by the gleam-build
  # leg only. A run of a push to main whose tree a passed pull request tested runs none.
  part:
    name: ${{ matrix.name }}
    needs: [tested, scope]
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # A part that keeps using CPU is
    # stopped and named by the check at its wall cap of 1500 s (GENESIS_CHECK_WALL_CAP_SECONDS
    # below), so 30 minutes covers the cold setup, that cap and the steps after it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: format, fast: true}
          - {name: gleam-build, fast: true}
          - {name: glinter, fast: true}
          - {name: fact-checker, fast: true}
          - {name: generated-tables}
          - {name: gleam-test 1/3}
          - {name: gleam-test 2/3}
          - {name: gleam-test 3/3}
          - {name: real-start}
          - {name: real-tables}
          - {name: world-data}
          - {name: migrations}
          - {name: squirrel}
          - {name: client-suite}
    env:
      # The client's data is in the private repository dev/client_data.sh publishes to,
      # read with the secret CLIENT_DATA_KEY. A run without the secret (a fork's pull
      # request) has no client, and its check skips the client's parts.
      GENESIS_NO_CLIENT: ${{ secrets.CLIENT_DATA_KEY == '' && '1' || '' }}
      # The wall time a part warns over, and a third of the time after which a part that
      # has used no CPU for the idle window is hung.
      GENESIS_CHECK_BUDGET_SECONDS: "400"
      # The wall time at which a part is hung whatever it does: below the job's timeout
      # less the cold setup, so the check names a hung part and GitHub does not kill it.
      GENESIS_CHECK_WALL_CAP_SECONDS: "1500"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.fast || needs.scope.outputs.light != 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ matrix.fast || needs.scope.outputs.light != 'true' }}
        with:
          python-version: "3.13"
      - id: toolchain
        if: ${{ matrix.fast || needs.scope.outputs.light != 'true' }}
        uses: ./.github/actions/toolchain
      # The database every part reads, on the runner's Docker; pulled again once when the
      # registry fails.
      - name: Start Postgres
        id: postgres
        if: ${{ matrix.fast || needs.scope.outputs.light != 'true' }}
        continue-on-error: true
        run: |
          docker rm -f postgres 2> /dev/null || true
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15 \
            postgres:18
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 1
          done
          exit 1
      - name: Start Postgres again
        if: ${{ steps.postgres.outcome == 'failure' }}
        run: |
          docker rm -f postgres 2> /dev/null || true
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15 \
            postgres:18
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 1
          done
          exit 1
      # The client's data is never cached: a fork's pull request can restore caches.
      - name: Fetch the client's data
        id: client_data
        if: ${{ env.GENESIS_NO_CLIENT != '1' && (matrix.fast || needs.scope.outputs.light != 'true') }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/genesis-client-data
          ssh-key: ${{ secrets.CLIENT_DATA_KEY }}
          path: client-data
          persist-credentials: false
      - name: Fetch the client's data again
        if: ${{ steps.client_data.outcome == 'failure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/genesis-client-data
          ssh-key: ${{ secrets.CLIENT_DATA_KEY }}
          path: client-data
          persist-credentials: false
      # Fails, naming the publishing command, when the data was packed from other versions
      # of the files it is made with. Variables name the client's exe and the world data, as
      # env.sh does on a development machine; there is no Ghidra here.
      - name: Unpack the client's data
        if: ${{ env.GENESIS_NO_CLIENT != '1' && (matrix.fast || needs.scope.outputs.light != 'true') }}
        run: |
          dev/client_data.sh unpack client-data
          rm -rf client-data
          {
            echo "WILDSTAR_CLIENT_EXE=$HOME/.genesis-prime/client/Client64/WildStar64.exe"
            echo "GENESIS_WORLD_DATA=$HOME/.genesis-prime/world-data"
            echo "GENESIS_NO_QUERY_PROCESS=1"
          } >> "$GITHUB_ENV"
      # The client scripts' tests and the fact checker's name rule disassemble WildStar64.exe.
      - name: Install llvm-objdump
        id: llvm
        if: ${{ env.GENESIS_NO_CLIENT != '1' && (matrix.fast || needs.scope.outputs.light != 'true') }}
        continue-on-error: true
        run: |
          # llvm-18 comes from Ubuntu's own repositories; the runner's Microsoft one
          # can answer 403 and stop apt-get update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18
          echo "GENESIS_LLVM_OBJDUMP=/usr/lib/llvm-18/bin/llvm-objdump" >> "$GITHUB_ENV"
      - name: Install llvm-objdump again
        if: ${{ steps.llvm.outcome == 'failure' }}
        run: |
          # llvm-18 comes from Ubuntu's own repositories; the runner's Microsoft one
          # can answer 403 and stop apt-get update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18
          echo "GENESIS_LLVM_OBJDUMP=/usr/lib/llvm-18/bin/llvm-objdump" >> "$GITHUB_ENV"
      - name: Check the part
        if: ${{ matrix.fast || needs.scope.outputs.light != 'true' }}
        run: ./check part ${{ matrix.name }}
      # Saved after the check (also a failed one) when the key was new.
      - name: Save the Gleam build
        if: ${{ always() && matrix.name == 'gleam-build' && steps.toolchain.outputs.gleam-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build
            !build/test_folder
            !build/apply_migrations_*
          key: ${{ steps.toolchain.outputs.gleam-cache-key }}

  # The one check branch protection requires of the parts: it passes only when every leg
  # of `part` and `tools` succeeded (dev/ci_gate.py), and records the tree it tested as a
  # notice unless the change was light (then main's push runs every part). It
  # runs when a leg fails, and it fails when the run is cancelled. The leg jobs are
  # named after their parts, so none is named check, tools or repeat.
  check:
    name: check
    needs: [tested, scope, tools, part]
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: dev/ci_gate.py
          sparse-checkout-cone-mode: false
      - name: Pass only when every leg passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I dev/ci_gate.py "$(git rev-parse 'HEAD^{tree}')"

  # The test files a pull request adds or changes, run many times at once (see
  # dev/repeat_tests.py), so a test that depends on timing fails in the pull request
  # that brings it. It runs beside check on the same toolchain and build cache,
  # builds the code itself and saves no cache (check does). A pull request's checkout
  # is the merge of its head into its base, so the full history is fetched for the
  # merge base with the base branch. The files are chosen first, and the toolchain,
  # the build and the repeat run only when there are any. It does not wait for
  # `tested`, which runs only on a push.
  repeat:
    name: repeat
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GENESIS_NO_CLIENT: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Choose the added or changed test files
        id: files
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          files=$(python3.13 -I dev/repeat_tests.py --list "origin/$BASE_BRANCH")
          echo "$files"
          if [ -n "$files" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no added or changed test file, so nothing to repeat"
          fi
      - if: steps.files.outputs.any == 'true'
        uses: ./.github/actions/toolchain
      - name: Build the Gleam build
        if: steps.files.outputs.any == 'true'
        run: gleam build
      - name: Repeat the added or changed test files
        if: steps.files.outputs.any == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: . setup_check/environment.sh && python3.13 -I dev/repeat_tests.py "origin/$BASE_BRANCH"

  # On a push to main whose check was skipped: the caches a pull request restores
  # are only those saved on main, so this builds and saves what the key says is
  # missing, and does nothing when both are there.
  warm-caches:
    name: warm-caches
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          gleam-lookup-only: "true"
      - name: Build the Gleam build
        if: steps.toolchain.outputs.gleam-cache-hit != 'true'
        run: gleam build
      - name: Save the Gleam build
        if: steps.toolchain.outputs.gleam-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build
            !build/test_folder
            !build/apply_migrations_*
          key: ${{ steps.toolchain.outputs.gleam-cache-key }}
