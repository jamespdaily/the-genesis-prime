["CharacterCreation.characterCreationStartEnum"]
statement = "The start a CharacterCreation row is for, a PreGameLib.CodeEnumCharacterCreationStart value. Of the 350 rows: 64 have 0 (Arkship), all disabled; 14 have 1 (Demo01); 5 have 2 (Demo02); 131 have 3 (Nexus, the Lua's Veteran choice); 67 have 4 (PreTutorial, the Lua's Novice choice); 67 have 5 (Level50); 2 have 99 (CostumeOnly). The client uses it only to choose and to stage: the creation Lua offers the rows of the start the player picks (Novice, Veteran or Level 50; Veteran only when IsCharacterCreationStartAllowed(Nexus)); after a successful create the client plays the character at once for 3 and 5 and first runs an intro sequence for any other start (kind 5 for faction 166, 4 for faction 167); a free level-50 entitlement can pay for a row with 5. No client table or code maps the start, or the row's faction, class or race, to a world, a WorldLocation2 row or a position: the server names the world and position in message 0xad."
proof = "CharacterCreation.tbl rows counted by characterCreationStartEnum, enabled and factionId. The start is row word 0x5c: HandleMessage00DC 0x140022019 mov eax, dword ptr [rax+0x5c]; 0x140022021 sub eax, 0x3; 0x140022024 test eax, 0xfffffffd; 0x140022029 je 0x14002210a (play now); else 0x140022047 call 0x14001c590, 0x1400220a8 cmp eax, 0xa6 / 0x1400220af mov edx, 0x5, 0x1400220b6 cmp eax, 0xa7 / 0x1400220bd mov edx, 0x4. Other reads: 0x140025e24 cmp dword ptr [r8+0x5c], r14d (GetCharacterCreation 0x140025c50), 0x140026815 cmp dword ptr [r8+0x5c], r15d (IsCharacterCreationStartAllowed 0x1400266f0), 0x140026c4f cmp eax, dword ptr [rbx+0x5c] (0x1400268c0). Lua UI/PreGame/Character/Character.lua (ClientData.archive): lines 2704-2715 give NoviceBtn PreTutorial, ExpertBtn Nexus, Level50Btn Level50; line 1291 IsCharacterCreationStartAllowed(Nexus); lines 1839-1845 the texts CRB_Tradeskill_Novice, CRB_Veteran, PreGame_Level50; no place is named. Column names of all 384 tables: none links CharacterCreation or its start to a world, a WorldLocation2 row or a position; the WorldLocation2 references belong to challenges, live events, housing, paths, public events, quests, taxis, datacubes, map nodes and zone exits; BindPoint holds only an id, a faction and a name."
grade = "fairly sure"
gap = "That the client holds no start place is a search, not a read of every reader of WorldLocation2 and World. Where each start puts a new character, and its facing, would be settled by a recording of a retail create and the first 0xad for each start and faction. A guess by World asset name only: 3460 Map\\NewPlayerExperience, 3400 Map\\PreTutorialExile, 1537 Map\\ExileArkShipTutorial and 1634 Map\\DominionArkShipTutorial for the tutorial starts, 1400 Map\\ExileArkshipCity and 1401 Map\\DominionArkshipCity as faction cities."

["CharacterCreation.xp"]
statement = "The experience a character made from the row starts with: 0 for PreTutorial rows (level 1), 1710 for Nexus rows (level 3), 340950 for Demo02 (level 20), 936310 or 1710 for Demo01 (level 25 or 3), 26360090 for Level50 (level 50), 0 for the disabled Arkship and CostumeOnly rows. The client reads it in one place: when it builds the creation choices, a row that needs no entitlement and costs no account currency is offered only when GetLevelForExperience of its xp is at most the account's highest character level (message 0x36, taken as at least 1), unless a client setting lifts the limit. No Lua function returns it."
