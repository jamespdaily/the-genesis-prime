["0x1401bcea0"]
statement = "Loads one directory of an archive index from its block: an empty block index means no directory; a block under 8 bytes is corrupt (E_Asset_Corrupt). The block starts with a u32 count of subdirectories and a u32 count of files, then 8 bytes per subdirectory, 56 bytes per file, then the name text, and every name offset must fall inside the name text."
