["opcode.0x63d"]
statement = "Message 0x63d (1597), auth server to client: the login is refused. Body: the reason (32 bits), a value (32 bits) and a float. The client ends the login and shows the reason's text, the value filling '$1c' where a text has it: 0 'NpLogin Error 0', 1 'NpLogin Success', 2 'Game Account Data Error', 3 to 9 'NpLogin Error 3' to 'NpLogin Error 9' (8 with the value), 10 'Invalid Authentication Method', 11 'NCSoft login service start timeout', 12 'NCSoft login service finish timeout', 13 'No valid WildStar game account found', 16 'Invalid Login Token', 17 'No data center permissions', 18 'No realms are available at this time', 19 'Client version does not match the game server version', 20 'This account is currently suspended. Please contact Customer Support for assistance.', 22 'A server error occurred while retrieving subscription information. Please try again in a few minutes.', 23 'Disconnected. Client/Server Login Data Mismatch.', 24 'Two-Step Verification is required for play. Please enable in Account Management to continue.', 25 'You must set up a subscription or add game time to your account before you can play.', 26 'You can't access this account from your current IP address.', 27 'Disconnected. Client/Server Region Mismatch.', any other 'An unknown error was encountered.'; 21 shows 'Your WildStar account is temporarily suspended for $1n hours.' with the float scaled to hours. No reason means the account is already logged in. The client has no writer for it."
proof = "Registered at 0x140078586 mov edx, 0x63d; 0x14007857f lea r8d, [r9+0xc]; 0x140078568 lea rcx, [0x140081b60] stored at 0x14007857a; 0x14007858b mov qword ptr [rsp+0x20], 0x0 (no writer). Reader 0x140081b60: 0x140081b85 mov r8d, 0x20 / 0x140081b8e call 0x14006c090; 0x140081b9b mov r8d, 0x20 / 0x140081ba4 call 0x14006c090; 0x140081bb4 call 0x14006c1c0 (ReadFloat). HandleLoginMessage 0x1400370d0 sends it to HandleMessage063D 0x140037db0: 0x140037dd3 cmp ecx, 0x15; 0x140037dd8 call 0x1400a7750 (LoginRefusalText); 0x140037ddd mov r8d, dword ptr [rdi+0x4]; 0x140037de6 call 0x1400383a0; reason 21: 0x140037df5 mov edx, 0x95d19. Texts from en-US.bin by the ids LoginRefusalText returns."
grade = "fairly sure"
gap = "The reader's widths and the handler's anchors are read; LoginRefusalText's jump table is read from Ghidra's decompile; the hours scale (0x140b7a064) is not read."

