name = "genesis_prime"
version = "0.1.0"
gleam = ">= 1.19.2 and < 2.0.0"
description = "A server for WildStar that the original client connects to and plays on."
licences = ["Apache-2.0"]
repository = { type = "github", user = "jamespdaily", repo = "the-genesis-prime" }

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
xmlm = ">= 1.0.1 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
ranch = ">= 2.3.0 and < 3.0.0"

[dev_dependencies]
argv = ">= 1.1.0 and < 2.0.0"
unitest = ">= 1.6.1 and < 2.0.0"
glinter = ">= 2.19.2 and < 3.0.0"
squirrel = ">= 4.7.0 and < 5.0.0"
glance = ">= 7.0.0 and < 8.0.0"
glexer = ">= 2.5.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
mug = ">= 3.1.0 and < 4.0.0"

[erlang]
# `crypto` is the OTP application behind SHA-256, modular powers and RC4.
extra_applications = ["crypto"]

[tools.glinter]
include = ["src/", "test/", "dev/"]
warnings_as_errors = true

[tools.glinter.rules]
# The writing-gleam skill allows `let assert` and `panic` with a message where
# a crash is the intended result; `panic_without_message` stays on.
assert_ok_pattern = "off"
avoid_panic = "off"

[tools.glinter.ignore]
# A generated table module exports what the engines use: its row type, `schema`,
# `get` and `all`. Only the registry and the tests call them until an engine
# does, which is no defect in generated code.
"src/genesis_prime/table/*.gleam" = ["unused_exports"]
# The frame cutter and the STS message's game code and description are kept
# protocol pieces whose callers, the connection and the login, are rebuilt on
# the shell and rule; until then nothing calls them.
"src/genesis_prime/connection/frame.gleam" = ["unused_exports"]
# The shell's run is called by Ranch through connection_shell_ffi:start_link, an
# Erlang callback, which the lint does not see.
"src/genesis_prime/connection/shell.gleam" = ["unused_exports"]
"src/genesis_prime/login/sts_message.gleam" = ["unused_exports"]
# The recording's types are the shape the shell's record mode and the replay
# are built on; no module records or replays, so no other module uses them.
"src/genesis_prime/rule_recording.gleam" = ["unused_exports"]
# The test runner finds public `_test` functions by name, and test-support
# modules are shared across test modules, so no other module calls them.
"test/**/*.gleam" = ["unused_exports"]
"test/*.gleam" = ["unused_exports"]

# Modules that may have effects; every other module is a pure rule.
[tools.code_rules]
effectful_modules = [
  { module = "genesis_prime", reason = "loads the game tables and keeps the node alive" },
  { module = "genesis_prime/table/loader/store", reason = "reads the table files and keeps the loaded tables in persistent terms" },
  { module = "genesis_prime/login/rc4", reason = "OTP's crypto holds the state of each RC4 stream" },
  { module = "genesis_prime/server", reason = "starts the supervision tree" },
  { module = "genesis_prime/connection/shell", reason = "owns a client socket and carries out its rule's effects" },
  { module = "genesis_prime/connection/listener", reason = "starts a Ranch listener under the supervision tree" },
  { module = "genesis_prime/rule_recording/file", reason = "writes a connection's recording to a file" },
]
# The game domains: each top-level folder or module under src/genesis_prime/.
domains = [
  { module = "genesis_prime/client_archive", reason = "reads the client's archive files, the only source of game data" },
  { module = "genesis_prime/connection", reason = "frames and the cipher of a player's connection" },
  { module = "genesis_prime/message", reason = "the generated codec for every packet layout" },
  { module = "genesis_prime/login", reason = "the login's protocol: SRP, the STS wire and its messages" },
  { module = "genesis_prime/table", reason = "the client's game tables, loaded once at start" },
  { module = "genesis_prime/server", reason = "the supervision tree every process starts under" },
  { module = "genesis_prime/step", reason = "the contract between each process's rule and its shell" },
  { module = "genesis_prime/rule_recording", reason = "the file a rule's inputs and steps are recorded in, for replay" },
  { module = "genesis_prime/world_map", reason = "the maps players share: their keys, rules and processes" },
]
# Erlang functions a rule module's externals may call.
pure_erlang = [
  "tbl_file_ffi:utf16_text",
  "tbl_file_ffi:gap",
  "tbl_file_ffi:table_of",
  "tbl_file_ffi:row",
  "tbl_file_ffi:rows",
  "genesis_prime_login_ffi:mod_pow",
  "erlang:term_to_binary",
  "rule_recording_ffi:decode_header",
  "rule_recording_ffi:decode_record",
]
# Modules that may make an atom from a string or read a term from bytes.
atom_or_term = []

# The licences a package may carry; a package with none of them fails the check.
[tools.licences]
accepted = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
# A package that states no licence where the rule reads it, checked by hand.
declared = [
  { package = "ranch", licence = "ISC", evidence = "its LICENSE file and its Hex metadata, checked 2026-10-27" },
]
