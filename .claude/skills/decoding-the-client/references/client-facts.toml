["0x1400b3bb0"]
statement = "Handles the NC platform's notice that the account was logged out of the platform (PresenceUserLogout, with a reason): logs 'PresenceUserLogout [<name>:<name>] Reason [<reason>]' and queues NC platform event 24 with the reason. HandleNcPlatformEvent then, unless the login has already passed to character select, ends the login with: reason 0 'Your account has been kicked', 1 'Your account has been banned', 2 'Another client has tried to log in with this account', 3 'The credentials for this account have been changed', any other 'An unknown error was encountered.' Once the client is in character select or the world it ignores the event."
proof = "0x1400b3c46 call 0x1401a3130 (Log) with the descriptor 0x141d0e070, whose text 0x140a13a30 reads 'PresenceUserLogout [%S:%S] Reason [%d]'; 0x1400b3c55 mov edx, 0x18 / 0x1400b3c5a call 0x1400b2550 (queues the event, the reason as its value). HandleNcPlatformEvent 0x140037220: 0x140037226 mov eax, dword ptr [rcx+0xa8] / 0x14003722f cmp eax, 0xb (login passed on: ignored); 0x140037242 cmp r8d, 0x18; 0x14003724c mov edx, dword ptr [rdx+0x28] (the reason); 0x14003727e mov ecx, 0x62f75 (reason 2) / 0x14003728b call 0x1400383a0; 0x140037264 mov ecx, 0x62f76 (reason 3). Texts 405362, 405363, 405365, 405366 and 196357 in en-US.bin. The library's class names include IPresenceUserLogout (StsConnLib64.MT.dll strings)."
grade = "fairly sure"
gap = "The handler is reached through a notify object (0x140b560b0) whose registration with StsConnLib is not read, and which STS message carries the notice and its reason is not read in the library. Whether retail sent it to the first client when a second logged in is not shown by the client."
name = "HandlePresenceUserLogout"

["lua.CharacterSelection.OnRemoveCountdown"]
statement = "Character select's handling of a character of the account still in the world, which message 0x117 names (its realm and character id, with the time until it is removed, in milliseconds): while that time is above 0 every other listed character, the create entries and the delete button are blocked and that one character is selected and left playable; a half-second timer counts down showing 'Logging Off <name>' and 'Other characters available in <seconds> seconds.', and at 0 unblocks the list. The client's text for 0x162 result 4 FailedCharacterInWorld, 'Your account has another character still in the world. Please try again in a minute.', names the refusal of playing another character meanwhile, and its create, delete and rename results 44, 42 and 43 (the *_CharacterOnline values) name the same case. So the client is built for a second login that is accepted into character select while the first session's character lingers in the world."
proof = "UI/PreGame/CharacterSelection/CharacterSelect.lua in ClientData.archive: line 79 ApolloTimer.Create(0.5, true, 'OnRemoveCountdown'); lines 188, 268-272 (DisabledBlocker on every character but nCharacterIndex, which is force-selected), 311-313 (timer started), 324, 366, 383, 406 (create entries blocked), 540-565 (the countdown, nCharacterRemoveTime - 500 per tick, / 1000 for seconds); texts CharacterSelect_LogOffName 615937 'Logging Off $1n', CharacterSelect_LogOffMessage 615894, CharacterSelect_SelectErrorFailedCharacterInWorld 570352 (LocalizedEnum.tbl, en-US.bin). HandleMessage0117 0x140021540 (decompiled): the realm and character id kept, the remove time plus the clock base kept, and nCharacterRemoveTime (the raw 32-bit value) and nCharacterIndex (the matching character's place from 1) put in the CharacterList event's third table only when the realm and the id are non-zero and a listed character has the id; the time is not tested (0x140021a7c cmp dword ptr [r14+0x200], 0x0; 0x140021a8c cmp qword ptr [r14+0x208], 0x0; 0x140021a9a test r13d, r13d, the matched place; 0x140021aa7 mov r10d, dword ptr [r15+0x50], the time as sent). So a time of 0 still blocks the delete button and starts the countdown, which unblocks at its first tick."
grade = "fairly sure"
gap = "The Lua is read from the archive with a scratch extractor. What retail did to the first session when the second logged in (disconnect it with 0x36a, and with which reason, or let it play on) is not in the client; a retail recording of a double login would settle it."

# Entering a world: terrain, the player unit's look and level, and the level-up reminder

["World.assetPath"]
statement = "The folder of a world's map files, for example Map\\PreTutorialExile. The world's terrain is the files named '<folder's last part>.<four hex digits>.area' in that folder (with '.tex' files beside them), and an optional '<last part>.map'. A World row whose folder the client's archive does not hold loads without any error, as a world with no terrain. World 3400 (Map\\PreTutorialExile) is such a row: ClientData.index has no Map\\PreTutorialExile folder (the name occurs only as UI\\Maps\\PreTutorialExile, the zone map art), so the client enters it with no ground, sky or zone. World 1537 (Map\\ExileArkShipTutorial) has 205 area files and World 3460 (Map\\NewPlayerExperience) has 108; WorldLocation2 has 259 rows in 1537, 161 in 3460 and one (50177) in 3400."
proof = "LoadWorld 0x1403e70d0 passes the row's word 8 (assetPath) and its part after the last backslash to CreateWorldAsset 0x1402d9ab0, which calls OpenWorldAsset 0x1402db830: 0x1402db8f9 lea r8, [0x140af0cb0] (the text '%s\\%s.map'), 0x1402db90f call 0x14001b370, 0x1402db93d call 0x1402db980. LoadWorldMapFile 0x1402db980: 0x1402dbab8 call 0x1401b5b50 opens the .map; with nothing opened it stores 0 at 0x638 and returns 0 (decompiled). ParseAreaFileName 0x1402dca80 accepts only '<name>.<4 hex>.area' (0x1402dcaf1 cmp word ptr [rbx+2*rdi], 0x2e; 0x1402dcb7a cmp eax, 0x80; 0x1402dcb81 cmp edx, 0x80; 0x1402dcb89 lea rdx, [0x140af0df0] '.area'). Archive: a scratch walk of Patch/ClientData.index (header per archive_index.header, directories per 0x1401bcea0, each subdirectory entry read as name offset then block index): Map holds ExileArkShipTutorial (415 files, 205 .area) and NewPlayerExperience but no PreTutorialExile; a byte search of the index finds 'PreTutorialExile' once, among the UI\\Maps folders. World.tbl rows 3400, 1537, 3460 and WorldLocation2.tbl counts read with a scratch reader. Live, 2026-10-26: the client entered world 3400 with plain grey ground and sky."
grade = "fairly sure"
gap = "How the area files are listed and streamed around the player (ParseAreaFileName is reached through a table at 0x140b62da0) is not traced, nor where the sky and lighting come from without terrain (the world setup loads WorldSky rows 1 and 35 when a world flag is set, 0x140353b34 and 0x140353b57). A live entry into world 1537 or 3460 at one of its WorldLocation2 rows would settle that terrain, sky and zone then load."

