["0x140c46410"]
statement = "The setting lod.viewDistance: the distance to which the world is drawn, a float with default 640, minimum 256 and maximum 1024. The client's hardware check picks 256, 640 or 1024 for low, medium and high machines. Each game update the client copies it into the world's render settings, lowering it when free memory is short but not below the smaller of 256 and the setting."
proof = "Initializer 0x14093fe60: 0x14093fe8b lea rdx, [0x140c46418] (the name 'lod.viewDistance' at 0x140b02578); 0x14093fe96 movss xmm8, [0x140c44cf0] (640.0) stored to 0x140c46430..0x140c4644c; 0x14093fe70 movss xmm6, [0x140c44c60] (256.0) to 0x140c46444; 0x14093fe7d movss xmm7, [0x140c44bd0] (1024.0) to 0x140c46448. Presets in 0x140017250: records 0x140c3b108, 0x140c3b078, 0x140c3af68, the float at record offset 8 = 0x43800000 (256), 0x44200000 (640), 0x44800000 (1024), applied at 0x140017685..0x140017696. 0x14043ddb0 (called by 0x1403e85d0 and 0x1403e70d0) keeps the effective value at game 0x72f0, floored by the smaller of the setting and 256 (0x140c44c60), and writes it to the render settings record's third word."
