["0x1400370d0"]
statement = "Handles server messages during login. Once the login has passed to character select it handles nothing (returns 1). From the auth server it handles message 3 (the server hello: CheckAuthServerVersion), 0x591 (login accepted, only while waiting for it: loads the account's settings file and keeps bit 0 of the first field), 0x3db (the hand-off to a game server: HandleMessage03DB), 0x3ef (ignored) and 0x63d (login refused); any other message ends the login with error 0x801B2. From the game server it was handed to it handles only message 3; any other ends the login with that error. While the login runs, ids it ignores or refuses and any message on another connection return 0 (taken), so no later handler sees them; the four handlers it passes messages to return their own results."
proof = "0x1400370e6 cmp ecx, 0xb (state) / 0x1400370eb lea eax, [rcx-0xa] (returns 1); 0x140037109 cmp edx, [rax+0x98] (the auth connection at 0xe8); 0x140037118 sub eax, 3 -> 0x1400371d6 jmp 0x140037b70; 0x140037121 sub eax, 0x3d8 -> 0x1400371c1 jmp 0x140037f30; 0x14003712c sub eax, 0x14 (0x3ef) -> return 0; 0x140037131 sub eax, 0x1a2 (0x591): 0x14003716e test (state - 6) & ~2, 0x140037183 call 0x1400114e0 (L'Account.%s.ini'), 0x140037191 and ecx, 1, 0x14003719a state 9; 0x14003713b cmp eax, 0xac (0x63d) -> 0x140037166 jmp 0x140037db0; 0x140037142 mov edx, 0x801b2; 0x140037147 call 0x1400383a0; 0x14003714c xor eax, eax. 0x1400371db mov rax, [rbx+0xf0] (the game connection); 0x1400371e5 je 0x14003714c and 0x1400371f1 jne 0x14003714c (neither connection: return 0); 0x1400371eb cmp edx, [rax+0x98]; 0x1400371fa cmp r8d, 3 -> 0x140037211 jmp 0x140038120, else 0x1400371fe jne 0x140037142. Every instruction of the .pdata range 0x1400370d0..0x140037216 read in llvm-objdump's listing."
grade = "sure"
name = "HandleLoginMessage"

["opcode.0x3"]
statement = "Message 3, server to client: the hello every server sends on a new connection. Body, in order: the build (32 bits), the realm id (32 bits), two more 32-bit values, a 64-bit value, a 16-bit value, a 5-bit value, the message table checksum (32 bits), a 32-bit value, a 64-bit value and a 32-bit value: 373 bits, padded to 47 bytes. From the auth server the client checks the build (16042) and the checksum (0x097998A0) and answers with its login request 0x592, or ends the login with 'versions do not match' or 'messages do not match'; from a game server it answers with 0x58f, its session key, and starts character select (or, after a realm switch, the same). From the game server reached by the auth hand-off, and only there, the realm id becomes the game's current realm: the id realm select compares with each realm's id (ChooseRealm: the current realm starts character select on the same connection, another waits for a hand-off 0x7a1) until playing a character replaces it with the character list's realm id (PlayCharacter). The client reads no other field of the hello: the third and fourth 32-bit values, the 64-bit value, the 16-bit value, the 5-bit value and the last three values are decoded and never read, so any value is safe there; from a realm switch's server no field is read. The client registers a writer for message 3 but no part of it sends one."
proof = "Registered in 0x1400a8190: 0x1400a81d7 lea edx, [rdi+0x3]; 0x1400a81da lea r8d, [rdi+0x38] (record size); 0x1400a81d0 lea r9, [0x1400a8e00] (sizer, 373 bits); 0x1400a81ba lea rcx, [0x1400a8e10] stored at 0x1400a81cb (writer); 0x1400a81a3 lea rcx, [0x1400a9140] stored at 0x1400a81b5 (reader); 0x1400a81b1 mov dword ptr [rsp+0x30], edi (mode 0). Widths in ReadMessage0003Body and WriteMessage0003Body; the 64-bit reads are 0x14006c120 (0x14006c16c mov r8d, 0x40). Reads of the record, every instruction of the three handlers read in Ghidra's disassembly: CheckAuthServerVersion 0x140037b70 reads word 0 (0x140037b96 mov r9d, dword ptr [rdx]; 0x140037bae cmp r9d, 0x3eaa, else L'Client(%d) Auth(%d) versions do not match' and error 0x41ccc) and word 8 (0x140037c8e mov r9d, dword ptr [rdx+0x20]; 0x140037c92 cmp r9d, 0x97998a0, else L'Client(0x%8X) Auth(0x%8X) messages do not match' and 0x41ccd), then 0x140037d8c call SendAuthLoginRequest, which never reads rdx (its first use is 0x14003a66e xor edx, edx; the refusal path sets 0x14003a940 mov edx, 0xd7). HandleLoginGameServerHello 0x140038120 keeps the record only in rbp (0x140038140 mov rbp, rdx) and reads it once: 0x140038325 mov edx, dword ptr [rbp+0x4]; 0x140038328 mov dword ptr [rax+0x1680], edx (the game object from 0x14003831e mov rax, [0x140c635f0]). HandleRealmSwitchServerHello 0x140046340 overwrites rdx at 0x1400463c1 lea rdx, [rsp+0x20] before any read and keeps no copy. No other handler reads message 3: HandleCharacterSelectMessage 0x140020ea0 tests ids 0x36, 0xad, 0xdc, 0xe6, 0xe7 and up (0x140020f17 sub r8d, 0x36 .. 0x140020f35 cmp r8d, 0xa) and sends 3 to 0x1400212e7 mov eax, 0x1 (not taken); HandleRealmSelectMessage 0x140045a70 passes 3 only from its second connection (0x140045b5b cmp r8d, 0x3; 0x140045b69 jmp 0x140046340) and returns 1 for it on the first (0x140045a7f); HandleWorldMessage starts at id 0x61 (0x1403ec6eb lea eax, [rbx-0x61]); ForwardServerMessage 0x140054ce0 and HandleMessages03CFTo03D2 (0x1404d618f) only pass it to another handler of that list. Game 0x1680 as the realm: ChooseRealm 0x140045bbb cmp dword ptr [rcx+0x1680], eax (the chosen realm's id) and 0x140045dee mov dword ptr [r8+0x1680], eax; PlayCharacter 0x14002358d/0x140023599 (the 0x117 realm id); 0x140036c5a mov dword ptr [rcx+0x1680], edi (0 when the login is reset); the game constructor 0x14000a645 mov qword ptr [rbx+0x1680], rsi (0, with 0x14000a4a7 xor esi, esi). No send: a scan of every call through network slots 0xf0 and 0x108 and of every call of 0x1403f4900 and 0x1403f4740 for an id loaded within the 30 instructions before found none with id 3, and Ghidra refs_to 0x1400a8e10 finds only the registration. Emulator: vector.opcode.0x3.body."
grade = "fairly sure"
gap = "That no other code reads the hello rests on HandleServerMessage's handler list, which comes from a class-table scan (see 0x140014f10). Which realm id the retail game server sent here is not in the client; the realm id of 0x117 and of the realm list 0x761 for the same realm is the consistent value. The send scan follows immediate ids only, so a send of 3 through an id held in memory would be missed."

["0x14003a620"]
statement = "Sends the login request, message 0x592, to the auth server, once its hello has passed the version check, and only while the NC platform login has finished (state 5); otherwise it ends the login with error 0xD7. The request holds the build (16042), a digest of the client's files, the account name (an account name over 250 characters makes the request fail to serialise and nothing is sent), two GUIDs parsed from the STS login's UserId and game token texts, four further values, a description of the machine and the realm data center id (opcode.0x592)."
proof = "0x14003a645 mov rbx, qword ptr [rcx+0xb0] (account name); 0x14003a652 je / 0x14003a658 cmp dword ptr [rcx+0xa8], 5; jne 0x14003a93d (error 0xd7). Decompiled: record word 0 = 0x3eaa; 64 bits from game 0x1628 (0x14003a73e mov rax, qword ptr [rdi+0x1628]); the name copied for at most 0x1f6 units into the record's 0xfb-unit field, which WriteCountedWideText 0x1400c2f70 refuses without a zero in its first 251 units; UuidFromStringA on the texts at 0x140c671c0 and 0x140c67200; 0x140335360 on 0x140c66ff0; the machine block from game 0x15c..0x1594; the row's ID (first dword of the RealmDataCenter row); network slot 0x108 serialises id 0x592, the cipher at the auth connection's 0x10 runs over it, slot 0xf0 sends it as 0x244 (0x14003a923 call qword ptr [rax+0xf0] after 0x14003a91d mov r8d, 0x244); state 6 whether or not it was sent."
grade = "fairly sure"
gap = "The record's sources are read from Ghidra's decompile. The two GUIDs are the STS login's UserId (HandleLoginFinishResult 0x1400b3070) and game token (HandleRequestGameTokenResult 0x1400b3a50); UuidFromStringA's result is not checked, so a text that is not a GUID leaves the previous GUID value in the request."
name = "SendAuthLoginRequest"

["opcode.0x3db"]
statement = "Message 0x3db (979), auth server to client: the hand-off to a game server. Body, in order: the server's IPv4 address (32 bits, as a number, so 127.0.0.1 is 0x7F000001), its port (16 bits), the 16-byte session key (as a GUID: 32, 16 and 16 bits and 8 raw bytes, so the 16 bytes in order), the account id (32 bits), the realm's name (wide text; it names the realm's settings file Realm.<account>.<realm>.ini and is GetRealmInfo's strName), the realm's flags (32 bits), the realm's PvP type (2 bits) and the realm note's text id (21 bits). No field is aligned to a byte. Accepted only after 0x591; the client opens a game connection to that address (HandleMessage03DB); the auth connection is not closed there. The account id: the client sends it back in 0x58f; it takes a friendship message 0x39c, 0x3aa or 0x3ad whose account id equals it as news of the player's own account (its personal status), and any other as news of a friend's account; it is part of the addon save data folder name (as 8 hex digits, so a new id for the same account leaves its saved addon data behind); and, when not 0, it is handed as decimal text to one more client object (unread). The last three fields, as in a realm list entry (0x761), are read only by CharacterScreenLib.GetRealmInfo: bit 4 of the flags is bFactionRestricted and no other bit is read; the PvP type is nRealmPVPType (PreGameLib.CodeEnumRealmPVPType: 0 PVE, 1 PVP; the character screens show 'PvP' for 1 and 'PvE' for any other value); a note text id of 0 gives no strRealmNote and no note is shown, any other gives the client's localized text with that id (empty when the id is unknown), shown on character select while the account has no character on the realm. A realm hand-off 0x7a1 replaces the last three, not the account id. The client has no writer for it."
proof = "Registered at 0x14006d3e7 mov edx, 0x3db with size 0x38 (0x14006d3e0 lea r8d, [r9+0x38]), reader 0x14007d6a0 (0x14006d3c9 lea rcx, [0x14007d6a0] stored at 0x14006d3db) and 0x14006d3ec mov qword ptr [rsp+0x20], 0x0 (no writer); widths in ReadMessage03DBBody. Handler 0x140037f30: state must be 9 (set by 0x591); 0x140038057 movzx r8d, word ptr [r14+4]; 0x14003805c mov edx, dword ptr [r14]; 0x140038069 call 0x140334bb0 (htonl, htons); key to game 0x1638..0x1647; 0x140037f9c mov r8d, dword ptr [rdx+0x18]; 0x140037fa0 mov dword ptr [rsi+0x1668], r8d; 0x140037fa7 cmp qword ptr [rsi+0x15c8], rbp / 0x140037fb0 test r8d, r8d (both needed) then 0x140037fb5 lea rdx, [0x1409d1b04] (L'%d'), 0x140037fc1 call 0x14018d540 and 0x140037fd5 call 0x140054350 with the object at game 0x15c8; text to 0x140011800 (L'Realm.%s.%s.ini' with game 0x1670, the account name; it keeps the name at game 0x1678); 0x140038004 mov eax, dword ptr [r14+0x28] / 0x140038010 mov dword ptr [rcx+0x1684], eax; 0x140038016 [r14+0x2c] to 0x14003801a [rcx+0x1688]; 0x140038020 [r14+0x30] to 0x140038024 [rcx+0x168c]. HandleMessage07A1 writes the same three at 0x1400462c0, 0x1400462ca, 0x1400462d4. Readers, from a scan of llvm-objdump's .text listing for every operand [reg+0x1668], [reg+0x166c], [reg+0x1680], [reg+0x1684], [reg+0x1688] and [reg+0x168c], each base traced back to a load of the game object from 0x140c635f0 (hits on other objects set aside: the 0x140c65898 object at 0x14050cb80..0x14050ccbb, the world handler at 0x1403b6074 and 0x1403c8796, the objects built by 0x1404218a0 and 0x140454380, and qword reads of pointers at 0x14035f459, 0x1407c3909..0x1407ce924), and for the same fields through the game's second base (game 0x100, whose methods, slots of the class table 0x140b55100, lie in 0x140008dc0..0x14001b000): [reg+0x1568]..[reg+0x158c] in 0x140008000..0x14001e000 hit only 0x14000b477..0x14000b491 in InitClientFromCommandLine, whose base is the game object itself (0x14000acbd mov r15, [0x140c635f0]), and a StartClient stack slot (0x14000fad8). Account id (game 0x1668): 0x1400381d9 and 0x140046400 (the 0x58f record); 0x1405e1219, 0x1405e13b9, 0x1405e1557 (cmp dword ptr [rdx], r8d against the message's first value, then 'FriendshipAccountPersonalStatusUpdate' when equal and 'FriendshipAccountDataUpdate' for the matching friend when not), reached from HandleWorldMessage's cases 0x1403f0a77, 0x1403f0a8d and 0x1403f0aa3, which bytes at 0x1403f1344 (the jump table, index = id - 0x61) give to ids 0x3ad, 0x39c and 0x3aa; BuildAddonSaveDataPath 0x140424279 and 0x140423201 (the 8 hex digits: L'%08x' at 0x140b00650, decompiled); 0x1405d2841 (0xf1206 minus the id, 0x1405d2947, handed to ReportError 0x1401971e0). Flags, PvP type and note (game 0x1684, 0x1688, 0x168c): read only by GetRealmInfo 0x140027900 (0x140027ad4, 0x140027b4b shr esi, 0x4, 0x140027b5a and esi, 0x1; 0x1400279b2; 0x140027b8f, 0x140027b95 test edx, edx, 0x140027b97 je 0x140027bdf, 0x140027b99 call 0x14034bdd0). Before any hand-off: the game constructor 0x14000a645 (0x1680..0x1687 to 0), 0x14000a688 mov dword ptr [rbx+0x1688], 0x2, 0x14000a64c (0x168c to 0). The PvP labels: UI/PreGame/CharacterSelection/CharacterSelect.lua lines 303 and 331, UI/PreGame/Character/Character.lua line 838 (nRealmPVPType == PreGameLib.CodeEnumRealmPVPType.PVP); the note: CharacterSelect.lua lines 308-309 and 334-336 (SetText(strRealmNote), shown when Apollo.StringLength(strRealmNote or '') > 0 and there are no characters); SetText with nil sets empty text (0x1400da3ab lea rdx, [0x1409d3324], an empty text, replaced only when 0x1400da3da cmp dword ptr [rax+0x8], 0x0 finds a non-nil argument); bFactionRestricted: CharacterSelect.lua lines 774-775, Character.lua lines 875 and 3055. Extracted copy in ui-extract. Emulator: vector.opcode.0x3db.body."
grade = "fairly sure"
gap = "The scan finds reads at a fixed displacement from a register that holds the game object; a read through a computed address or a copy of the game object would be missed. The object at game 0x15c8 (class table 0x140b55f20, slot 15 ForwardServerMessage) and what it does with the account id's decimal text (0x140054350 passes it to its object's slot 0x38) are not read; reading that object's maker would settle it. That the friendship messages' first value is an account id rests on their handlers' event names, not on a decode of those messages. The SetText read is the window class's whose name pair is at 0x140c572c0; that the RealmNote window is of that class is not checked."

