["opcode.0x3dc"]
statement = "Message 0x3dc (988), game server to client: the encrypted wrapper for game-server messages, the server's hello included, since the client accepts message 3 bare only from the auth server. Its body is one whole inner frame: the inner 32-bit length (counting its own 4 bytes, little-endian, in the clear), then the inner 16-bit id and body, encrypted. The client decrypts it with the game connection's cipher (DecryptMessageBody over the inner length minus 4 bytes), parses the inner frame and handles the inner message (HandleServerMessage). The game connection's cipher holds the base key from the hand-off until the client sends 0x58f, and the session key after."
proof = "Registered at 0x14006c33d mov edx, 0x3dc with 0x14006c326 xor r9d, r9d (no sizer); 0x14006c342 mov qword ptr [rsp+0x20], 0x0 (no writer); 0x14006c336 lea r8d, [r9+0x8]; reader 0x140079f70 at 0x14006c331 mov [rsp+0x28], rcx; 0x14006c329 mov dword ptr [rsp+0x30], 0x0 (mode 0). Decrypted with the connection at game 0x1728 by 0x140014f10. The game connection is keyed with game 0x1630 at 0x1400380ce mov r8, [rax+0x1630]; 0x1400380d5 call 0x14002a050 (HandleMessage03DB) and 0x1400462db (HandleMessage07A1), and re-keyed after 0x58f at 0x1400382c8 call 0x14002a050."
grade = "fairly sure"
gap = "That the game server's hello arrives inside 0x3dc is inferred from HandleServerMessage's decompile; a recording of a real game-server exchange would settle it."

["0x14002a050"]
statement = "Starts a connection's cipher with a 64-bit key: drops any cipher the connection had and builds a new one from the key (NewConnectionCipher); a failure is reported as an error. One cipher object serves both ways on a connection: the client encrypts what it sends with it (EncryptMessageBody) and decrypts what it receives (DecryptMessageBody). Called with the base key when a connection opens (ConnectToAuthServer, HandleMessage03DB, HandleMessage07A1) and with the session key right after 0x58f is sent (HandleLoginGameServerHello, HandleRealmSwitchServerHello)."
proof = "0x14002a05f lea rbx, [rcx+0x10] (the connection's cipher slot); 0x14002a066 mov rcx, [rbx]; 0x14002a070 call 0x14018b900 (frees the old one); 0x14002a075 mov qword ptr [rbx], 0x0; 0x14002a07c mov r8, rsi (the key, the third argument, kept from 0x14002a063 mov rsi, r8); 0x14002a07f mov rcx, rbx; 0x14002a082 call 0x1400c2eb0; 0x14002a08b jns 0x14002a16e, else ReportError. Senders call the object's 0x10 slot with its 0x8 as context (a scan of the disassembly for that pattern finds 21 sites, among them 0x140038231 and 0x1403f4a7b); HandleServerMessage calls its 0x20 slot with its 0x18 (0x14001526f call [rax+0x20]). Ghidra callers: 0x140039598 (ConnectToAuthServer), 0x1400380d5 (HandleMessage03DB), 0x1400462e9 (HandleMessage07A1), 0x1400382c8 (HandleLoginGameServerHello) and 0x1400464e7 (HandleRealmSwitchServerHello), and no others."
grade = "sure"
name = "StartConnectionCipher"

["0x1400c2eb0"]
statement = "Builds a connection cipher from a 64-bit key: expands the key into sixteen 64-bit words and hands them to a new cipher object (InitConnectionCipher). With x = key + 0x718DA9074F2DEB91, each word in turn is x * 0xAA7F8EA9 (64-bit, wrapping), and x becomes that word + key before the next. A key of 0 is refused."
proof = "0x1400c2ed3 test r8, r8; 0x1400c2ed6 je 0x1400c2f52 (0x80004005); 0x1400c2ed8 mov rax, 0x718da9074f2deb91; 0x1400c2ee2 mov r9d, 0xaa7f8ea9 (zero-extended, so the multiplier is 0x00000000aa7f8ea9); 0x1400c2ef0 add rax, r8; 0x1400c2efd imul rax, r9; loop 0x1400c2f01 mov [rcx], rax; 0x1400c2f04 add rax, r8; 0x1400c2f0b imul rax, r9; 0x1400c2f0f dec rdx (16 passes from 0x1400c2ef8 mov edx, 0x10); 0x1400c2f19 call 0x14018b280 (0xb0 bytes); 0x1400c2f2d call 0x1400c2bd0 with the words at the stack's 0x20. Run on Ghidra's p-code emulator from 0x1400c2ed8 to 0x1400c2f14 for the keys 0xd283f5b34a8dc685, 0xac9a7c6ed16e5bee and 1: the 16 words matched the formula."
grade = "sure"
name = "NewConnectionCipher"

["0x1400c2bd0"]
statement = "Fills a new 176-byte connection cipher object: a count of 2, the encrypt routine (EncryptMessageBody) and the decrypt routine (DecryptMessageBody) each with the object as its context, the sixteen key words, and a 64-bit chaining start h: h starts at 0x718DA9074F2DEB91 and, for each key word in order, becomes (h + word) * 0xAA7F8EA9. The encrypt and decrypt routines only read the object, so each message is ciphered from the same start, with no state carried from one message to the next."
