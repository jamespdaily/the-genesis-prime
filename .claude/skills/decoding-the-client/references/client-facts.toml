["0x1400c2d10"]
statement = "Encrypts n bytes in place with a connection cipher (key words K[0..15], chaining start h). Let i = n * 0xAA7F8EAA (32-bit, wrapping; only i mod 16 is used, so it starts at 10n mod 16) and p = h. Each whole 8-byte little-endian word w becomes c = K[i mod 16] xor w xor p, then p = c and i = i + 1. The last n mod 8 bytes are each xored with the byte at the same position of K[i mod 16] and of p (little-endian), with i and p as the words left them. With n = 0 nothing changes. It is not a standard cipher."
proof = "0x1400c2d1f mov r10, [rcx+0xa8] (h); 0x1400c2d2c shr ebx, 0x3 (words); 0x1400c2d35 imul r9d, r9d, -0x55807156 (n * 0xaa7f8eaa); loop 0x1400c2d50 mov eax, r9d; 0x1400c2d53 inc r9d; 0x1400c2d5a and eax, 0xf; 0x1400c2d5d mov rcx, [rdi+rax*8+0x28]; 0x1400c2d62 xor rcx, [r8-0x8]; 0x1400c2d66 xor rcx, r10; 0x1400c2d69 mov [r8-0x8], rcx; 0x1400c2d6d mov r10, rcx; 0x1400c2d70 mov [rsp+0x8], rcx; tail: 0x1400c2d7a and r11d, 0x7; 0x1400c2d8a and ecx, 0xf; 0x1400c2dba and ecx, 0x7; 0x1400c2dbd movzx ecx, byte ptr [rcx+r10+0x28]; 0x1400c2dc3 xor cl, byte ptr [r9+rax-0x1] (byte j of p at the stack's 0x8); 0x1400c2dc8 xor byte ptr [rax-0x1], cl. Run on Ghidra's p-code emulator for the base key and a session key over random bodies of 0, 1, 7, 8, 9, 15, 16, 17, 31, 100, 1000 and 53248 bytes: every output matched the formula. Rerun on the fixed emulator (the query process's emulate request, 2026-10-27): vector.0x1400c2d10.base_key and vector.0x1400c2d10.session_key, the same outputs."
