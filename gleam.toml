name = "genesis_prime"
version = "0.1.0"
gleam = ">= 1.19.2 and < 2.0.0"
description = "A server for WildStar that the original client connects to and plays on."
licences = ["Apache-2.0"]
repository = { type = "github", user = "jamespdaily", repo = "the-genesis-prime" }

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
xmlm = ">= 1.0.1 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
argv = ">= 1.1.0 and < 2.0.0"
unitest = ">= 1.6.1 and < 2.0.0"
glinter = ">= 2.19.2 and < 3.0.0"
squirrel = ">= 4.7.0 and < 5.0.0"
glance = ">= 7.0.0 and < 8.0.0"
glexer = ">= 2.5.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
mug = ">= 3.1.0 and < 4.0.0"

[erlang]
# `crypto` is the OTP application behind SHA-256, modular powers and RC4.
extra_applications = ["crypto"]

[tools.glinter]
include = ["src/", "test/", "dev/"]
warnings_as_errors = true

[tools.glinter.rules]
# The writing-gleam skill allows `let assert` and `panic` with a message where
# a crash is the intended result; `panic_without_message` stays on.
assert_ok_pattern = "off"
avoid_panic = "off"

[tools.glinter.ignore]
# A generated table module exports what the engines use: its row type, `schema`,
# `get` and `all`. Only the registry and the tests call them until an engine
# does, which is no defect in generated code.
"src/genesis_prime/table/*.gleam" = ["unused_exports"]
# squirrel generates this module from `src/genesis_prime/character/sql/*.sql`;
# its parameter names and exports are squirrel's, not ours.
"src/genesis_prime/character/sql.gleam" = ["unused_exports", "label_possible"]
# squirrel generates this module from `src/genesis_prime/login/sql/*.sql`; its
# parameters are `arg_1` and the like, and its row types are the account
# store's to use.
"src/genesis_prime/login/sql.gleam" = ["unused_exports", "label_possible"]
# squirrel generates this module from `src/genesis_prime/game_master/sql/*.sql`,
# on the same terms as the login's.
"src/genesis_prime/game_master/sql.gleam" = ["unused_exports", "label_possible"]
# The test runner finds public `_test` functions by name, and test-support
# modules are shared across test modules, so no other module calls them.
"test/**/*.gleam" = ["unused_exports"]
"test/*.gleam" = ["unused_exports"]

# Modules that may have effects; every other module is a pure rule.
[tools.code_rules]
effectful_modules = [
  { module = "genesis_prime", reason = "starts the supervision tree and keeps the node alive" },
  { module = "genesis_prime/server", reason = "the top supervisor" },
  { module = "genesis_prime/database/pool", reason = "the pool of connections to Postgres, a child of the top supervisor" },
  { module = "genesis_prime/connection/clock", reason = "reads the monotonic clock and the system clock" },
  { module = "genesis_prime/connection/named_send", reason = "sends a message to a registered process through the runtime" },
  { module = "genesis_prime/connection/socket", reason = "the TCP sockets, through gen_tcp" },
  { module = "genesis_prime/connection/socket_owner", reason = "the process that owns one client's socket" },
  { module = "genesis_prime/connection/acceptor", reason = "the process that accepts clients on a listening socket" },
  { module = "genesis_prime/connection/listener", reason = "the supervisor of one port's acceptor and connections" },
  { module = "genesis_prime/shutdown", reason = "the coordinator of the ordered stop, a child of the top supervisor, and the SIGTERM handler that asks it to run" },
  { module = "genesis_prime/telemetry/log", reason = "writes each line through Erlang's logger" },
  { module = "genesis_prime/telemetry/snapshot", reason = "the snapshot process, a child of the top supervisor" },
  { module = "genesis_prime/table/loader/store", reason = "reads the table files and keeps the loaded tables in persistent terms" },
  { module = "genesis_prime/character/sql", reason = "the character queries, generated by squirrel, which run against the database pool" },
  { module = "genesis_prime/character/store", reason = "runs character select's commands against the database" },
  { module = "genesis_prime/map/heap_limit", reason = "sets the heap ceiling of the calling process" },
  { module = "genesis_prime/map/sender", reason = "a process of a map's sender pool" },
  { module = "genesis_prime/map/world_map_process", reason = "the process that owns one world's map, with its senders' supervisor" },
  { module = "genesis_prime/map/maps", reason = "the registry that starts a map for each world that has a player, and the supervisor of the maps" },
  { module = "genesis_prime/login/sql", reason = "the queries squirrel generates, run through the pool" },
  { module = "genesis_prime/login/account_store", reason = "reads and writes the accounts in Postgres" },
  { module = "genesis_prime/game_master/sql", reason = "the queries squirrel generates, run through the pool" },
  { module = "genesis_prime/game_master/store", reason = "reads and writes the permissions and the log of game master commands in Postgres, and writes one log line for each use" },
  { module = "genesis_prime/login/handoff", reason = "the process that holds one-time keys until the next connection redeems them" },
  { module = "genesis_prime/login/service", reason = "the login subtree's supervisor" },
  { module = "genesis_prime/login/sts_connection", reason = "carries out one STS connection's effects: the account store, the hand-off, RC4 and the log" },
  { module = "genesis_prime/login/auth_connection", reason = "carries out one auth connection's effects: the hand-offs and the log" },
  { module = "genesis_prime/character/store_worker", reason = "starts a supervised worker for each command of character select, with a deadline for its answer" },
  { module = "genesis_prime/game/sessions", reason = "the registry of the game connection that holds each account's slot, a child of the game subtree" },
  { module = "genesis_prime/game/service", reason = "the game subtree's supervisor" },
  { module = "genesis_prime/game/game_connection", reason = "carries out one game connection's effects: the session keys, the store, the maps and the log" },
  { module = "genesis_prime/login/rc4", reason = "OTP's crypto holds the state of each RC4 stream" },
]
# The game domains: each top-level folder or module under src/genesis_prime/.
domains = [
  { module = "genesis_prime/server", reason = "the top supervisor that starts and restarts every other process" },
  { module = "genesis_prime/client_archive", reason = "reads the client's archive files, the only source of game data" },
  { module = "genesis_prime/connection", reason = "owns a player's socket, with framing and the cipher" },
  { module = "genesis_prime/message", reason = "the generated codec for every packet layout" },
  { module = "genesis_prime/login", reason = "the auth server on port 23115" },
  { module = "genesis_prime/game", reason = "the game server: the listener a client is handed to after the login, and the connection of a player who reached it" },
  { module = "genesis_prime/character", reason = "character select on the game connection" },
  { module = "genesis_prime/map", reason = "the map process that owns a map's state" },
  { module = "genesis_prime/table", reason = "the client's game tables, loaded once at start" },
  { module = "genesis_prime/database", reason = "the connection pool to Postgres" },
  { module = "genesis_prime/shutdown", reason = "the ordered stop on SIGTERM: stop accepting, drain connections, flush saves, then stop" },
  { module = "genesis_prime/telemetry", reason = "metrics and logs of the running server" },
  { module = "genesis_prime/game_master", reason = "game master commands, each checked against the account's permission and logged" },
]
# Erlang functions a rule module's externals may call.
pure_erlang = [
  "tbl_file_ffi:utf16_text",
  "tbl_file_ffi:gap",
  "tbl_file_ffi:table_of",
  "tbl_file_ffi:row",
  "tbl_file_ffi:rows",
  "genesis_prime_login_ffi:mod_pow",
]
# Modules that may make an atom from a string or read a term from bytes.
atom_or_term = []

# The licences a package may carry; a package with none of them fails the check.
[tools.licences]
accepted = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
