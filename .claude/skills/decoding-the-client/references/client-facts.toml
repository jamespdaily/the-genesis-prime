# Where a new Exile character starts in the arkship world

["area_file.cell"]
statement = "An area file's four hex digits name the 512-unit square of the world it holds: the first two are the row, 64 plus floor(z / 512), and the last two the column, 64 plus floor(x / 512), where x and z are a position's first and third floats. World 1537's 205 area files lie in rows 0x3a to 0x45 (z from -3072 to 3072) and columns 0x37 to 0x4d (x from -4608 to 7168), not every square between. The Cryo Awakening Protocol room at x 4605.65, z 233 to 495 lies in ExileArkShipTutorial.4048.area, beside 4049."
proof = "Data fit with scratch readers (game_table.file for WorldLocation2.tbl; the file names under ClientData/Map): in world 1537 all 259 WorldLocation2 rows fall in an existing area square read this way, and 245 with the digit pairs swapped; over every world whose map folder holds area files, 28,758 of 29,551 rows fit this way and 19,464 swapped. ParseAreaFileName 0x1402dca80 takes the digits as two numbers, each at most 0x80."
grade = "fairly sure"
gap = "Fitted to the rows, not read in the client: the code that places an area by its digits (the call ParseAreaFileName makes through slot 0x78) and the 512-unit size and 64 offset. The 793 rows that fit no file are not examined. Reading that call's target would settle it."

["MapZone.worldZoneId"]
statement = "The world zone a map zone stands for. MapZone 480 PreTutorialExile, named 'Cryo Awakening Protocol' and flagged a tutorial zone (flag 4), has world zone 4813 'Cryo Awakening Protocol', and MapZoneWorldJoin row 454 joins it to world 1537; its MapZoneHex cells are the full rectangle of columns 774 to 783 and rows 594 to 601. Map zone 481 PreTutorialDominion has world zone 4844, whose 14 WorldLocation2 rows are in world 1634. World 1537's other joined map zones are 151 Cryogenics, 156 Bridge, 157 Docking Bay and 159 Greenhouse, all 'The Gambler's Ruin' with flags 6 (tutorial), under map zone 31 ExileArkShipTutorial, which has no world zone; the join's row 148 names a map zone 158 that MapZone does not hold."
proof = "MapZone.tbl, MapZoneWorldJoin.tbl, MapZoneHex.tbl, WorldZone.tbl and WorldLocation2.tbl read with a scratch reader (game_table.file), names from LocalizedText through ClientDataEN/en-US.bin. WorldZone 4813 has parent 799 'The Gambler's Ruin' and flags 0x12. A linear fit of the arkship map zones' hex ranges against their zones' WorldLocation2 rows gives about 48 units a column and 53 a row, putting x 4605.65 at column 778.5, the rectangle's middle, and z 495 near row 601, its last."
grade = "fairly sure"
gap = "How the client picks the current map zone (0x140448420, by the player's world zone or by the hex under the player) and the hex size are not read; GameLibIsTutorialZone 0x140703ce0 tests flag 4 of the map zone it finds. A live entry at WorldLocation2 row 50230 with no Level Up reminder shown would settle that the room counts as map zone 480."

["WorldLocation2.50230"]
statement = "The likeliest start of a new Exile Novice (PreTutorial) character: WorldLocation2 row 50230, world 1537, WorldZone 4813 'Cryo Awakening Protocol', at (4605.650, -7.571, 494.996) with facing (0, 0, 0, 1). The Exile pre-tutorial is public event 780 'Cryo Awakening Protocol' (world 1537, zone 4813, minimum level 1) and quest 10045 of the same name (zone 4813, level 1, receiver row 50246). The event's five objectives, in id order, point at rows 50232 'Walk into the scanner' (z 466.9), 50244 the rings (z 420.3), 50245 the display (z 376.5), 50246 Noelia's avatar (z 353.5) and 50249 'Jump up the platforms to reach the exit' (z 265.5), all at x 4605.65 to 4605.78, so the course runs toward lower z. Rows 50230, 50580 and 50582 share x 4605.650 and z 494.996, 28 units before the first objective, at heights -7.571, -6.990 and -5.990; 50230 is the lowest, 0.21 above the scanner row's -7.777. Dominion characters have the same event as 821 in world 1634, zone 4844."
proof = "PublicEvent.tbl rows 780 and 821, PublicEventObjective.tbl rows 4894, 4896, 4897, 4898 and 4913, Quest2.tbl row 10045 and WorldLocation2.tbl read with a scratch reader (game_table.file); texts from ClientDataEN/en-US.bin. A scan of every 32-bit integer column of every other table finds 50230, 50580 and 50582 only in columns that hold other kinds of id (creature, spell, visual, sound), and no location column in any table names them. World 1537's map folder holds ExileArkShipTutorial.4048.area, the square of this position (area_file.cell)."
grade = "guess"
gap = "No client table or code names where the pre-tutorial begins (CharacterCreation.characterCreationStartEnum): the choice of 50230 over 50580 and 50582, that there is floor at its height, and that the identity facing looks toward the scanner are inferred from the layout. A live entry at 50230 (standing on the floor with the scanner ahead) or a retail recording of a new Novice Exile's message 0xad would settle it."

# Driving the client from its own Lua: where addons load from and when, the pre-game screens,
# the player's state in the world, what an addon can write out, and how the login is filled

["0x1401b41f0"]
statement = "Sets up the client's folders once: the user's roaming application-data folder (created if missing), the local application-data folder and the documents folder from Windows, the temporary folder, the patch and data folders ('..\\Patch', '..\\Data') and the current folder. Every per-user file the client keeps (addons, Addons.xml, addon saves, chat logs) is under the roaming one."
proof = "0x1401b4365 mov edx, 0x801a; 0x1401b4371 call [0x140959700] (SHGetFolderPathW, CSIDL_APPDATA with CSIDL_FLAG_CREATE) into rbx+0xa7c; 0x1401b438c mov edx, 0x801c; 0x1401b4398 call (CSIDL_LOCAL_APPDATA) into rbx+0xc84; 0x1401b43b3 mov edx, 0x8005; 0x1401b43bf call (CSIDL_PERSONAL) into rbx+0xe8c; 0x1401b43d9 call [0x1409594b0] (GetTempPathW) into rbx+0x1094; 0x1401b4333 call [0x1409594c8] (GetCurrentDirectoryW); L'..\\Data' 0x140a47150 and L'..\\Patch' 0x140a47138 through 0x1401b5400. rbx is the platform object at 0x140c63788. Import slots read from the PE import table. The addon, Addons.xml, AddonSaveData and ChatLogs paths all format L'%s\\%s\\%s\\%s' with the platform object's 0xa7c first (0x140135c3b, 0x140044711, 0x140424160, 0x1404058cb)."
grade = "sure"
name = "InitPlatformFolders"

["0x1401b3ba0"]
statement = "Sets the product folder name the per-user paths use: WildStar, unless the command line has -SettingsKey (that exact spelling) with a value; a value beginning with WildStar keeps that name and adds the rest of the value, any other value adds an underscore and the value. So by default the per-user folder is <roaming application data>\\NCSOFT\\WildStar."
proof = "0x1401b3c17 call [0x1409595e0] (GetCommandLineW); 0x1401b3c25 call [0x140959718] (CommandLineToArgvW); 0x1401b3c41 lea rdi, L'SettingsKey' (0x140a46f08); 0x1401b3c57 the '-', '/', 0x96, 0x97 lead-character test; 0x1401b3c76 sub eax, 0x53 (a capital S, compared exactly); 0x1401b3ca4 lea rsi, L'WildStar' (0x140a44f50, the default value); 0x1401b3cb5 lea r15, L'WildStar' (0x140a44d98); 0x1401b3d27 mov [r14+0x1320], rdi (the name WildStar); 0x1401b3d63 call 0x14018e3e0 (prefix compare); 0x1401b3d93 mov dword [rax+rbp*2], 0x5f (underscore) when the value does not begin with WildStar; 0x1401b3e12 mov [r14+0x1320], rdi (name plus the rest)."
grade = "fairly sure"
gap = "What 0x1401b3ab0 does to the value before it is added (it may clean the text) is not read, and no run with -SettingsKey checked the folder."
name = "InitProductFolderName"

["0x1401352f0"]
statement = "Makes one addon record: keeps its folder, its name, whether it is a Carbine addon, and three further values, then reads its toc.xml (LoadAddonToc)."
proof = "Prologue: five pushes and sub rsp, 0x20, so the caller's stack arguments 0x20, 0x28, 0x30, 0x38 are read at 0x70, 0x78, 0x80, 0x88. 0x1401355a6 mov rax, [rsp+0x70] (name) -> 0x1401355e5 call 0x14001c480 into rbx+0x78; 0x1401355ed rbp (the fourth argument, the folder) -> 0x140135612 into rbx+0x58; 0x140135617 movzx eax, byte [rsp+0x78]; 0x140135623 mov [rbx+0x108], al (Carbine flag); 0x140135633 mov [rbx+0x110], al; 0x14013565f mov [rbx+0x10c], eax; 0x1401356ca call 0x140135ad0."
grade = "fairly sure"
gap = "The meaning of the values kept at 0x10c and 0x110 and of the ninth argument is not read."
name = "NewAddon"

["0x140135ad0"]
statement = "Reads an addon's toc.xml. A Carbine addon's toc is found in the client's archive at ui\\<folder>\\<name>\\toc.xml (no folder part when the folder is empty); any other addon's toc is <roaming application data>\\NCSOFT\\WildStar\\Addons\\<name>\\toc.xml on disk, the product name as InitProductFolderName sets it. The toc's Addon element is read for APIVersion, Name, Author ('[Unknown]' when absent) and Version."
proof = "0x140135b62 cmp byte [rsi+0x108], 0 (Carbine flag); 0x140135b69 je 0x140135c21. Carbine branch: 0x140135b72 lea rdx, L'ui\\' (0x140a22a08); 0x140135be2 rsi+0x60/0x68 (folder) appended at 0x140135bfc; 0x140135c04 L'\\' (0x1409d8dac). Other branch: 0x140135c21 mov rax, [0x140c63788]; 0x140135c28 lea rcx, L'Addons' (0x140a227f8); 0x140135c2f lea r8, L'%s\\%s\\%s\\%s' (0x140a47468); 0x140135c3b lea r9, [rax+0xa7c] (roaming application data); 0x140135c42 mov rax, [rax+0x1320] (product name); 0x140135c4e lea rax, L'NCSOFT' (0x140a44ef0); 0x140135c66 call 0x14001b370 (format); 0x140135d1c L'\\' (0x1409d8dcc). Both: 0x140135d3d rsi+0x80/0x88 (name) appended at 0x140135d50; 0x140135d78 L'\\' (0x1409d8f5c); 0x140135db3 lea rdx, L'toc.xml' (0x140a22b08). Then L'Addon' 0x140a32d28, L'APIVersion' 0x140a22738, L'Name' 0x140a31790, L'Author' 0x140a31780, L'[Unknown]' 0x140a22af0, L'Version' 0x140a32e10."
grade = "sure"
name = "LoadAddonToc"

["0x1401395d0"]
statement = "Adds one addon by folder and name to an addon list: makes its record (NewAddon) with the Carbine flag it is given and keeps it when its toc loaded; otherwise frees it."
proof = "0x1401395f1 movzx ebx, r9b (the fourth argument); 0x14013963c mov [rsp+0x20], rsi (name); 0x140139624 mov r9, rbp (folder); 0x140139638 mov [rsp+0x28], bl (Carbine flag); 0x140139641 call 0x1401352f0; 0x14013964d cmp byte [rsi+0x138], 0 (loaded); kept by 0x140139670 call 0x14018db00 and 0x140139678 mov [rax+rbx*8], rsi; else 0x1401396bb call 0x1401356f0 and 0x1401396c5 call 0x14018b900."
