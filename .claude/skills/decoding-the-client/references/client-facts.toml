["StsConnLib64.MT.dll!0x18002d4e0"]
statement = "The SRP client's first step, on the server's KeyData from LoginStart. The KeyData is a 32-bit little-endian length and the salt s, then a 32-bit length and the server value B, and nothing after; B must be non-zero and below N. The client picks a 32-byte random a, computes A = g^a mod N, u = H(A | B), x = H(s | P), S = (B - k*g^x mod N, raised by N until not negative)^(a + u*x mod N) mod N, the session key K (SrpInterleaveKey) and M1 = H(H(N) xor H(g) | H(I) | s | A | B | K), where s, A and B are hashed as the library's bytes of each number. It answers with KeyData: a 32-bit length and A's bytes, then the length 32 and M1. Any other KeyData fails the step."
