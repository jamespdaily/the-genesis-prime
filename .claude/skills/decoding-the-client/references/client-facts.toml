["0x140331990"]
statement = "Reads one received frame: its 32-bit length, then its 16-bit message id, and looks the message up. A frame longer than the message's size limit (MessageSizeLimit), or with an unknown id, or with no reader, is logged and skipped to its end. Otherwise the message's reader reads the body into a record and the record goes to the connection's owner, except the network layer's own ids, which never reach it: a ping (id 0) is answered at once with a pong (id 1) carrying the same byte, a pong goes to HandleNetworkPong, and a close notice (id 2) is dropped. Each failure is logged under Network at level Error, naming the connection and the message id, and the frame is skipped to its end: an unknown id ('(->conn)[conn id] Malformed Packet: Unknown Message: '<id>' (bytes: n) (last msg: id:name)', result 8); a frame longer than the message's size limit ('Malformed Packet: bad Message size: [length>limit] ...', result 8); no room for the record ('Msg <id, name> failed to GetMsgBuffer().alloc(size)', result 4); no reader ('Msg <id, name> failed to find unPackFromStreamFn function', result 11); the reader failing ('(->conn) unpacked data too big, ID = <name> consumed n bytes rather than length', result 8); the game's handler failing ('(->conn) Invalid Message '<name>'', result 14). A frame over 90% of its limit gets a Warn line ('Packet: Message size approaching failure size'). A length or id that cannot be read returns 12 with no line."
proof = "Decompiled: 0x140336d60 (or an inline fast path) reads widths 0x20 and 0x10; the id gets 0x10000 when the connection's 0x20 is 1; slot 0x130 looks it up; 0x140335ec0 gives the limit, length <= limit passes, over limit * 0.9 a warning; the record from 0x1403374e0 sized by descriptor 8; reader at descriptor 0x20; id 0 -> slot 0xf0 (0x140332151 movzx eax, byte ptr [r12]; 0x140332164 mov r8d, 0x1; 0x14033216d call [rax+0xf0], the network object's send-by-id with id 1 and that byte), 1 -> 0x140333790 (0x14033214a), 2 -> nothing (0x140332006 je 0x140332173), others -> the owner's slot 0x10 (or 0x18 in a foreign id space); every failure skips length - bytes read with 0x1403370c0. Log calls (category 0xb, level 0 unless noted): 0x140331bbe call 0x1401a2e50 with 0x141debc30 (text 0x140af15f0), args connection name, [conn+0x10], name, length, [conn+0x318], last name; 0x140331cd3 with 0x141debd30 (0x140af16f0); 0x140331dad level 1 with 0x141debcc0 (0x140af1680); 0x140331e56 LogMessage with 0x141debfb0 (0x140af1970), id, name, size; 0x140331eec LogMessage with 0x141debf40 (0x140af1900), return 0xb; 0x140331fd3 0x1401a2e50 with 0x141dec040 (0x140af1a00), name, bytes read, length, after 0x140331f36 call rax (the reader) and 0x140331f3a jns; 0x14033209e with 0x141dec018 and 0x140332124 with 0x141dec0d8 (both 'Invalid Message'), return 0xe. Descriptor = text + 0x12fa640. ReadBitsSlow failure on length or id -> return 0xc with no call. Pings: 0x14033216d call [rax+0xf0] with id 1; 0x14033214a HandleNetworkPong."
grade = "fairly sure"
gap = "Instructions read for the log sites; the rest is from Ghidra's decompile. What sets the connection's 0x20 (the second id space) and what 0x140334d90 puts in the connection name are not read."
name = "ReadMessageFrame"

["opcode.0x0"]
statement = "Message 0 (0), either direction: the network layer's ping. Body: one 8-bit sequence number, 0 to 19, so the whole frame is 7 bytes: 07 00 00 00 00 00 then the number. It travels bare: never inside 0x244 or 0x76/0x3dc, never encrypted, on any connection. The client sends one to each of its connected connections (SendNetworkPings), the first with number 0, and the next only after the last is answered. A client that receives one answers at once with message 1 carrying the same number, and passes nothing to the game."
proof = "Registered by 0x140333850 (RegisterNetworkMessages): 0x140333870 xor edx, edx (id 0); 0x140333880 lea r8d, [rdx+0x1] (record size 1); 0x140333879 lea r9, [0x140088110] (sizer: 0x140088110 add qword ptr [rdx], 0x8, so 8 bits); writer 0x140330000 (0x140330008 movzx r10d, byte ptr [rdx], one byte written as 8 bits); reader 0x14007b1d0 (0x14007b1de mov r8d, 0x8; 0x14007b1e7 jmp 0x14006be30); 0x140333863 mov dword ptr [rsp+0x30], 0x0 (mode 0, so WriteMessageFrame writes the 32-bit length and 16-bit id). Sent at 0x140332eb9 xor r8d, r8d; 0x140332ebf call [rax+0xf0] (NetworkSendMessageById 0x140332580, which queues the frame with 0x1403327d0 call 0x140333fc0, QueueMessageSend, no wrapper and no cipher). Received in ReadMessageFrame: 0x140331ff4 test ebx, ebx; 0x140331ff6 je 0x140332151; 0x140332151 movzx eax, byte ptr [r12]; 0x140332164 mov r8d, 0x1; 0x14033216d call [rax+0xf0]; 0x140332173 xor eax, eax (the owner's handler at 0x14033202f is not reached). The live recording test/recording/2026-10-26-login/auth-001.recording holds the client's first ping on the auth connection: 07 00 00 00 00 00 00."
grade = "sure"

["opcode.0x1"]
statement = "Message 1 (1), either direction: the network layer's pong, the answer to a ping (message 0). Body: the ping's 8-bit sequence number, so the whole frame is 7 bytes: 07 00 00 00 01 00 then the number. It travels bare, never wrapped or encrypted. The client sends one in answer to each ping it receives. A pong the client receives goes to HandleNetworkPong: a number of 20 or more is ignored; otherwise it becomes the last answered number and gives that ping's round trip in milliseconds. The client sends its next ping only when the last answered number is the one just before its next number, so a pong with any other number stops the client's pings on that connection."
proof = "Registered by 0x140333850: 0x1403338ac mov edx, 0x1; 0x1403338c0 mov r8d, edx (record size 1); 0x1403338b6 lea r9, [0x140088110] (8 bits); writer 0x140330000 (0x1403338a5); reader 0x14007b1d0 (0x140333891); 0x140333898 mov dword ptr [rsp+0x30], 0x0 (mode 0). Sent in ReadMessageFrame at 0x140332164 mov r8d, 0x1 with the received ping's byte (0x14033215e mov byte ptr [rbp+0x77], al; 0x14033215a lea r9, [rbp+0x77]). Received: 0x140331ffc dec eax; 0x140331ffe je 0x140332140; 0x14033214a call 0x140333790. The send condition: SendNetworkPings 0x140332e6e..0x140332e92 ((last answered + 1) mod 20 must equal the next number)."
grade = "sure"

["opcode.0x2"]
statement = "Message 2 (2), either direction: the network layer's close notice. Its body is empty, so the whole frame is 6 bytes: 06 00 00 00 02 00. It travels bare, never wrapped or encrypted. The client sends it once on a connection it is closing (SendCloseNotice), and sends nothing more on that connection afterwards. A close notice the client receives is dropped: no answer, no close, nothing passed to the game."
proof = "Registered by 0x140333850: 0x1403338dc mov edx, 0x2; 0x1403338ef lea r8d, [rdx-0x1] (record size 1); sizer 0x140001b70 (0x140001b70 ret 0x0, no bits); writer 0x140001ba0 (0x140001ba0 xor eax, eax; ret, writes nothing); reader 0x14007d8e0 (reads nothing, fails only on a missing record); 0x1403338cf mov dword ptr [rsp+0x30], 0x0 (mode 0). Sent by 0x140331550 (0x140331588 mov r8d, 0x2; 0x14033158e call [rax+0xf0]). Received in ReadMessageFrame: 0x140332004 dec eax; 0x140332006 je 0x140332173 (return 0, nothing done)."
grade = "fairly sure"
gap = "No caller of SendCloseNotice was found (it is slot 0x80 of the network object's class table, and no call of that slot on the network object was found by a scan of call [reg+0x80] sites near a load of 0x140c65808), so when the client sends it is not read. The 2026-10-26 auth recording holds none before the auth connection closed. Tracing the network object into each function that closes a connection would settle it."

["0x140333850"]
statement = "Registers the network layer's own three messages with the network object, at its construction: message 0 (the ping) and message 1 (the pong), each with a one-byte body, and message 2 (the close notice), with an empty body. All three are framed with the usual length and id."
proof = "Called only by the network object's constructor 0x1403300b0 (0x1403301ac call 0x140333850 with rdx = the new object, whose class table 0x1403300bf lea rax, [0x140b647b0] is the network class). Three calls of slot 0 (RegisterMessage 0x1403309a0, bytes at 0x140b647b0: a009334001000000): 0x14033388c call [rax] with 0x140333870 xor edx, edx; 0x1403338c3 call [rax] with 0x1403338ac mov edx, 0x1; 0x1403338fb call [rax] with 0x1403338dc mov edx, 0x2; each with mode 0 at [rsp+0x30]. Sizers, writers and readers as in the records opcode.0x0, opcode.0x1 and opcode.0x2."
