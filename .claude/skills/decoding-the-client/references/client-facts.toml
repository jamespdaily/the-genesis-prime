["lua.PathTracker.ResizeAll"]
statement = "The PathTracker addon builds its windows (the Active, Available, On Going and Scan Bot headers) only in PathTrackerSetup, which returns at once while PlayerPathLib.GetPlayerPathType is nil. Setup runs when the objective tracker gives it its parent window (ObjectiveTrackerLoaded) and again on SetPlayerPath or PlayerPathRefresh when the path differs from the one it last built for. Its 0.1-second resize timer, started by ChangeWorld, SubZoneChanged, the PlayerPathMission and Explorer events, and by SetPlayerPath or PlayerPathRefresh when the path is unchanged, runs ResizeAll, which uses the Active header without a check. So while the client has no path (no message 0x6bc yet) the first such timer fails: at line 726, 'attempt to index field wndActiveHeader (a nil value)', when the tracker is not minimized and its window was shown, and at line 739 (no entry for a nil path) when minimized. After message 0x6bc with a path of 0 to 3 setup builds every header and ResizeAll runs cleanly with no episodes or missions (a Scientist shows the Scan Bot header, other paths hide the tracker). A path above 3 has no entry in the addon's path table and fails setup itself."
proof = "UI/PathTracker/PathTracker.lua (extracted copy in ui-extract): lines 26-29 the table of the four PlayerPathType values; 323-363 OnObjectiveTrackerLoaded registers the events and loads wndMain, then PathTrackerSetup; 365-368 setup returns when GetPlayerPathType() is nil; 382 creates wndActiveHeader; 550-553 OnResizeDelayTimer calls ResizeAll when wndMain is valid; 578-760 ResizeAll: 657 bShouldShow needs a displayed mission or the Scientist path, 664 and 726 index wndActiveHeader, 739 indexes ktPathType[ePathType]; 1274-1292 OnSetPlayerPath and OnPlayerPathRefresh run setup when the path differs, else BuildAll and start the timer; 1296-1351, 1407-1417 the other timer starts. The live failure of 2026-10-28 (stack ResizeAll line 726 from line 552 in the timer at 550) came after an entry with no 0x6bc. Message 0x6bc raises PlayerPathRefresh (0x14056e259) while the path is still nil, so the addon only starts the timer, then SetPlayerPath (0x1403eccca) with the path set (0x140492819 runs between), so setup builds before the timer fires."
grade = "fairly sure"
gap = "That the UI event raiser 0x1400ea3e0 calls the Lua handlers at once, not on a later frame, is inferred from its 'i>b' formats returning a handler's answer; which event started the failing timer live (ChangeWorld, SubZoneChanged or another) is not known. A live entry with 0x6bc after 0x19b would settle that PathTracker builds."

["0x1404b2680"]
statement = "Saves the level-up unlock state, the unlocks marked viewed and each character's seen unlocks, to the client's own file LevelUpUnlocks.xml in the user's NCSOFT folder. This state belongs to the client alone: no server message reads or writes it, so GameLib.GetPendingLevelUpUnlocks, and with it the 'Level Up!' reminder, lists every unlock from level 1 up to the character's level that the player has not opened and marked viewed on this machine, for any level, and no message clears it."
proof = "Decompiled: the path built from the folder at 0xa7c of the object at 0x140c63788, L'NCSOFT', the text at its 0x1320 and L'LevelUpUnlocks.xml' (0x14001b370 with a four-part format), then an XML document ('xml version=\"1.0\" encoding=\"UTF-8\"'). Callers (objdump reference index): 0x1404b1199 in 0x1404b10f0 (called only by 0x140703af7 in MarkLevelUpUnlockViewed 0x140703aa0, the function paired with 'MarkLevelUpUnlockViewed' at 0x140b73210), 0x1404b127c in 0x1404b11b0 (ResetLevelUpUnlocks 0x140703b10), 0x1404b167c and 0x1404b1abd in 0x1404b1290 (GetUnlocksForLevel 0x140703900). The state object at 0x140c659d8 is referenced only by its setup 0x14000b690, the teardown 0x140012c10, the GameLib functions 0x1407033e0 (GetPendingLevelUpUnlocks), 0x140703a00 (IsLevelUpUnlockViewed), 0x140703aa0 and 0x140703b10, and 0x1404b0e10, 0x1404b0e70, 0x1404b11b0, 0x1404b1290, 0x1404b39c0, none of them a message handler or reader. A level in message 0x262's stats sets the level with no event (SetUnitStatsFromCreate 0x140458140), so the reminder on entry is GetPendingLevelUpUnlockList 0x1404b0e70, not the level-up fanfare. LevelUpUnlock.tbl Level rows at levels 2 and 3 include 22 to 25, 101, 102, 110, 113, 135 and 192."
grade = "fairly sure"
gap = "Read from Ghidra's decompile; how the file is read back at start (likely 0x14000b690) and the folder text at 0x1320 are not read. A call to these functions through a pointer would not be found by the reference scan."
name = "SaveLevelUpUnlocks"
