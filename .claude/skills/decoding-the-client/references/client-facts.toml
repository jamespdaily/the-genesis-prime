["opcode.0x58f"]
statement = "Message 0x58f (1423), client to game server: the first message on a game connection, sent when the server's hello arrives. Body, in order: the 32-bit value from the auth server's hand-off (0x3db; a realm switch's 0x7a1 does not replace it), the 16-byte session key (as a GUID: 32, 16 and 16 bits and 8 raw bytes, so the 16 bytes in order), a 64-bit value the client sets to 0, the account name the client logged in with (wide text), and a 32-bit value the client sets to 3. Right after sending it the client keys the connection's cipher from the session key. The client has no reader for it."
proof = "Registered at 0x14006d593 mov edx, 0x58f; 0x14006d598 mov r8d, 0x30 (record size); 0x14006d57e lea r9, [0x14007e2c0] (sizer); 0x14006d56f lea rcx, [0x14007e320] stored at 0x14006d58e (writer); 0x14006d585 mov qword ptr [rsp+0x28], 0x0 (no reader). Senders HandleLoginGameServerHello 0x140038120 and HandleRealmSwitchServerHello 0x140046340 (decompiled): record word 0 = game 0x1668; bytes 4..0x13 = game 0x1638..0x1647 (the key); 64 bits at 0x18 = 0; text at 0x20 = game 0x1670 (set from the login's account name by 0x1400114e0 when 0x591 arrives); word 0x28 = 3; 0x1400381f9 call qword ptr [rax+0x108] with 0x140038198 mov r8d, 0x58f. Emulator: vector.opcode.0x58f.body."
grade = "fairly sure"
gap = "The record's sources are read from Ghidra's decompile; what the server does with the 64-bit 0 and the 3 is not read."

["0x140038120"]
statement = "Handles the hello (message 3) from the game server reached by the auth hand-off: sends 0x58f with the session key, keys the connection's cipher, starts character select on that connection (StartCharacterSelect, which sends 0x7e0), hands the character-select stage over, asks for the store catalog (RequestStoreCatalogAfterLogin: 0x82d inside 0x38c) when the store exists, and ends the login, which then handles no more messages. So the client sends, in this order and without waiting for any server message in between: 0x58f under the base key, then 0x7e0 and 0x38c carrying 0x82d under the session key. If character select fails to start, nothing after 0x58f is sent and the login ends with error 0x7a6ae."
proof = "Every instruction of 0x140038120..0x140038379 read in llvm-objdump's listing. 0x140038139 cmp dword ptr [rcx+0xa8], 0xa (state 10, else return 0); the 0x58f record from game 0x1638..0x1647, 0x1670, 0x1668 and 0x1400381cc mov dword ptr [rsp+0x58], 0x3; 0x140038198 mov r8d, 0x58f; 0x1400381f9 call qword ptr [rax+0x108]; 0x140038231 call qword ptr [r9+0x10] (cipher, base key); 0x140038261 mov r8d, 0x244; 0x140038267 call qword ptr [rax+0xf0]; the session key folded at 0x1400382a1..0x1400382c4 and 0x1400382c8 call 0x14002a050; 0x1400382df call 0x14018b280 (0x2d0 bytes) and 0x1400382ec call 0x140020730; 0x1400382fe call 0x140020bc0 with the connection at the login object's 0xf0; 0x140038305 js 0x140038351; 0x14003830d call 0x14003e380 (hand-over); 0x140038314 js 0x140038351; 0x140038316 cmp qword ptr [0x140c65908], 0x0; 0x140038330 call 0x14044db80; 0x140038328 mov dword ptr [rax+0x1680], edx (the hello's second field); 0x140038340 mov dword ptr [rdi+0xa8], 0xb; failure: 0x140038354 mov edx, 0x7a6ae; 0x14003835c call 0x1400383a0."
grade = "fairly sure"
gap = "What 0x14003e380 does with the object beyond keeping it is not read, nor what 0x14003e470 shows with text 0x8389c."
name = "HandleLoginGameServerHello"

["0x140020bc0"]
statement = "Starts character select on a game connection: keeps the connection, sets character select idle, loads the character-select interface (strata such as CharacterSelection and AccountServices) and, only when that load succeeds, sends message 0x7e0 with a one-byte record, 0, which the message's writer leaves out, so the body on the wire is empty. It needs no server message first; a failed load sends nothing and returns the failure."
proof = "Instructions: 0x140020c16 mov qword ptr [rdi+0xb8], rbx (the connection); 0x140020c5b mov dword ptr [rdi+0x170], 0x0; 0x140020cbb call 0x14003db40; 0x140020cc2 js 0x140020d96 (no send); 0x140020cf6 mov r8d, 0x7e0; 0x140020d0e call qword ptr [rax+0x108]; 0x140020d4c call qword ptr [r9+0x10] (the connection's cipher); 0x140020d88 mov r8d, 0x244; 0x140020d8e call qword ptr [rax+0xf0]. Decompiled: 0x14003db40 with L'AccountServices', L'Navigation', L'DefaultStratum', L'TempBlocker' and L'Character', L'CharacterSelection', L'AccountServices', L'Credits', L'MicroStore'; network slot 0x108 with 0x7e0 and a zero byte, sent as 0x244. Callers include 0x140038120 (after login) and 0x140046340 (after a realm switch)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile; what 0x7e0 asks for is not read; the callers 0x140033d60, 0x140045b70, 0x140047730 and 0x1403b6a80 (returns to character select) are not read."
name = "StartCharacterSelect"

["0x14044db80"]
statement = "Asks the game server for the store catalog: marks the store not ready (the Lua IsStoreReady then answers false) and sends message 0x82d carrying the text table's 32-bit value (cut to 14 bits) through SendGameMessageKind13, so it travels as message 0x38c with the value 0x13 inside 0x244 on the game connection. HandleLoginGameServerHello calls it once, right after character select has started and 0x7e0 has gone out, when the store exists (the client's start-up makes it); it is the first 0x38c a client sends on a new game connection."
proof = "Every instruction read in llvm-objdump's listing: 0x14044db89 mov rax, qword ptr [0x140c65908] (the store); 0x14044db95 mov edx, 0x82d; 0x14044db9a mov dword ptr [rax+0x4], 0x0; 0x14044dba7 mov rax, qword ptr [0x140c7aac0] (the text table, as in opcode.0x592's record); 0x14044dbae mov ecx, dword ptr [rax+0x8]; 0x14044dbb1 mov dword ptr [rsp+0x30], ecx (the record); 0x14044dbb5 mov rcx, qword ptr [0x140c635f0] (the game object); 0x14044dbbc call 0x1400161d0. IsStoreReady 0x1404eadb0: 0x1404eadbd cmp dword ptr [rax+0x4], edx; 0x1404eadcd setne dl (name pair 'IsStoreReady' 0x140b0df58 at 0x140b69c70). The only caller: HandleLoginGameServerHello 0x140038316 cmp qword ptr [0x140c65908], 0x0; 0x14003832e je 0x140038335; 0x140038330 call 0x14044db80, reached only after 0x1400382fe call 0x140020bc0 (StartCharacterSelect, which sends 0x7e0) and 0x14003830d call 0x14003e380 both succeed (0x140038305 js and 0x140038314 js skip it). The store is made in StartClient: 0x14000d312 call 0x14018b280 (0x1f8 bytes), 0x14000d31f call 0x14044a710, 0x14000d324 mov qword ptr [0x140c65908], rax, after the start-up stage 0x140042520 succeeds (0x14000d1aa jns 0x14000d301)."
grade = "sure"
name = "RequestStoreCatalogAfterLogin"

["0x1404eae10"]
statement = "The store's Lua function RequestCatalog: does what RequestStoreCatalogAfterLogin does (marks the store not ready and sends message 0x82d with the text table's value inside 0x38c with the value 0x13) and returns no values."
