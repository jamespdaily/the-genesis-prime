proof = "Decompiled: returns unless game 0x7928 and the network object 0x140c65808 are set; network slot 0x108 (0x140332920, serialise by id) into game 0x7960; 0x1403f4a10 mov dword [rbp-0x50], 0x3; slot 0x108 with 0x38c; the connection's cipher at its 0x10 runs over the body after its first 4 bytes; slot 0xf0 (0x140332580) with id 0x244 and the connection index at its 0x98. 0x1403f4740 is the same with 0xb in place of 3 and no check of the network object. 327 callers (345 sites). The sites: every call 0x1403f4900 in llvm-objdump's listing of .text (345; no tail jumps). Each site's id register was resolved by a scratch backward data-flow walk over llvm-objdump's listing of the site's .pdata function (edges: fall-through, direct jumps, and the switch tables jump_tables.read_function reads), following mov of an immediate, xor of a register with itself, lea of a register plus a constant, and register copies, and stopping at memory loads, call results and the function's own arguments. 344 sites resolve to immediates. The other, 0x1405c9e0c in 0x1405c9b90, is a switch case: 0x1405c9bb1 mov edi, edx (the function's second argument); 0x1405c9dc2 test edi, edi; 0x1405c9dc4 jne 0x1405c9f6a; 0x1405c9de2 lea edx, [rdi+0x73], so on the path to the call edi is 0 and the id is 0x73. Arguments: 0x1403f4934 mov r8d, edx (the id becomes the serialiser's id); 0x1403f4931 mov r9, r8 (the record)."
