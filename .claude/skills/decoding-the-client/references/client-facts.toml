["0x1401a1530"]
statement = "Sets up the client's log from the registry key HKCU\\SOFTWARE\\NCSOFT\\WildStar\\Log and the command line. An argument starts with '-', '/' or the character 0x96 or 0x97 and is matched ignoring case. The flags start from the key's value Flags; -logFile and -logNoFile turn the file on and off, -logFlush/-logNoFlush the flush after each line, -logTimestamp/-logNoTimestamp the time stamp on console copies, -logFacility/-logNoFacility the category name. -logDefaultLevel <n> sets every category to n. Then for each named category the key's value of that name sets its level, -log<Name> <n> sets it to n (2 when the next word is not a number) and -logNo<Name> turns it off (-1). With the file on, it opens for appending -logFileName <path>, or else <-logDir, or the program's folder followed by ..\\Logs>\\<program name>_16042_<computer name>_<YYMMDD>_<HHMMSS>.txt (local time; with flag 0x100 the process id in hex is added before .txt), creating the folder first. It also reads -errDir <dir>, the folder for error reports. No console variable takes part."
