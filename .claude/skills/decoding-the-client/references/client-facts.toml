["0x14003b7b0"]
statement = "Handles the NC platform's reply to PageVerifiedIps. It first marks the request as answered-and-failed. A reply with an error (an STS status of 400 or more) ends there: no list, no Lua event. A successful reply's body is parsed as XML (it must end with a line feed, as every STS body the library parses); the root element's name is not checked. TotalPage and TotalCount (decimal texts) are read when present. An Items element must be present, holding Item elements, each with NetAddress (an IPv4 address in dotted text), Registered (text, shown as the date the address was added) and Expired (text); a reply without Items is logged ('Could not find Items element') and treated as a failure. When the items are read the client replaces its trusted IP list with them, marks the list received (no further PageVerifiedIps is sent until something resets that) and raises the Lua event TrustedIPListReady. A refusal (an error reply, or a reply without Items) blocks nothing else, since the game login ignores every NC platform event once the game server's hello has been handled; it marks the request failed, so the next interface redraw asks again. A request that gets no reply stays marked waiting, and RequestVerifiedIpPage sends no other until something resets that mark."
