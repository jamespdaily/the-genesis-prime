["0x140014f10"]
statement = "The game's handler for a message received on a connection, given the connection id, the message id and the message. It accepts message 3 (the hello) arriving bare only from the auth connection. Message 0x76 it decrypts with the auth connection's cipher and message 0x3dc with the game connection's (DecryptMessageBody over the inner frame after its 4-byte length), then parses the inner frame (ParseWrappedMessage) and handles the inner message; a parse failure returns an error. Any other message arriving bare is reported as an error and dropped. The message then goes, in this order, to HandleMessages0966To0980 (ids 2406 to 2432 but 2418) when the game holds that handler, to HandleMessages0981To0985 (ids 2433 to 2437) and to HandleMessages0987To0991 (ids 2439 to 2449 but 2447) when the global objects they serve exist; a message one of them takes goes no further. Otherwise message 0x763 is handled here, and any other goes to the game's handler list in order: each handler is given the connection id, the id and the message, and the first that returns 0 ends the walk; a negative result is reported as an error with the message's name. A message no handler takes is logged as unhandled and dropped. The handlers that can be on that list and take messages are HandleLoginMessage, HandleCharacterSelectMessage, HandleRealmSelectMessage, HandleWorldMessage, HandleMessages03CFTo03D2 and ForwardServerMessage, which passes the message to the handler it wraps."
proof = "Every instruction of the .pdata range 0x140014f10..0x140015ae1 read in llvm-objdump's listing. Slot 2 of the class table at 0x140b55100 (bytes at 0x140b55110: 0x140014f10), which the game constructor puts at game 0x100 (0x14000a4bf mov qword ptr [rbx+0x100], rax), so its 0x1620 and 0x1628 are game 0x1720 (the auth connection, 0x140029fd7 mov [rax+0x1720], rsi) and game 0x1728 (the game connection, 0x140029fc7 mov [rax+0x1728], rsi). Arguments: 0x140014f15 mov [rsp+0x18], r8d (connection id, later [rbp+0x60]); 0x140014f34 mov edi, r9d (id); the message at [rbp+0x70]. 0x140014f46 cmp r9d, 3 -> 0x1400152b0 mov rax, [rcx+0x1620], 0x14001540c cmp r8d, [rax+0x98], 0x140015413 je 0x140015589; else report and 0x140015232 mov eax, 1. 0x140014f54 cmp r9d, 0x76 -> 0x14001524b mov rax, [rcx+0x1620]; 0x140014f5e cmp r9d, 0x3dc -> 0x14001523f mov rax, [rcx+0x1628]; 0x140015257 mov rax, [rax+0x10] (the cipher); 0x140015260 mov r8d, [rdi] (the inner length); 0x140015263 mov rcx, [rax+0x18]; 0x140015267 lea rdx, [rdi+0x4]; 0x14001526b sub r8d, 0x4; 0x14001526f call [rax+0x20] (DecryptMessageBody); 0x14001528f call [rax+0x100] of the network object 0x140c65808 (0x140331620) gives the inner id and record; 0x140015299 mov eax, 0x80004005 on failure. Any other id: 0x140014f81 call [rax+0x30], report through 0x1401971e0, 0x140015232 mov eax, 1. Dispatch from 0x14001559a: mov rcx, [r12+0x14d0] (game 0x15d0, built by 0x140003970 and stored at 0x14000c17b); 0x1400155b7 call 0x140003fb0; 0x14001565c cmove ebx, r15d (taken on 0); 0x140015660 cmp [0x140c65910], 0 / 0x14001566f call 0x140452670; 0x1400156a5 cmp [0x140c65908], 0 / 0x1400156b4 call 0x14044b630, 0x1400156de je 0x140015ac4 (taken: return 0); a negative result from any of the three goes to 0x1400155c6 (name lookup 0x140335f10, 0x140015622 call 0x140015ec0). 0x1400156ec test ebx, ebx / jne 0x140015ac4; 0x1400156f4 cmp edi, 0x763 (handled at 0x140015700..0x14001581a); 0x14001581f mov rsi, [r12+0x14b0] (game 0x15b0, the list head); 0x140015847 call [rax+0x58] with edx = the connection id, r8d = id, r9 = message; 0x14001584e js 0x140015952 (0xa00b0001 or another error, reported); 0x140015854 mov rsi, [rsi+0x20] (next); 0x140015858 cmove ebx, r15d; unhandled: 0x140015a90 call 0x1401971e0, 0x140015ac4 xor eax, eax. List links: a node's 0x18 is the address of the link that points to it and 0x20 the next node (0x140012c50..0x140012c7f unlinks each node; 0x1400165f9..0x140016629 appends game 0x15a0's object; 0x140015fcb..0x140015ff5 the same in 0x140015ec0). The handler classes come from a scan of the relocated pointers for class tables of the handler base (slot 0 = 0x140001e50, slot 13 = 0x14001d300): 17 tables, at 0x140b552f0, 0x140b55380, 0x140b55430, 0x140b55540, 0x140b555d0, 0x140b55660, 0x140b55770, 0x140b55830, 0x140b558c0, 0x140b55940, 0x140b559d0, 0x140b55e10, 0x140b55ea0, 0x140b55f40, 0x140b66880, 0x140b66ea0, 0x140b690f0. Their slot 11 (0x58) is 0x14001d310 (0x14001d310 mov eax, 1; ret) in nine, 0x1407db510 (calls the pure-call handler) in two, and 0x140020ea0, 0x1400370d0, 0x140045a70, 0x140054ce0, 0x1403ec6a0 and 0x1404d60f0 in the other six."
grade = "fairly sure"
gap = "That every received message reaches this handler, and so that the game server's hello comes inside 0x3dc, is not traced; a recording of the real exchange would confirm it. The list of handler classes rests on the class-table scan, not on reading every store into the list at game 0x15b0: a handler of another shape would be missed; reading every caller of the list's append code would settle it. Which of these objects is on the list at a given time, and in what order, is not read. The roles of the global objects at 0x140c65910 (set by 0x140451e20) and 0x140c65908 (set by 0x14000b690) are not read."
