["0x1401b4560"]
statement = "Mounts the client's archives under the game folder: opens Patch\\CoreData.archive when present (a failure is logged as 'Failed to open Core Archive'); opens Patch\\Patch.index with no expected record (missing: 'File not found' and 0x80070490); optionally Bootstrap\\Bootstrap.index; then, for each data set the flags select (bit 0 ClientDataEN, 1 ClientDataFR, 2 ClientDataDE, 3 ClientDataZH, 4 ClientData, 5 ServerData, 6 ToolsData, 7 SupportData under Patch, bit 8 LauncherData under Bootstrap), it looks up '<name>.index' in the Patch (or Bootstrap) index to get its expected file record, opens '<folder>\\<name>.index' checked against that record, and opens '<folder>\\<name>.archive'; each index joins the file system's index list and each archive its archive list. A data set whose index is missing is skipped when its parent index is not open, else logged 'File not found' and 0x80070490. Any error stops the mount and is returned."
proof = "Ghidra decompile: '%s\\%s' with the game folder, GetFullPathNameW, L'\\Patch\\CoreData.archive' -> 0x14018d950 (log 0x141d416b0 = 0x140a47070 after LogMessage's 0x12fa640 shift); L'\\Patch\\Patch.index' -> 0x14018d7d0(path, fs, &patch, 0) at 0x1401b4825, missing -> log 0x140a47250 'File not found: %s', 0x80070490; L'\\Bootstrap\\Bootstrap.index' at 0x1401b494d; names pushed by flag bits with the parent pair {'Patch', length, patch index} or {'Bootstrap', ...}; L'\\%s\\%s.index'; parent slot 0x28 (0x1401bfac0) with the path after the parent folder fills a 0x38-byte record; 0x1401b4db4 call 0x14018d7d0(path, fs, &index, record); L'\\%s\\%s.archive' -> 0x14018d950; 0x140033260 appends to the file system at 0x850 (indexes) and 0x860 (archives). Called by 0x1401b41f0 at 0x1401b444c, which takes its failure path at 0x1401b4453 on a negative result."
grade = "fairly sure"
gap = "The lookup slot 0x1401bfac0 and the record it fills (the time, size and SHA-1 that 0x1401ba2a0 checks) are read only from the use; what 0x1401b41f0 shows the player on failure (0x1401b4529) is unread."
name = "MountClientArchives"

