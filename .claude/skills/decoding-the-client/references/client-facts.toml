["0x1400088c0"]
statement = "The client's process entry point. It sets up the stack-protection cookie, sets a start-up flag, makes C runtime errors show a message box, calls SetErrorMode(0), runs a set-up step that queries the process's own security information, refuses to run below Windows 5.1 SP3 (XP SP3), or on Windows 5.2 below SP2, with a message box in English, German, French and Chinese and exit code 1, then jumps to the C runtime's start-up, which sets up the cookie again and runs the program."
proof = "llvm-objdump 0x1400088c0 sub rsp, 0x28; 0x1400088c4 call 0x1407dc118 (reads cookie 0x140c0f7b0, compares 0x2b992ddfa232, mixes GetSystemTimeAsFileTime, GetCurrentThreadId, GetCurrentProcessId, QueryPerformanceCounter); 0x1400088c9 mov ecx, 2; 0x1400088ce mov dword [0x140c63734], 1; 0x1400088d8 call 0x1407dc1cc (Ghidra _set_error_mode: accepts 0..2, 3 returns the mode); 0x1400088df call [SetErrorMode] with ecx 0; 0x1400088e5 call 0x1401933b0 (GetCurrentProcess, ADVAPI32 GetSecurityInfo, LocalAlloc); 0x1400088ea call 0x1400086b0 (0x140193b70 with (5,1,3), then (5,2,0) and (5,2,2); on failure MessageBoxW with the text at 0x1409d6ab0 or 0x1409d6f70, caption 'WildStar', then ExitProcess(1)); 0x1400088f3 jmp 0x1407dc104 (call 0x1407dc118; jmp 0x1407dbf4c). PE AddressOfEntryPoint 0x88c0. test_client_pe.py test_the_entry_point_is_a_function_start checks it is a function start."
grade = "fairly sure"
gap = "0x1401933b0 (what it does with the security information), 0x140193b70 (taken as a Windows version check from its arguments and messages) and the C runtime start at 0x1407dbf4c are not read in full."
name = "ClientEntryPoint"

