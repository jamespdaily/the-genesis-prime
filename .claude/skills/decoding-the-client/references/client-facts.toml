statement = "Message 0x763 (1891), game server to client: handled by HandleServerMessage itself, after its fixed handlers and before the game's handler list. Its message holds a count of groups, each with a count of texts (one byte) and a list of text pointers; the client passes a list the game keeps to 0x14001a1b0, then for each group adds an entry (0x14001a070) and each of the group's texts to it (0x140019b70). It ends the dispatch, so no handler on the list sees it."
proof = "0x1400156f4 cmp edi, 0x763; 0x1400156fa jne 0x14001581f; 0x140015700 lea rdi, [r12+0x1638] (game 0x1738); 0x14001570f call 0x14001a1b0; 0x14001571b cmp dword [r13], ebx (the group count); 0x140015728 call 0x14001a070 per group; 0x140015731..0x14001573b the group at [r13+0x8] + 16 x index; 0x14001573e cmp byte [rdx+0x4], r14b (its text count); 0x140015759 mov rsi, [rax+8*rcx] (each text, from [rdx+0x8]); the text copied as a counted wide string (0x140015784 call 0x14018b280, 0x1400157b1 call 0x1407db590) and added by 0x1400157d8 call 0x140019b70; 0x14001581a jmp 0x140015ac4 (return 0)."
