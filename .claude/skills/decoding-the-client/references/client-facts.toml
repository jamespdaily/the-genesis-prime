grade = "fairly sure"
gap = "The stages are read from Ghidra's decompile. With no row, the ncProgramId default reads the row through a null pointer; that this crashes the client is inferred, not run. Ordinals 8, 9 and 15 are read as htonl, htons and ntohs from Windows' ws2_32.dll export table, not from the client."
