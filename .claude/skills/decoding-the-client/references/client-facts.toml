# The NC platform login library, StsConnLib64.MT.dll: the STS protocol the client speaks before the auth server



["StsConnLib64.MT.dll!0x180000000"]
statement = "StsConnLib64.MT.dll, shipped beside the client, is the NC platform login library the client loads (LoadStsConnLib). It is a 64-bit DLL loaded at 0x180000000 exporting CreateStsConn (ordinal 1), FinalizeStsConnLib (2) and InitializeStsConnLib (3). It speaks the STS protocol over one TCP connection: text messages with an HTTP-like first line and headers, XML bodies, a login by SRP-6a (SHA-256, the 1024-bit group of RFC 5054, little-endian numbers) and, after the login, RC4 over every byte in both directions."
proof = "File SHA-256 aa0ef5888d17eb65da28b1cbef178d1650a837303c10a6fafc9f3c646c2f3fd1, 1899520 bytes. llvm-readobj: ImageBase 0x180000000, AddressOfEntryPoint 0x46894; sections .text (0x1000, 0x121e3c), .rdata (0x123000), .data (0x170000), .pdata, .rsrc, .reloc. Export table: CreateStsConn RVA 0x36b0, FinalizeStsConnLib 0x1140, InitializeStsConnLib 0x10f0. Imported into the Ghidra project beside the client as /StsConnLib64.MT.dll and analysed (40 s). Source paths in its strings name the NC platform's StsConnLib, StsInetSocket, InetMsg, RapidXml, Srp and SocketCrypt modules."
grade = "fairly sure"
gap = "The fact checker accepts a sure grade only for addresses of the client (0x14...), so a fact read in StsConnLib64.MT.dll is graded fairly sure; teaching check_facts.py the library's addresses (0x18...) would let it be graded sure."

