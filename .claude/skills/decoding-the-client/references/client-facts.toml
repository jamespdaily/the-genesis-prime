["0x140538fd0"]
statement = "Starts the in-world interface. It registers the world's Lua libraries, reads <roaming application data>\\NCSOFT\\WildStar\\Addons.xml (the per-account addon settings), then scans for addons three times: UI\\Addons and UI as Carbine addons, and <roaming application data>\\NCSOFT\\WildStar\\Addons as non-Carbine (user) addons, then loads them. This is the only place user addons are found: the pre-game screens never scan that folder."
