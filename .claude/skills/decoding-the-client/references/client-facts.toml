["0x1401ba150"]
statement = "Empties a PACK archive opened for writing: resets the header to signature PACK, version 1, archive end 0x238 and no blocks, writes the 0x230-byte header at the start of the file and cuts the file to 0x230 bytes. Without write access it returns E_ACCESSDENIED."
