# Character select bounds: character slots, the counts in a create request, and a second login
# of an account already in the world

["lua.CharacterSelection.OnLoadFromCharacter"]
statement = "Character select's count of character slots, the only place the client holds one. Slots = GetStaticRewardPropertyForTier(tier, CharacterSlots, 0, true).nValue, plus the count of the account's BaseCharacterSlots entitlement (12) when the account holds that entitlement; without it, slots = the larger of that value and the number of listed characters. The most slots = GetStaticRewardPropertyForTier(tier, CharacterSlots, 0, false).nValue. The create entries (new character, level-50 character) are shown only while slots exceed the listed characters, and the buy-a-slot entry only while the most exceeds slots; the counter reads '<characters>/<slots> Character Slots in use.' With the client's tables (RewardPropertyPremiumModifier.rewardPropertyId) this is, under the Hybrid premium system (command-line gmode 0, the default): 2 plus the account's BaseCharacterSlots count, the most 14; under VIP (gmode 1): 3 plus any BaseCharacterSlots count, the most 3. The premium tier does not change either. No message carries a slot count: what the server controls is the BaseCharacterSlots entitlement count (opcode.0x968, opcode.0x973). The six-character constant kiCharacterMax only decides when the list scrolls."
proof = "UI/PreGame/CharacterSelection/CharacterSelect.lua in ClientData.archive: line 16 kiCharacterMax = 6, used only for bNeedScroll (lines 184-185); lines 98-99 nTier = AccountItemLib.GetPremiumTier(); lines 158-159 the two GetStaticRewardPropertyForTier calls; lines 345-355 the BaseCharacterSlots entitlement added, bCanCreateCharacter = nNumCharacterSlots > nCharCount, bCanGetNewSlot = nMaxSlots > nNumCharacterSlots; lines 414-424 the CharacterSlot store entry; lines 435-440 the counter and tooltip (Pregame_CharacterCounter 739670 '$1n/$2n Character Slots in use.', Pregame_CharacterSlotCountTooltip 740025, LocalizedEnum.tbl and en-US.bin). The enum values: AccountItemLib.CodeEnumRewardProperty (CharacterSlots 29), AccountItemLib.CodeEnumEntitlement (BaseCharacterSlots 12). The values: RewardPropertyPremiumModifier.rewardPropertyId and LuaGetStaticRewardPropertyForTier 0x1404e7650."
grade = "fairly sure"
gap = "The Lua is read from the archive with a scratch extractor. The client only hides its create entry when the account is full; it does not refuse a create itself, so CreateFailed_AccountFull (9) is the server's own check against this count. That AccountItemLib.GetAccountEntitlement reads the list message 0x968 fills is inferred from the handler's decompile (0x1400062c0), not traced through the Lua function; a recording of a retail 0x968 holding entitlement 12 would settle it."

["lua.CharacterSelection.OnLoadFromCharacter.list"]
statement = "How character select builds and shows its list on LoadFromCharacter. It returns at once, showing nothing, when GetPremiumTier is nil or below 0 (with the premium object present it is 255 or the account's tier, so it passes). For each character, in list order: the frame is Dominion when idFaction is 166 and Exile for any other value; the level text is nLevel; the portrait comes from ApplyCharacterToCostumeWindow; class icons 1 to 20 are hidden and ClassIcon_<idClass> is shown when idClass is at most 20; path icons 1 to 4 are hidden and PathIcon_<idPath + 1> is shown when idPath + 1 is at most 4 (paths 0 to 3); the name is strName and the location strZone, or empty when there is none; a disabled character (bDisabled) is greyed, shows 'Locked' and has no button. The character preselected is the pending in-world one, else the one not disabled with the largest fLastLoggedOutDays, else the first; selecting it puts up its model (AddActorByRaceGenderClass with idRace, idGender and idClass), shows its name and enables Enter. With no characters it shows the CreateNewPrompt entry with the realm's name, PvP type and note, writes 'CharacterSelect_NoCharactersFound' in the name panel, shows Rowsdower on the pedestal and leaves Enter disabled; the create entries follow the slot count (lua.CharacterSelection.OnLoadFromCharacter). Either way it then shows the list and the top panel and plays the character-select music. Nothing here reads idWorld, bRequiresRename, the character id or the customisation values; AccountItemLib.GetAccountCurrency always returns a money object, so it never stops the build."
proof = "UI/PreGame/CharacterSelection/CharacterSelect.lua in ClientData.archive: lines 98-101 the tier check (return when nil or < 0); line 103 GetAccountCurrency(PromotionToken):GetAmount(); lines 17-18, 23 kiMaxClassCount 20, kiMaxPathCount 4, kidDominionFaction 166; lines 189-283 the per-character loop (204-205 faction, 207-210 fLastLoggedOutDays, 212 nLevel, 213 ApplyCharacterToCostumeWindow, 215-221 class icons, 223-230 path icons, 233-242 name and location, 249-262 bDisabled); lines 293-295 forced selection; lines 315-343 the empty-list prompt; lines 442-489 the default selection or, with no items, 'CharacterSelect_NoCharactersFound' and Rowsdower; lines 491-496 shown; lines 629-663 SetCharacterDisplay and SetCharacterCreateModel. GetPremiumTier: LuaGetPremiumTier 0x1404e7b30. GetAccountCurrency 0x1404e5640 (name pair 0x140b69960, decompiled): builds a Game.Money object for the currency in every case, its amount from the game's currency array or 0."
grade = "fairly sure"
gap = "The Lua is read from the archive with a scratch extractor and the forms are not extracted, so whether a ClassIcon_0 or PathIcon window exists is not read: a class of 0 calls Show on what FindChild returns and, if no such window exists, raises a Lua error that stops the build before the list is shown (guess); class 1 to 20 is safe because the hide loop needs all twenty windows. What AddActorByRaceGenderClass does with a race, gender and class that name no model is not read; a live login with a class 0 or race 0 character would settle both."

["RewardPropertyPremiumModifier.rewardPropertyId"]
statement = "How the client turns RewardPropertyPremiumModifier rows into reward property values. It keeps only the rows whose premiumSystemEnum is the premium system (command-line gmode 0 gives 1, Hybrid; gmode 1 gives 2, VIP; any other gmode fails the load), grouped by tier, rewardPropertyId and rewardPropertyData. A row with flags bit 1 also counts for every higher tier up to the highest tier among the system's rows. For an integer property (RewardProperty.rewardModifierValueTypeEnum 1) the value is the sum of the rows' modifierValueInt. A row naming entitlementIdModifierCount adds that Entitlement row's maxCount to the 'most' values only and nothing to the current values (character select adds the account's own count itself). For CharacterSlots (rewardPropertyId 29, integer): Hybrid row 117 gives 2 from tier 0 up and row 118 adds Entitlement 12 (BaseCharacterSlots, maxCount 12) to the most, so 2 now and 14 at most; VIP row 119 gives 3, now and at most."
proof = "Rows read from RewardPropertyPremiumModifier.tbl (ID 117: system 1, tier 0, property 29, data 0, modifierValueInt 2, flags 1; ID 118: system 1, tier 0, property 29, entitlementIdModifierCount 12, flags 1; ID 119: system 2, tier 0, property 29, modifierValueInt 3, flags 1; no other row names 29), RewardProperty.tbl (ID 29, rewardModifierValueTypeEnum 1) and Entitlement.tbl (ID 12, maxCount 12). Code, from Ghidra's decompile: LoadRewardPropertyModifiers 0x140436310 maps gmode 0 to 1 and 1 to 2 and reports any other, keeps rows whose second word equals it, looks up RewardProperty, takes modifierValueInt for type 1, and for an entitlement row adds two entries (kinds 5 and 7); CopyTierModifiersUp 0x140436700 copies a flags-bit-1 row to each tier above it up to the highest; ApplyRewardPropertyModifiers 0x1403aaba0 adds an entitlement entry only for the 'most' map (third argument 1), with the Entitlement row's second word (maxCount), and skips kind 7; CombineRewardPropertyValues 0x1403aaec0 sums the integers for type 1. 0x1404367e0 builds both maps (0x140436970 calls 0x140436d70 with 1 and 0x140020690 with 0). The system: 0x14043687b mov edx, dword ptr [rax+0x1708] (game 0x1708) passed to 0x140436310; start-up sets game 0x1708 from gmode (0x14000b985 mov dword ptr [rsi+0x1708], ecx, record 0x14000b690). GetPremiumSystem 0x1404e7af0 returns the kept system (1 or 2)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile apart from the instructions named; how float properties (types 0 and 2) combine is not read. The client also sends gmode to the auth server as 0x592's third 32-bit value of four (game 0x1708, opcode.0x592), so the server can know the system."

