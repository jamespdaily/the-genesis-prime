["0x140332580"]
statement = "The network object's send-by-id method: looks up the message's serialiser by id and sends the message on the given connection; an unknown id is logged as 'Message Id', 'Base Message Id' or 'Invalid or foreign Message Id' with its number. The message name table it would print from holds no names in this build. The client sends through it at 23 sites: 20 send message 0x244 (the wrapper every other message travels in), from SendWorldMessage, 0x1403f4740, 0x140016010, 0x1400161d0, StartCharacterSelect, StartRealmSelect, SendAuthLoginRequest, the two senders of 0x58f and ten other functions at eleven sites (see SerialiseMessageById); the network layer's own code sends ids 0, 1 and 2 bare, which RegisterMessage never registers."
