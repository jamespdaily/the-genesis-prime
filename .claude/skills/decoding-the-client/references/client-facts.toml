["opcode.0x3dc"]
statement = "Message 0x3dc (988), game server to client: the encrypted wrapper for game-server messages, the server's hello included, since the client accepts message 3 bare only from the auth server. Its body is one whole inner frame: the inner 32-bit length (counting its own 4 bytes, little-endian, in the clear), then the inner 16-bit id and body, encrypted. The client decrypts it with the game connection's cipher (DecryptMessageBody over the inner length minus 4 bytes), parses the inner frame and handles the inner message (HandleServerMessage). The game connection's cipher holds the base key from the hand-off until the client sends 0x58f, and the session key after."
proof = "Registered at 0x14006c33d mov edx, 0x3dc with 0x14006c326 xor r9d, r9d (no sizer); 0x14006c342 mov qword ptr [rsp+0x20], 0x0 (no writer); 0x14006c336 lea r8d, [r9+0x8]; reader 0x140079f70 at 0x14006c331 mov [rsp+0x28], rcx; 0x14006c329 mov dword ptr [rsp+0x30], 0x0 (mode 0). Decrypted with the connection at game 0x1728 by 0x140014f10. The game connection is keyed with game 0x1630 at 0x1400380ce mov r8, [rax+0x1630]; 0x1400380d5 call 0x14002a050 (HandleMessage03DB) and 0x1400462db (HandleMessage07A1), and re-keyed after 0x58f at 0x1400382c8 call 0x14002a050."
grade = "fairly sure"
gap = "That the game server's hello arrives inside 0x3dc is inferred from HandleServerMessage's decompile; a recording of a real game-server exchange would settle it."

["0x14002a050"]
statement = "Starts a connection's cipher with a 64-bit key: drops any cipher the connection had and builds a new one from the key (NewConnectionCipher); a failure is reported as an error. One cipher object serves both ways on a connection: the client encrypts what it sends with it (EncryptMessageBody) and decrypts what it receives (DecryptMessageBody). Called with the base key when a connection opens (ConnectToAuthServer, HandleMessage03DB, HandleMessage07A1) and with the session key right after 0x58f is sent (HandleLoginGameServerHello, HandleRealmSwitchServerHello)."
proof = "0x14002a05f lea rbx, [rcx+0x10] (the connection's cipher slot); 0x14002a066 mov rcx, [rbx]; 0x14002a070 call 0x14018b900 (frees the old one); 0x14002a075 mov qword ptr [rbx], 0x0; 0x14002a07c mov r8, rsi (the key, the third argument, kept from 0x14002a063 mov rsi, r8); 0x14002a07f mov rcx, rbx; 0x14002a082 call 0x1400c2eb0; 0x14002a08b jns 0x14002a16e, else ReportError. Senders call the object's 0x10 slot with its 0x8 as context (a scan of the disassembly for that pattern finds 21 sites, among them 0x140038231 and 0x1403f4a7b); HandleServerMessage calls its 0x20 slot with its 0x18 (0x14001526f call [rax+0x20]). Ghidra callers: 0x140039598 (ConnectToAuthServer), 0x1400380d5 (HandleMessage03DB), 0x1400462e9 (HandleMessage07A1), 0x1400382c8 (HandleLoginGameServerHello) and 0x1400464e7 (HandleRealmSwitchServerHello), and no others."
grade = "sure"
name = "StartConnectionCipher"

["0x1400c2eb0"]
statement = "Builds a connection cipher from a 64-bit key: expands the key into sixteen 64-bit words and hands them to a new cipher object (InitConnectionCipher). With x = key + 0x718DA9074F2DEB91, each word in turn is x * 0xAA7F8EA9 (64-bit, wrapping), and x becomes that word + key before the next. A key of 0 is refused."
proof = "0x1400c2ed3 test r8, r8; 0x1400c2ed6 je 0x1400c2f52 (0x80004005); 0x1400c2ed8 mov rax, 0x718da9074f2deb91; 0x1400c2ee2 mov r9d, 0xaa7f8ea9 (zero-extended, so the multiplier is 0x00000000aa7f8ea9); 0x1400c2ef0 add rax, r8; 0x1400c2efd imul rax, r9; loop 0x1400c2f01 mov [rcx], rax; 0x1400c2f04 add rax, r8; 0x1400c2f0b imul rax, r9; 0x1400c2f0f dec rdx (16 passes from 0x1400c2ef8 mov edx, 0x10); 0x1400c2f19 call 0x14018b280 (0xb0 bytes); 0x1400c2f2d call 0x1400c2bd0 with the words at the stack's 0x20. Run on Ghidra's p-code emulator from 0x1400c2ed8 to 0x1400c2f14 for the keys 0xd283f5b34a8dc685, 0xac9a7c6ed16e5bee and 1: the 16 words matched the formula."
grade = "sure"
name = "NewConnectionCipher"

["0x1400c2bd0"]
statement = "Fills a new 176-byte connection cipher object: a count of 2, the encrypt routine (EncryptMessageBody) and the decrypt routine (DecryptMessageBody) each with the object as its context, the sixteen key words, and a 64-bit chaining start h: h starts at 0x718DA9074F2DEB91 and, for each key word in order, becomes (h + word) * 0xAA7F8EA9. The encrypt and decrypt routines only read the object, so each message is ciphered from the same start, with no state carried from one message to the next."
proof = "0x1400c2bd0 mov dword ptr [rcx], 0x2; 0x1400c2bd6 mov [rcx+0x8], rcx; 0x1400c2bda lea rax, [0x1400c2d10]; 0x1400c2be1 mov [rcx+0x10], rax; 0x1400c2be5 mov [rcx+0x18], rcx; 0x1400c2be9 lea rax, [0x1400c2de0]; 0x1400c2bf0 mov [rcx+0x20], rax; 0x1400c2c01 mov [rcx+0xa8], rax (0x718da9074f2deb91); words to 0x28..0xa0 (0x1400c2c0f..0x1400c2ca0); 0x1400c2c25 mov r11d, 0xaa7f8ea9; loop 0x1400c2cb0..0x1400c2cfc: add, imul r11, store at 0xa8, four words a pass, four passes (0x1400c2c17 mov r10d, 0x4); returns the object. Neither 0x1400c2d10 nor 0x1400c2de0 stores to the object. Run on Ghidra's p-code emulator for the base key and a session key: the object's count, routines, context, words and h (0x7d546d1d1994c849 for the base key) matched."
grade = "sure"
name = "InitConnectionCipher"

["0x1400c2d10"]
statement = "Encrypts n bytes in place with a connection cipher (key words K[0..15], chaining start h). Let i = n * 0xAA7F8EAA (32-bit, wrapping; only i mod 16 is used, so it starts at 10n mod 16) and p = h. Each whole 8-byte little-endian word w becomes c = K[i mod 16] xor w xor p, then p = c and i = i + 1. The last n mod 8 bytes are each xored with the byte at the same position of K[i mod 16] and of p (little-endian), with i and p as the words left them. With n = 0 nothing changes. It is not a standard cipher."
proof = "0x1400c2d1f mov r10, [rcx+0xa8] (h); 0x1400c2d2c shr ebx, 0x3 (words); 0x1400c2d35 imul r9d, r9d, -0x55807156 (n * 0xaa7f8eaa); loop 0x1400c2d50 mov eax, r9d; 0x1400c2d53 inc r9d; 0x1400c2d5a and eax, 0xf; 0x1400c2d5d mov rcx, [rdi+rax*8+0x28]; 0x1400c2d62 xor rcx, [r8-0x8]; 0x1400c2d66 xor rcx, r10; 0x1400c2d69 mov [r8-0x8], rcx; 0x1400c2d6d mov r10, rcx; 0x1400c2d70 mov [rsp+0x8], rcx; tail: 0x1400c2d7a and r11d, 0x7; 0x1400c2d8a and ecx, 0xf; 0x1400c2dba and ecx, 0x7; 0x1400c2dbd movzx ecx, byte ptr [rcx+r10+0x28]; 0x1400c2dc3 xor cl, byte ptr [r9+rax-0x1] (byte j of p at the stack's 0x8); 0x1400c2dc8 xor byte ptr [rax-0x1], cl. Run on Ghidra's p-code emulator for the base key and a session key over random bodies of 0, 1, 7, 8, 9, 15, 16, 17, 31, 100, 1000 and 53248 bytes: every output matched the formula."
grade = "sure"
name = "EncryptMessageBody"

["0x1400c2de0"]
statement = "Decrypts n bytes in place with a connection cipher, undoing EncryptMessageBody: with i and p started the same way, each whole 8-byte word c becomes K[i mod 16] xor c xor p, then p = c (the ciphertext word) and i = i + 1; the last n mod 8 bytes are xored as in encryption."
proof = "0x1400c2deb mov r10, [rcx+0xa8]; 0x1400c2df8 shr esi, 0x3; 0x1400c2e01 imul r9d, r9d, -0x55807156; loop 0x1400c2e20 mov rdx, [r8] (c); 0x1400c2e29 and eax, 0xf; 0x1400c2e30 mov rcx, [rdi+rax*8+0x28]; 0x1400c2e35 xor rcx, rdx; 0x1400c2e38 xor rcx, r10; 0x1400c2e3b mov r10, rdx; 0x1400c2e3e mov [r8-0x8], rcx; 0x1400c2e4c mov [rsp+0x10], rdx (last c for the tail); tail 0x1400c2e80..0x1400c2e9e as in 0x1400c2d10. Run on Ghidra's p-code emulator after 0x1400c2d10 on the same lengths and keys: every input came back."
grade = "sure"
name = "DecryptMessageBody"

["0x14000a6db"]
statement = "Computes the client's base cipher key, kept in the game object at 0x1630: 0xD283F5B34A8DC685. It is fixed for the build: ((0x718DA9074F2DEB91 + 0x5B88D61139619662) * 0xAA7F8EA9 + 16042) * 0x718DA9074F2DEB91 + 0x064F77F4AB4E81A0, all 64-bit and wrapping, where 16042 is the build. It keys the auth connection and each new game connection, and is folded into the session key after 0x58f."
proof = "In the game object's constructor 0x14000a490: 0x14000a502 mov rdi, 0x718da9074f2deb91; 0x14000a545 mov qword ptr [rbx+0x1630], rdi; 0x14000a6db mov rax, qword ptr [rbx+0x1630]; 0x14000a6e2 mov rcx, 0x5b88d61139619662; 0x14000a6ec add rax, rcx; 0x14000a6ef mov ecx, 0xaa7f8ea9; 0x14000a6f4 imul rax, rcx; 0x14000a6f8 mov rcx, 0x64f77f4ab4e81a0; 0x14000a702 add rax, 0x3eaa; 0x14000a708 imul rax, rdi; 0x14000a70c add rax, rcx; 0x14000a70f mov qword ptr [rbx+0x1630], rax. Between 0x14000a502 and 0x14000a708 rdi is not written (three calls, rdi callee-saved). 0x14001935f mov ecx, 0x1758; 0x140019374 call 0x14000a490; 0x140019379 mov [0x140c635f0], rax (the game object). Every instruction in the client naming offset 0x1630: the readers 0x1400380ce, 0x14003827e, 0x140039591, 0x1400462db, 0x1400464a7; the other writers are to other objects: 0x14035204a in 0x140351a20, 0x1403b611c in 0x1403b5f80 (the world object, which it writes up to offset 0x751c), 0x14042210e in another class's constructor 0x1404218a0 on its own object, and 0x14000fcd7 movaps xmmword ptr [rbp+0x1630], xmm0 in 0x14000b690 on a stack local (0x14000b692 lea rbp, [rsp-0x19e0]). Run on Ghidra's p-code emulator from 0x14000a6db to 0x14000a716: 0xd283f5b34a8dc685."
grade = "fairly sure"
gap = "A write to game 0x1630 through a block copy or a computed offset is not excluded by the instruction search; reading game 0x1630 in a running client would settle it."

