proof = "Ghidra decompile: 0x1400569b0(L, 'Game.Housing'); 0x140057020(L, 'HousingLib', 0x140b747a0 = {IsHousingWorld 0x140731a20, IsResidenceOwner, ...}); for each enum a key pushed by 0x140058710, a new table by 0x14005c1b0 (type tag 5), then key/number pairs stored by 0x14005ea50 into the table at -3; RemodelOptionTypeInterior: 'Wallpaper' 1.0, 'Floor' 2.0, 'Ceiling' 3.0, 'Trim' (0x140b47ed4) 4.0, 'Lighting' 5.0, 'Music' 6.0. Ends 0x140058a40(L, -10002, 'HousingLib') (the Lua 5.1 globals index). Reached from 0x14050a798 in 0x14050a3c0 with the name 'HousingLib'. The client's UI/Housing/HousingRemodel.lua uses HousingLib.RemodelOptionTypeInterior.Wallpaper..Music."
grade = "fairly sure"
gap = "The Lua helpers are named from use, not read; the values of the other enum tables are listed by name only here."
name = "RegisterHousingLibLuaLibrary"

["0x140001b30"]
statement = "A call-through helper: it takes a function pointer as its first argument and tail-calls that function with the caller's second to sixth arguments, each moved down one place. It holds no jump table."
proof = "0x140001b30 mov [rsp+8], rbx; 0x140001b35 push rdi; 0x140001b36 sub rsp, 0x30; 0x140001b3a mov rax, [rsp+0x68] (sixth argument); 0x140001b42 mov r9, [rsp+0x60] (fifth); 0x140001b4a..0x140001b56 rdx->rcx, r8->rdx, r9->r8; 0x140001b59 mov [rsp+0x60], rax (sixth becomes fifth); 0x140001b5e mov rax, rdi (first argument); 0x140001b61..0x140001b6a restore rbx, rdi and rsp; 0x140001b6b jmp rax. .pdata gives the function 0x140001b30..0x140001b6e. Ghidra decompiles it as (*param_1)(param_2, param_3, param_4, param_5); refs_to lists 67 data references (lea of its address), no direct callers. test_jump_tables.py checks that the jmp is not a switch."
grade = "sure"
name = "InvokeFunctionPointer"

["0x140001b6b"]
statement = "The tail jump of InvokeFunctionPointer (0x140001b30) to the function pointer it was passed. It is the function's last instruction and reads no jump table."
proof = "0x140001b5e mov rax, rdi (the first argument, saved at 0x140001b4d mov rdi, rcx); 0x140001b6b jmp rax; the 3-byte instruction ends at 0x140001b6e, the end of the .pdata range 0x140001b30..0x140001b6e. No bounds check or table load precedes it; Ghidra switch_targets returns []. test_jump_tables.py (test_a_computed_jump_that_is_not_a_switch_is_not_found_and_says_why) checks it."
grade = "sure"

["0x140003fb0"]
statement = "Handles game messages with ids 2406 to 2432 (0x966 to 0x980) through a 27-case switch on the message id, given the handler object, the connection, the id and the decoded message. It returns 0 when it handled the message and 1 for any other id and for id 2418. Message 2416 raises the UI event AccountOperationResults with two values from the message; message 2432 stores a new value and raises WalletUpdate when it changed; message 2411 merges a list of 64-bit keys into the handler's list. The message receiver at 0x140014f10 calls it with the id it decoded; the second argument is unused."
proof = "0x140003fba add r8d, -0x966; 0x140003fc7 cmp r8d, 0x1a; 0x140003fcb ja 0x1400043ef; 0x140003fdd mov edx, [rcx+r8*4+0x4400] (rcx = image base); 0x140003fe5 add rdx, rcx; 0x140003fe8 jmp rdx. Decompiled: case 0x970 calls 0x1400ea3e0(ui, 'AccountOperationResults', fmt, msg[0], msg[1]); case 0x980 compares and stores msg[0] then calls 0x1400ea3e0(ui, 'WalletUpdate', ...); case 0x972 and default return 1. Caller: 0x14001527e passes the id's slot to the decoder, 0x1400152a3 mov edi, [rbp+0x68]; 0x1400152ab jmp 0x14001559a; 0x1400155b4 mov r8d, edi; 0x1400155b7 call 0x140003fb0; a negative result is logged with the message's name from 0x140335f10 ('Base Message Id #%d' / name table / 'Invalid or foreign Message Id #%d'). test_jump_tables.py checks the switch shape."
grade = "fairly sure"
gap = "Only messages 2411, 2416, 2418 and 2432 were read; what the other 23 handlers (0x140004470 .. 0x140007180) do with their messages, and so whether the whole group is account traffic, is unread."
name = "HandleMessages0966To0980"

["0x140003fe8"]
statement = "The jump of a 27-case switch on the message id in HandleMessages0966To0980 (0x140003fb0): case k handles id 2406 + k. Ids outside 2406..2432 go to the default 0x1400043ef. The table is 27 four-byte image-relative entries at 0x140004400, all 27 targets distinct."
proof = "0x140003fba add r8d, 0xfffff69a (-0x966); 0x140003fc7 cmp r8d, 0x1a; 0x140003fcb ja 0x1400043ef; 0x140003fd1 lea rcx, [0x140000000]; 0x140003fdd mov edx, [rcx+r8*4+0x4400]; 0x140003fe5 add rdx, rcx; 0x140003fe8 jmp rdx. The 27 entries read from the file match Ghidra switch_targets (27 addresses, 0x140003fea..0x1400043da). test_jump_tables.py (test_the_27_case_switch_has_its_jmp_default_and_case_count, test_the_27_case_switch_targets_are_the_table_entries_in_the_file) checks it."
grade = "sure"

["0x1400040fd"]
statement = "Case 5 of HandleMessages0966To0980's switch, message id 2411 (0x96b): it tail-calls the handler 0x140004f60 with the handler object and the message, which adds each 64-bit key in the message's list that the handler does not already hold to its list, and returns 0."
proof = "Table entry 5 at 0x140004414 is RVA 0x40fd. 0x1400040fd mov rdx, rbx (the message); 0x140004100 mov rcx, rdi (the handler object); 0x140004103..0x140004111 restore and pop; 0x140004112 jmp 0x140004f60. 0x140004f60 decompiled: for each of the message's count entries (40 bytes each) it searches the handler's list for the entry's first 8-byte key and calls 0x1400073f0 to append it when absent; returns 0. test_jump_tables.py (test_case_5_of_the_27_case_switch_goes_to_0x1400040fd, test_a_changed_table_entry_changes_exactly_that_target) checks the target."
grade = "sure"

["0x1400043ef"]
statement = "The default of HandleMessages0966To0980's switch: for a message id outside 2406..2432 it returns 1, meaning not handled."
proof = "0x140003fcb ja 0x1400043ef; 0x1400043ef mov eax, 1; 0x1400043f4 mov rbx, [rsp+0x68]; 0x1400043f9 add rsp, 0x50; 0x1400043fd pop rdi; 0x1400043fe ret. No table entry points here (case 12, id 2418, has its own block 0x1400043da that also returns 1). test_jump_tables.py checks the default."
grade = "sure"

["0x140004400"]
statement = "The jump table of HandleMessages0966To0980's 27-case switch: 27 four-byte offsets from the image base, entry k for message id 2406 + k. It sits in .text right after the function's code, and the function's .pdata ranges cover it."
proof = "Read by 0x140003fdd mov edx, [rcx+r8*4+0x4400] with rcx = 0x140000000. Bytes: d7420000 f1420000 88410000 4e410000 e3400000 fd400000 ... ea3f0000, i.e. 0x1400042d7, 0x1400042f1, 0x140004188, 0x14000414e, 0x1400040e3, 0x1400040fd, ... 0x140003fea. File offset 0x3800 (14336): .text has virtual address 0x140001000 and raw offset 0x400, so entry 5 is at 14356. .pdata of 0x140003fb0 includes the range 0x140004400..0x14000446c (27 x 4 bytes); Ghidra function_at returns null. refs_to: 0x140003fdd and an unwind record at 0x140dc74d4. test_jump_tables.py checks the entries."
grade = "sure"

["0x1400bc619"]
statement = "The jump of an 8-case switch on a zone-kit slot number (0 to 7) in function 0x1400bc580, which sets the zone-kit value of a slot. Each case builds once, then updates, a static object named for its slot: ZoneKit 0 World, 1 HousingMusic, 2 ClientEvent, 3 WorldProp, 4 PlayerPath, 5 Dead, 6 Visuals, 7 StoreMusic; every case then continues to 0x1400bc7a8, which stores the entry looked up for the value in the slot's place. A slot above 7 skips the switch and goes to 0x1400bc7a8 directly. The table is 8 four-byte image-relative entries at 0x1400bc884. Ghidra recovers none of the 8 targets."
proof = "0x1400bc592 mov esi, r8d (value); 0x1400bc598 movsxd rbx, edx (slot); slot 0 first updates a field and calls 0x14001a770 when the value changed; 0x1400bc5ff cmp ebx, 7; 0x1400bc602 ja 0x1400bc7a8; 0x1400bc608 lea rdx, [0x140000000]; 0x1400bc60f mov ecx, [rdx+rbx*4+0xbc884]; 0x1400bc616 add rcx, rdx; 0x1400bc619 jmp rcx. Table bytes give 0x1400bc61b, 0x1400bc64d, 0x1400bc67f, 0x1400bc6b1, 0x1400bc6e3, 0x1400bc715, 0x1400bc744, 0x1400bc773. Each case tests a guard bit (1, 2, 4 .. 0x80) of 0x140c8cd58, calls 0x1401ad620 with a wide name string (0x140a14250 'ZoneKit 0 World' .. 0x140a14360 'ZoneKit 7 StoreMusic'), then 0x1400bc7a1 call 0x1401ada40 with the value and falls into 0x1400bc7a8. Ghidra switch_targets returns []. test_query_process.py (test_ghidra_agrees_with_the_jump_table_reader_on_299_of_302_switches) lists it among the three that differ."
grade = "fairly sure"
gap = "What 0x1401ad620 and 0x1401ada40 do with the named object, and what game table the value indexes, are unread."

["0x1403ec6a0"]
statement = "Handles the game's world messages: given the handler object, a connection id, the message id and the decoded message, it returns 1 (not handled) unless the connection id is the current world connection's; otherwise it dispatches on the message id through a 2,322-case switch covering ids 97 to 2418 (0x61 to 0x972). 645 of those ids reach a case; the record of its jump table (0x1403f1344) lists them. Seven of them (209, 231, 385, 1487, 1758, 2019 and 2118) share a case that does nothing and returns 0, so the client takes and ignores them. Ids 975 to 978 (0x3cf to 0x3d2) share a case that passes the message to the game's handler kept at game 0x15a8 (HandleMessages03CFTo03D2) and returns its result, or 1 when that handler is missing or already on the game's handler list. The other cases act on their message, many of them raising UI events (for example MatchEntered, GuildChange, ItemAuctionWon, FriendshipResult). An id with no case is turned into its message name (or 'Message Id #<id>') and passed to a report call that is empty in this build, and the function returns 1."
proof = "0x1403ec6ba mov ebx, r8d (id); 0x1403ec6bd mov r8, [rcx+0x7928]; 0x1403ec6cd test r8, r8 / 0x1403ec6dc cmp edx, [r8+0x98]: either fails to 0x1403ec6d2 mov eax, 1; 0x1403ec6e5..0x1403ec6f6 copy the global at 0x140c636a8 into the handler object (purpose unread); 0x1403ec6eb lea eax, [rbx-0x61]; 0x1403ec6fc cmp eax, 0x911; 0x1403ec701 ja 0x1403f12d2; 0x1403ec719 jmp rcx. Cases end at 0x1403f1320 mov r14, [rsp+0xd8]; 0x1403f1328 mov eax, ebx (the result). The shared do-nothing case: 0x1403ec71b xor ebx, ebx; 0x1403ec71d jmp 0x1403f1320 (table entries for ids 209, 231, 385, 1487, 1758, 2019, 2118). The shared case for 975..978: 0x1403f0d86 mov r14, [0x140c65a48]; 0x1403f0d8d test r14, r14; 0x1403f0d90 je 0x1403f131b (mov ebx, 1); 0x1403f0d96 cmp qword [r14+0x18], 0 (its list link); 0x1403f0d9b jne 0x1403f131b; 0x1403f0dbb call [rax+0x58] with the connection id, id and message; 0x1403f0dc6 mov ebx, eax. 0x140c65a48 is set from game 0x15a8 at 0x1400100c1 mov rax, [rsi+0x15a8]; 0x1400100c8 mov [0x140c65a48], rax, and game 0x15a8 holds the object built by 0x1404d56b0 (0x14000ff95, 0x14000ffa2), whose class table 0x140b690f0 has 0x1404d60f0 at its message slot. The only other shared target, 0x1403f0bdd (ids 1671 and 1672), calls 0x1403c8690. A walk of every case to the shared end (scratch script over llvm-objdump's listing) finds no case that leaves the function another way. Case blocks (0x1403ec71b..0x1403f12d2) load 66 printable strings, among them event names such as MatchEntered and GuildChange, and make 44 calls to 0x1400ea3e0, the UI event raiser that HandleMessages0966To0980 calls with 'WalletUpdate'. Table: 2,322 entries, 1,677 to the default, 636 distinct targets. Its one pointer is slot 11 (0x58) of the class table at 0x140b66880 (relocated pointer at 0x140b668d8; the table is stored by 0x1403e1400 at 0x1403e1453), the slot HandleServerMessage calls on each handler on the game's list (0x140015847 call [rax+0x58], with the connection id, the id and the message)."
grade = "fairly sure"
gap = "HandleMessage00AD hands the world handler (built by 0x1403e1400 and kept at the world session's 0x60) to 0x140048100: 0x140022542 mov rdx, qword ptr [rdi+0x60]; 0x140022546 mov r8d, 0x4; 0x14002254f call 0x140048100, the call that also places ForwardServerMessage's wrapper; that 0x140048100 puts it on the game's handler list (game 0x15b0), where HandleServerMessage's slot call reaches it, is inferred, not read. What the cases for the other 638 ids do with their messages is read only where other records cite them."
name = "HandleWorldMessage"

