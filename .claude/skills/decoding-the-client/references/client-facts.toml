statement = "An archive index file (Patch, ClientData, ClientDataEN, Client64 .index) is a PACK container holding an AIDX block. Every number is little-endian. PACK header, 0x230 bytes at file offset 0: 0x000 u32 signature 0x5041434B (the bytes 'KCAP'); 0x004 u32 version, must be 1; 0x008 64 u64 file offsets, each 0 or a multiple of 16 at or after 0x240 with 24 bytes inside the archive end (their use is unread); 0x208 u64 archive end, which the file's real size must not be below; 0x210 u64, not read when opening; 0x218 u64 file offset of the block table; 0x220 u32 block count; 0x224 u32, below the block count when there are blocks; 0x228 u32 root block index, below the block count; 0x22c u32, not read when opening. With no blocks, 0x218, 0x224 and 0x228 must all be 0. The block table is block-count entries of 16 bytes: u64 file offset, u64 size. An entry with a nonzero size must start at a multiple of 16, at or after 0x240, with offset plus 24 and offset plus size inside the archive end; an entry with size 0 holds a block index below the count in its offset. Block index 0 is never readable. The root block (index from 0x228) begins with the AIDX header, 16 bytes: u32 signature 0x41494458 (the bytes 'XDIA'), u32 version, must be 1, u32 the index's build, u32 the block index of the root directory. The client reads the build into the index object but never compares it with its own build; a nonzero build only forbids adding files to the index."
proof = "PACK header: 0x1401b7c9b..0x1401b7caa reads 0x230 bytes from file offset 0 into the object at 0x38; 0x1401ba550 cmp dword [rcx+0x38], 0x5041434b; 0x1401ba559 cmp dword [rcx+0x3c], 1; loop 0x1401ba565..0x1401ba591 over 0x40 u64 at object 0x40 (file 0x008) with test al, 0xf / cmp 0x240 / add 0x18 / cmp [rcx+0x240] (file 0x208); 0x1401b7cd0 cmp [rsi+0x240], file size from GetFileSizeEx; 0x1401ba593 count at object 0x258 (file 0x220); table offset object 0x250 (file 0x218); object 0x25c (file 0x224) and 0x260 (file 0x228) below the count (0x1401ba5bd, 0x1401ba5c5). Table: 0x1401b7cf5 mov r9d, [rsi+0x258]; shl r9, 4; 0x1401b7d0c rdx = [rsi+0x250]; 0x1401b7d16 call 0x1401bc1a0; checks in 0x1401ba600. Root block: 0x1401b8870 returns object 0x260 (file 0x228); 0x1401b8600 refuses index 0, index >= count, size 0, or a range past the size. AIDX: 0x1401bf632 call [rax+0x78] (root index), 0x1401bf64c length 0x10, 0x1401bf655 call [rax+0x58] offset 0, 0x1401bf65c cmp dword [rbx+0x38], 0x41494458, 0x1401bf665 cmp dword [rbx+0x3c], 1; build at AIDX offset 8 (0x1401bf850 writes 4 bytes at block offset 8 and stores them at object 0x40, which 0x1401bf830 returns); 0x1401bf69f the fourth u32 (object 0x44) becomes the directory node's block, loaded by 0x1401bcea0. Build use: the only compare of 0x3eaa in the client is 0x140037bae (the auth server's version); object 0x40 is compared only with 0 (0x1401bf8f5, 0x1401c0050) giving 0xa0030004 E_Asset_BuildSet. Local files: Patch.index, ClientData.index, ClientDataEN.index, Client64.index all give signature 0x5041434b, version 1, 64 zero offsets, archive end equal to the file size (1368, 12474936, 2030312, 1448), block table at 0x260 / 0xbba020 / 0x1ef910 / 0x260 with 3 / 8680 / 18 / 3 blocks, 0x224 = 0, root block 2 = (0x240, 16), AIDX version 1, build 16042, root directory block 1."
grade = "sure"

["0x1401b7a40"]
statement = "Opens an archive file object: given a path, open flags (1 read, 2 write; neither is invalid), an optional completion port and an optional expected file record, it stores the path and flags, then loads an existing archive for read, or for write builds a new one (an expected record is refused then)."
proof = "0x1401b7a40 returns 0x80070057 when the path is null or (flags & 3) == 0; copies the path with 0x14018e9c0 to object 0x8, flags to 0x10, port to 0x18; flags bit 2 clear -> call 0x1401b7af0 (path, record); set -> 0x80004005 if a record is given, else call 0x1401b7d40. Called by 0x14018d720, which allocates the 0x2a0-byte object built by 0x1401b7900 (class table 0x140b5f170)."
grade = "fairly sure"
gap = "0x1401b7d40, the write-mode open, is unread past its call to the header check 0x1401ba550."
name = "PackFileOpen"

["0x1401b7af0"]
statement = "Loads an existing PACK archive for reading. It opens the file read-only (shared read), and when given an expected file record, verifies the file against it (size, write time, SHA-1). A file shorter than the 0x230-byte header is an empty archive when its size is 0 and corrupt otherwise. It reads the header, checks it, fails as corrupt when the file is shorter than the header's archive end, reads the block table (block count times 16 bytes at the header's table offset) and checks it. On any failure it closes the file, resets the header in memory to an empty archive (signature PACK, version 1, archive end 0x238, no blocks), and returns the error only when an expected record was given; otherwise it returns success with the empty archive."
proof = "0x1401b7b35/0x1401b7b5a CreateFileW(path, 0x80000000 GENERIC_READ, 1 FILE_SHARE_READ, 0, 3 OPEN_EXISTING, 0x10000000 or 0x50000000); 0x1401b7bbc GetFileSizeEx; 0x1401b7c6f call 0x1401ba2a0 (path record r14 = the second argument); 0x1401b7c83 cmp size, 0x230; 0x1401b7c8b neg/sbb/and 0xa0030001; 0x1401b7caa call 0x1401bc1a0(offset 0, object 0x38, 0x230); 0x1401b7cbc call 0x1401ba550; 0x1401b7cd0 cmp [rsi+0x240], size -> 0xa0030001; 0x1401b7ce3 resize the table to [rsi+0x258] entries; 0x1401b7cf5 shl r9, 4; 0x1401b7d16 call 0x1401bc1a0; 0x1401b7d28 call 0x1401ba600. Failure path 0x1401b7bdf: CloseHandle both handles, 0x1401b7c1b clear 0x230 bytes, 0x1401b7c29 mov dword [rsi+0x38], 0x5041434b, 0x1401b7c30 [rsi+0x3c] = 1, 0x1401b7c37 [rsi+0x240] = 0x238, table size 0; 0x1401b7c47 test r14, r14; cmovne ebp, edi (ebp = 0 from 0x1401b7b02)."
grade = "sure"
name = "PackFileLoad"

["0x1401ba550"]
statement = "Checks a PACK header: signature 0x5041434B and version 1; each of the 64 header offsets is 0 or a multiple of 16 at or after 0x240 with 24 bytes inside the archive end; with blocks, the block table offset obeys the same rule and the two block indexes (the one at 0x224 and the root at 0x228) are below the block count; with no blocks, the table offset and both indexes are 0. It returns 0, or 0xA0030001 (E_Asset_Corrupt) on any failure."
proof = "0x1401ba550 cmp dword [rcx+0x38], 0x5041434b; 0x1401ba559 cmp dword [rcx+0x3c], 1; 0x1401ba565..0x1401ba591 loop rdx < 0x40 over u64 at [rcx+0x40]: test al, 0xf; cmp rax, 0x240; add rax, 0x18; cmp rax, [rcx+0x240]; 0x1401ba593 mov edx, [rcx+0x258]; 0x1401ba59d [rcx+0x250] same checks; 0x1401ba5bd cmp [rcx+0x25c], edx; 0x1401ba5c5 cmp [rcx+0x260], edx; zero-count branch 0x1401ba5d3..0x1401ba5ed; 0x1401ba5cd mov eax, 0xa0030001. The code's name is from the table at 0x140a40920. Header object offset minus 0x38 is the file offset (read at 0x1401b7caa)."
grade = "sure"
name = "ValidatePackHeader"

["0x1401ba600"]
statement = "Checks a PACK block table: for each 16-byte entry (file offset, size), a nonzero size needs an offset that is a multiple of 16, at or after 0x240, with offset plus 24 and offset plus size inside the archive end; a zero size needs an offset below the block count. It returns 0, or 0xA0030001 (E_Asset_Corrupt)."
proof = "0x1401ba605 count [rcx+0x270]; 0x1401ba617 entries [rcx+0x268]; 0x1401ba620 size [rdx+0x8]; 0x1401ba629 offset [rdx]; 0x1401ba62c test r8b, 0xf; 0x1401ba632 cmp r8, 0x240; 0x1401ba642 lea rax, [r8+0x18]; cmp rax, end; 0x1401ba64b cmp size, end; 0x1401ba653 cmp offset, end - size; 0x1401ba663 size 0: cmp [rdx], count; jae fail; 0x1401ba66b add rdx, 0x10; 0x1401ba658 mov eax, 0xa0030001."
grade = "sure"
name = "ValidatePackBlockTable"

["0x1401ba2a0"]
statement = "Verifies an archive file against an expected file record (write time, size, SHA-1): with no record it returns 0; a size other than the record's gives 0xA0030003 (E_Asset_SizeMismatch); a last-write time more than 2 seconds from the record's gives 0xA0030007 (E_Asset_TimeMismatch); otherwise it hashes the whole file in pieces of up to 1 MiB with SHA-1, and a hash other than the record's 20 bytes gives 0xA0030002 (E_Asset_KeyMismatch)."
proof = "Ghidra decompile: null record -> 0; record u64 at 0x10 != size -> 0xa0030003; GetFileTime(handle, 0, 0, &lastWrite); |record u64 at 0 - lastWrite| > 20000000 (100 ns units) -> 0xa0030007; chunk min(size, 0x100000); state seeded 0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476, 0xc3d2e1f0 (SHA-1); 0x1401bc1a0 reads, 0x1401c8c20 updates, 0x1401c8f20 finishes; digest bytes taken big-endian from five words; memcmp(digest, record + 0x18, 0x14) != 0 -> 0xa0030002. Codes named by the table at 0x140a40920. Called only at 0x1401b7c6f."
grade = "fairly sure"
gap = "0x1401c8c20 and 0x1401c8f20 are taken as SHA-1 update and finish from the seed words and the 20-byte digest, not read; the record's bytes 0x8..0x10 are unread."
name = "VerifyFileAgainstRecord"

["0x1401bc1a0"]
statement = "Reads a given number of bytes at a given file offset of an archive file into a buffer, by synchronous reads, by overlapped reads when a second handle is open, or by copying from a memory image when no file is open. It returns 0, E_INVALIDARG for a null buffer, E_UNEXPECTED when a read returns no bytes, or the Windows error."
proof = "Ghidra decompile: null buffer -> 0x80070057; second handle (object 0x28) == -1 and file handle == -1 -> memcpy from the image object at 0x30 (slot 0x18) plus offset, or 0x80004005 when none; else SetFilePointerEx(offset) then ReadFile in pieces of at most 0x80000000, zero bytes read -> 0x8000ffff; second handle open -> CreateEventW, ReadFile with OVERLAPPED offset, GetOverlappedResult on ERROR_IO_PENDING (0x3e5)."
grade = "fairly sure"
gap = "Read from Ghidra's decompile, not instruction by instruction."
name = "PackFileReadAt"

["0x1401b8600"]
statement = "Reads part of a PACK block: given a block index, an offset in the block, a buffer and a length, it reads from the file at the block's file offset plus the offset. A length of 0 succeeds at once; block index 0, an index at or past the block count, a block of size 0, or a range past the block's size gives E_INVALIDARG."
proof = "0x1401b860c test r9 (length) -> return 0; 0x1401b8618 test edx (index) -> 0x80070057; 0x1401b8623 cmp rax, [rcx+0x270]; 0x1401b862c shl rax, 4; add [rcx+0x268]; 0x1401b8637 size [rax+0x8], zero -> fail; 0x1401b8643 cmp offset, size; 0x1401b864b cmp length, size - offset; 0x1401b8650 lea rdx, [r8+r11]; 0x1401b8657 call 0x1401bc1a0. Slot 0x58 of the PACK class table 0x140b5f170."
grade = "sure"
name = "PackReadBlock"

