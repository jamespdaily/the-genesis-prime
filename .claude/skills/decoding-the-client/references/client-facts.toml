gap = "The wire layout (the reader registered for 0x763), what 0x14001a1b0, 0x14001a070 and 0x140019b70 do with the list (read here as clear, add a group and add a text) and what the texts are for are not read; that the per-text entries are wide strings is read from the copy loop's 16-bit compare at 0x140015773."

