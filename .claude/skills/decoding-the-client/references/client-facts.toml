["0x14018b280"]
statement = "The client's general memory allocator, called from 3740 functions at 7859 sites: given a byte count and a flags word, it returns a pointer to at least that many bytes, taken under one process-wide recursive lock. A count of up to 256 bytes gets a pool slot of 2^ceil(log2(count)) bytes, at least 2, so 176 (NewConnectionCipher's cipher object) gets a 256-byte slot. A larger count gets a block of 2^ceil(log2(count + 16)) bytes, at least 512, with a 16-byte header before the pointer. Blocks up to 4 GiB come from a buddy heap carved out of 4 GiB reservations; larger ones get a reservation of their own; a count above 2^43 - 16 fails. Flag 1: a failure returns 0. Without it a failure reports and ends the process with exit code 1, so a caller that passes 0 never sees 0. Flag 2 zeroes the memory (the whole slot for a pool count). Flag 8 makes a reservation of its own without top-down placement. Flag 16 skips the report the client makes for a count of 1 GiB or more. Each flag is also read from a process-wide flags word, which start-up sets to 0. NewConnectionCipher passes 176 and flags 0."
proof = "Every instruction of 0x14018b280..0x14018b568 read in the query process's disassemble. Arguments: count in rcx (kept at [rsp+0x30], local_res8), flags 0x14018b294 mov esi, edx. 0x14018b296 call 0x14018aba0 with rcx and rdx unchanged; its decompile reports (0x140196f30 with 0x141d3a768) only when count & 0xffffffffc0000000 and not flags & 0x10. Lock: 0x14018b29b GetCurrentThreadId; owner 0x140c67400, depth 0x140c67408 (inc when already the owner, 0x14018b2c2 lock cmpxchg up to 0x400 spins with pause, then 0x14018b2e5 call 0x14019fb60); release at 0x14018b4d8/0x14018b458 zeroes owner and depth and, when the waiter count 0x140c67410 is nonzero, SetEvent on 0x140c67418 (made by CreateEventW once). Size class: 0x14018b2f8 cmp rdx, 0x100; ja 0x14018b37c; small: bit length of count - 1, cmovc to at least 1 (0x14018b30f, 0x14018b377); large 0x14018b37c lea rax, [rdx+0x10], dec, bit length, 0x14018b3e3 mov r8d, 0x9 and cmovc to at least 9. 0x14018b3f6 cmp rcx, 0x8; jbe 0x14018b40c call 0x14018b0c0 (class, &count); 0x14018b3fc cmp rcx, 0x2b; ja 0x14018b422 (fail); 0x14018b402 mov r8d, esi; 0x14018b405 call 0x14018ae80 (class, count, flags). Decompile of 0x14018b0c0: per-class free lists at 0x140c87f10 + 32 x class, a page of slots from 0x14018ac90 when empty, *count = 1 << class. Decompile of 0x14018ae80: class below 0x21: a block from 0x14018ac90 with its 16-byte header, more pages committed by VirtualAlloc when count + 16 is past a page, returns header + 0x10; class 0x21..0x2b: VirtualAlloc reserve of count rounded up to 4 GiB with 0x102000 (MEM_RESERVE | MEM_TOP_DOWN), or 0x2000 when (0x140c7f934 | flags) & 8, then commit. Decompile of 0x14018ac90: buddy split from class 0x20, a new VirtualAlloc(0, 0x100000000, MEM_RESERVE) when none is free. Failure 0x14018b422 mov eax, [0x140c7f934]; or eax, esi; test al, 0x1; jz 0x14018b563 call 0x14018a2b0 (decompile: reports via 0x140197490 with 0x141d3a638, then ExitProcess(1)); otherwise release and 0x14018b4b0 xor eax, eax