["0x140332580"]
statement = "The network object's send-by-id method: looks up the message's serialiser by id and sends the message on the given connection; an unknown id is logged as 'Message Id', 'Base Message Id' or 'Invalid or foreign Message Id' with its number. The message name table it would print from holds no names in this build. The client sends through it at 23 sites: 20 send message 0x244 (the wrapper every other message travels in), from SendWorldMessage, 0x1403f4740, 0x140016010, 0x1400161d0, StartCharacterSelect, StartRealmSelect, SendAuthLoginRequest, the two senders of 0x58f and ten other functions at eleven sites (see SerialiseMessageById); the network layer's own code sends ids 0 (ping), 1 (pong) and 2 (close notice) bare, which the network object registers for itself (RegisterNetworkMessages)."
proof = "Slot 0xf0 of the class table at 0x140b647b0 (entry 0x140b648a0); global object 0x140c65808. Decompiled: slot 0x130 looks up the id; connection by index in the array at object 0xa8 (count 0xb0); 0x140333fc0 queues the send; the profile zone 'H Network_SendMessageById'. Name table pointer 0x140c65828 = 0x140c1f210 (set in 0x14006c290 and 0x1400a8190), 0xd2f entries of 16 bytes; bytes read over all 0xd2f entries: only 214 nonzero 8-byte words, all in the first word of an entry (size limits such as 0x7d000), every name word zero. Sites: every call [reg+0xf0] in .text whose object is the network object (the table loaded from it, it loaded from 0x140c65808), by the scratch walk of SendWorldMessage's record: 20 sites, each with mov r8d, 0x244 (580) before it, for example 0x1403f4aa7 mov r8d, 0x244; 0x1403f4aad call [rax+0xf0]. Inside the network object's own methods (the object is their first argument): 0x140331588 mov r8d, 0x2; 0x14033158e call [rax+0xf0] in 0x140331550 (slot 0x80 of 0x140b647b0); 0x140332164 mov r8d, 0x1; 0x14033216d call [rax+0xf0] in ReadMessageFrame 0x140331990 (with one byte from the received frame); 0x140332eb9 xor r8d, r8d; 0x140332ebf call [rax+0xf0] in 0x140332dd0, which runs when 500 ms have passed (0x140332de7 cmp eax, 0x1f4). The 1,132 RegisterMessage calls in 0x14006c290 and 0x1400a8190 hold no id below 3; the network object's constructor 0x1403300b0 registers 0, 1 and 2 through 0x140333850 (0x1403301ac call 0x140333850)."
grade = "fairly sure"
gap = "The connection's send path 0x140333fc0 (QueueMessageSend) is read only from Ghidra's decompile. Slot calls on objects the walk could not trace (255 sites of slot 0x108 or 0xf0) are taken to be other classes: none passes an id the client registers, and none of their callers passes the network object, but a copy of the network object kept elsewhere would be missed."
name = "NetworkSendMessageById"

