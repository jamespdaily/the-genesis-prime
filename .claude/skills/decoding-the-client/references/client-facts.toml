["0x140336380"]
statement = "Writes an unsigned value of 1 to 64 bits into a bit stream at the current bit position, least significant bit first, so a byte-aligned 16-, 32- or 64-bit value lands as little-endian bytes and a field may start and end anywhere in a byte. Only the value's low bits for the width are written; the bits of the last byte above the value are cleared, so a frame's padding to a whole byte is zero bits. A stream without room for it grows first, or the write fails with 0x80004005. A signed value is written as its two's-complement low bits."
proof = "Decompiled: room = (chunk end - write pointer) * 8 - bit offset, else 0x140336470; by (width + 7) >> 3: 0x1403367d0 (1 byte), 0x140336860 (2), 0x1403368f0 (3 or 4), 0x1400a7540 (5 to 8); each keeps the bits below the offset in its word, ors in (value masked to the width) << offset and spills into one more byte; byte pointer += (offset + width) >> 3, offset = (offset + width) & 7. The inline copies in the message writers mask the same way (0x1400a8e10: a 5-bit field as value & 0x1f) and pass narrow signed fields to 0x140336470 sign-extended, where they are masked byte by byte. Run on Ghidra's p-code emulator: vector.0x140336380.fields."
grade = "sure"
name = "WriteBits"

