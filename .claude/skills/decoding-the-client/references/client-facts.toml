["CharacterCustomization.flags"]
statement = "How a character's customisation labels and values become its body item visuals. For the character's race and sex (and faction for faction-only labels), each slot collects the indexed CharacterCustomization rows (flags 2) that apply: the label-free rows (the defaults) and every row whose labels, each with a value other than 0, all have that value in the character's look (a label with value 0 in the row does not constrain it). Each slot then shows one row's itemDisplayId: the row with the most label and non-zero value pairs, so a two-label row beats a one-label row, which beats the default; between rows with as many pairs, the earliest record wins; a slot whose rows were all removed shows display 0. The slots dressed are 24 BodySkin, 25 BodyFace, 26 BodyEye, 27 BodyEar, 28 BodyHair, 29 BodyTatoo, 39 BodyFacialHair and 70, plus item slots 1 to 6 from label-free rows. In the data each race, sex and slot has at most one label-free row, and in 9 of the 89 race, sex and slot groups two rows with as many pairs and different displays can both match one look (for race 1, sex 0, slot 25: row 2, labels 2=1 and 22=1, display 135, against row 10, labels 2=1 and 21=2, display 137), where the earlier record decides. The server can build 0x117's body item visuals, and 0x262's, from the labels and values a create request (0x25b) carries in this way."
proof = "The index: BuildCustomizationIndex 0x14001d450. The look: ResetLook 0x140030e30, SetLookLabel 0x1400310b0 (the add check counts a row position only when label and value are both non-zero), PickCustomizationDisplays 0x140031c90 (the winner), ApplyCustomizationToModel 0x14002f5d0 (the hand-off to the model). Emulator: vector.0x140031c90. CharacterCustomization.tbl read with a scratch reader (8018 records in ascending ID order; groups of flags-2 rows by raceId, gender, itemSlotId; pairs of rows with equal counts of non-zero label-value pairs, no label at two values, and different itemDisplayId)."
grade = "fairly sure"
gap = "That the earliest record wins a tie rests on the slot sets being ordered by row address (0x140007810 compares the row pointers) and on the loaded rows lying in record order, which the table loader's row storage would show and is not read. A retail 0x117 recording beside its create request for one of the 9 tie groups would also settle it."

