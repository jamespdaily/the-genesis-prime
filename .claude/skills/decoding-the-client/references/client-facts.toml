["opcode.0x591"]
statement = "Message 0x591 (1425), auth server to client: login accepted. Body: one 32-bit value, of which the client keeps only bit 0: whether the account's last session was disconnected for lag. CharacterScreenLib.WasDisconnectedForLag returns it, and while it is set character select shows the text CharacterSelect_LagDisconnectExplain in red in place of the server's messages; 0 is the plain login. The other 31 bits are dropped. On it the client also keeps the account name it logged in with as the name of its settings file (Account.<name>.ini) and waits for the hand-off (0x3db). The client has no writer for it."
proof = "Registered at 0x140078555 mov edx, 0x591; 0x14007854e lea r8d, [r9+0x4] (record size 4); 0x140078549 mov qword ptr [rsp+0x28], rcx with 0x140078537 lea rcx, [0x14007ab50] (reader); 0x14007855a mov qword ptr [rsp+0x20], 0x0 (no writer). Reader 0x14007ab50: 0x14006c090 width 0x20 into record 0. Handler in HandleLoginMessage: 0x140037175 mov rdx, qword ptr [rbx+0xb0] (the login's account name); 0x140037183 call 0x1400114e0 (keeps it at game 0x1670 and names L'Account.%s.ini'); 0x140037188 mov ecx, dword ptr [rdi]; 0x140037191 and ecx, 0x1; 0x140037194 mov dword ptr [rax+0x166c], ecx; 0x14003719a state 9. Game 0x166c is read only by WasDisconnectedForLag 0x140027ff0 (0x140027ffd cmp dword ptr [rax+0x166c], edx): a scan of llvm-objdump's .text listing for every operand [reg+0x166c] finds three, the other two being this write and 0x140454ba1 in another class's constructor 0x140454380, and [reg+0x156c] (the game's second base, game 0x100) finds only 0x140422032 in the object built by 0x1404218a0; the game constructor zeroes it (0x14000a637 mov qword ptr [rbx+0x1668], rsi, rsi 0 from 0x14000a4a7 xor esi, esi). UI/PreGame/Character/Character.lua lines 4465-4470 (Character:HelperServerMessages: WasDisconnectedForLag() picks the colour 'Reddish' and Apollo.GetString('CharacterSelect_LagDisconnectExplain')). Extracted copy in ui-extract. Emulator: vector.opcode.0x591.body."
grade = "fairly sure"
gap = "The scan finds reads at a fixed displacement from a register; a read of the game object through a computed address or a copy would be missed. Whether the retail auth server ever set the bit, and for which sessions, is not in the client."

