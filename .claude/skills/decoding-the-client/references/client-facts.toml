["0x14003db40"]
statement = "Loads a pre-game screen's interface from two lists of names it is given: the strata and the addons. The addons are Carbine addons from the archive (StartPreGameInterface). The login screen gives strata Top and Login and addons Login and Credits; realm select gives Realm, DefaultStratum and RealmSelect; character select gives AccountServices, Navigation, DefaultStratum, TempBlocker and Character, CharacterSelection, AccountServices, Credits, MicroStore. It also registers the console commands pregamereloadui and pregameGetLuaErrors."
proof = "0x14003db6d call 0x14000b690 with edx 3; 0x14003dbb4 the first list (r12, count r15) copied into rsi+0x78 by 0x14003dc21 call 0x140019b70; 0x14003dc70 the second list copied into 0x68 by 0x14003dce6; 0x14003dd81 call 0x140040310; 0x14003ddaa lea rdx, L'pregamereloadui' (0x1409f7428); 0x14003ddc0 lea rdx, L'pregameGetLuaErrors' (0x1409f74d8); both through 0x140198d60. Callers: StartCharacterSelect (0x140020cbb), 0x140036bf0 (0x140036cd4, after lea of L'Top' 0x1409f5668, L'Login' 0x1409f5680, L'Login' 0x1409f5670, L'Credits' 0x1409f56a8) and StartRealmSelect (0x1400458c0). The realm-select and character-select names are those the StartRealmSelect and StartCharacterSelect records give."
grade = "fairly sure"
gap = "Which list is the strata and which the addons is read from StartPreGameInterface's use of the 0x68 list as addon names; how the login screen's two lists are split is read from the order of the lea instructions only."
name = "LoadPreGameInterface"

["0x140040310"]
statement = "Builds a pre-game screen's interface: registers the pre-game Lua library (PreGameLib), adds the Carbine addon Util, then adds each named addon from the archive folder PreGame (ui\\PreGame\\<name>\\toc.xml) as a Carbine addon. No user addon is added, so an addon from the user's Addons folder never runs at the login, realm-select or character-select screens."
proof = "0x1400403b4 call 0x14003e5b0 (PreGameLib's registration, see PreGameLib.CodeEnumCharacterModifyResults); 0x140040441 lea rcx, L'Util' (0x1409f7d10); 0x140040450 mov byte [rsp+0x28], 1 (Carbine); 0x140040464 call 0x1401352f0; loop 0x140040510..0x14004054a over the 0x68 list: 0x140040521 lea rdx, L'PreGame' (0x1409f7d50); 0x14004052f mov r9b, 1 (Carbine); 0x14004053f call 0x1401395d0. AddAddon passes r9b as the Carbine flag (0x1401395f1, 0x140139638), and LoadAddonToc reads a Carbine addon from ui\\<folder>\\<name>."
