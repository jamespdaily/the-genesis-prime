# The client's archive indexes
["archive_index.header"]
statement = "An archive index file (Patch, ClientData, ClientDataEN, Client64 .index) is a PACK container holding an AIDX block. Every number is little-endian. PACK header, 0x230 bytes at file offset 0: 0x000 u32 signature 0x5041434B (the bytes 'KCAP'); 0x004 u32 version, must be 1; 0x008 64 u64 file offsets, each 0 or a multiple of 16 at or after 0x240 with 24 bytes inside the archive end (their use is unread); 0x208 u64 archive end, which the file's real size must not be below; 0x210 u64, not read when opening; 0x218 u64 file offset of the block table; 0x220 u32 block count; 0x224 u32, below the block count when there are blocks; 0x228 u32 root block index, below the block count; 0x22c u32, not read when opening. With no blocks, 0x218, 0x224 and 0x228 must all be 0. The block table is block-count entries of 16 bytes: u64 file offset, u64 size. An entry with a nonzero size must start at a multiple of 16, at or after 0x240, with offset plus 24 and offset plus size inside the archive end; an entry with size 0 holds a block index below the count in its offset. Block index 0 is never readable. The root block (index from 0x228) begins with the AIDX header, 16 bytes: u32 signature 0x41494458 (the bytes 'XDIA'), u32 version, must be 1, u32 the index's build, u32 the block index of the root directory. The client reads the build into the index object but never compares it with its own build; a nonzero build only forbids adding files to the index."
proof = "PACK header: 0x1401b7c9b..0x1401b7caa reads 0x230 bytes from file offset 0 into the object at 0x38; 0x1401ba550 cmp dword [rcx+0x38], 0x5041434b; 0x1401ba559 cmp dword [rcx+0x3c], 1; loop 0x1401ba565..0x1401ba591 over 0x40 u64 at object 0x40 (file 0x008) with test al, 0xf / cmp 0x240 / add 0x18 / cmp [rcx+0x240] (file 0x208); 0x1401b7cd0 cmp [rsi+0x240], file size from GetFileSizeEx; 0x1401ba593 count at object 0x258 (file 0x220); table offset object 0x250 (file 0x218); object 0x25c (file 0x224) and 0x260 (file 0x228) below the count (0x1401ba5bd, 0x1401ba5c5). Table: 0x1401b7cf5 mov r9d, [rsi+0x258]; shl r9, 4; 0x1401b7d0c rdx = [rsi+0x250]; 0x1401b7d16 call 0x1401bc1a0; checks in 0x1401ba600. Root block: 0x1401b8870 returns object 0x260 (file 0x228); 0x1401b8600 refuses index 0, index >= count, size 0, or a range past the size. AIDX: 0x1401bf632 call [rax+0x78] (root index), 0x1401bf64c length 0x10, 0x1401bf655 call [rax+0x58] offset 0, 0x1401bf65c cmp dword [rbx+0x38], 0x41494458, 0x1401bf665 cmp dword [rbx+0x3c], 1; build at AIDX offset 8 (0x1401bf850 writes 4 bytes at block offset 8 and stores them at object 0x40, which 0x1401bf830 returns); 0x1401bf69f the fourth u32 (object 0x44) becomes the directory node's block, loaded by 0x1401bcea0. Build use: the only compare of 0x3eaa in the client is 0x140037bae (the auth server's version); object 0x40 is compared only with 0 (0x1401bf8f5, 0x1401c0050) giving 0xa0030004 E_Asset_BuildSet. Local files: Patch.index, ClientData.index, ClientDataEN.index, Client64.index all give signature 0x5041434b, version 1, 64 zero offsets, archive end equal to the file size (1368, 12474936, 2030312, 1448), block table at 0x260 / 0xbba020 / 0x1ef910 / 0x260 with 3 / 8680 / 18 / 3 blocks, 0x224 = 0, root block 2 = (0x240, 16), AIDX version 1, build 16042, root directory block 1."
grade = "sure"

