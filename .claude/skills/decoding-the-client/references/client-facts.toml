name = "PackFileReset"

["0x1401bf610"]
statement = "Loads an archive index opened for reading: gets the PACK's root block index, reads the 16-byte AIDX header from the start of that block (signature 0x41494458, version, build, root directory block), and when the read fails or the signature is not AIDX or the version is not 1, it silently uses an empty index (build 0, no root directory). It then loads the root directory from the block the header names, and returns success in every case."
proof = "0x1401bf632 call [rax+0x78] (0x1401b8870) into object 0x34; 0x1401bf64c [rsp+0x20] = 0x10; 0x1401bf649 offset 0; 0x1401bf655 call [rax+0x58] (0x1401b8600) into object 0x38; 0x1401bf65c cmp dword [rbx+0x38], 0x41494458; 0x1401bf665 cmp dword [rbx+0x3c], 1; failure 0x1401bf66b: zero 16 bytes, signature AIDX, version 1, root block 0; 0x1401bf68b allocate 0x38 bytes, 0x1401bf69f its first u32 = the header's fourth u32 (object 0x44); 0x1401bf6cb call 0x1401bcea0; 0x1401bf6d5 xor eax, eax. Called by 0x14018d7d0 at 0x14018d916 when the index's flags lack bit 2."
grade = "sure"
name = "LoadArchiveIndex"

["0x1401bf6e0"]
statement = "Loads an archive index opened for writing: reads the AIDX header as the read-only load does; when it is missing or bad, it starts an empty index and writes a new 16-byte AIDX header block (build 0) and makes it the PACK's root block."
