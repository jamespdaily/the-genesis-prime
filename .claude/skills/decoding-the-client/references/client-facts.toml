grade = "fairly sure"
gap = "That the server gives a new character this experience is inferred from the column's name and the client's level gate; the client never sends or receives the value. The offered rows are kept in a list (0x1400293c0) whose other readers are not read. The setting that lifts the limit (word 0x1648 of the object at 0x140c635f0) is not read."

["0x140029820"]
statement = "GetLevelForExperience: returns the level for an amount of experience. The highest level is GameFormula row 145's dataint0 (50 in the data; 1 without the row). It takes XpPerLevel records by position, from record 0 to the record at the highest level; an amount below record 0's minXpForLevel or above that last record's gives -3 (-1 or -2 when a record is missing). Otherwise it finds by halving the last record, from 0 to one below the highest level, whose minXpForLevel is at most the amount, and returns that record's ID. Comparisons are signed. With the data (IDs 1 to 201 in order, record 50 at 2147483647) the level is the highest ID from 1 to 50 whose minXpForLevel is at most the experience: 0 to 654 is 1, 655 is 2, 1710 is 3, 26360090 and above is 50."
proof = "0x140029834 mov ecx, 0x91; 0x14002983e call 0x140200220 (GameFormula by id: 0x14020023d lea rcx, [0x140a6a408] 'GameFormula', 0x140200277 jmp qword ptr [rax+0x18]); 0x140029848 mov edi, dword ptr [rax+0x4] (dataint0, the column after ID); 0x14002984d mov edi, 0x1; 0x140029854 call 0x14024e020 with 0 and 0x14002985e with the highest (XpPerLevel by record number: 0x14024e03d lea rcx, [0x140a6e420], which names 'XpPerLevel' 0x140ae2af0; 0x14024e077 jmp qword ptr [rax+0x20]); 0x14002986d cmp ebp, dword ptr [rbx+0x4]; 0x140029870 jl 0x1400298bc; 0x140029872 cmp ebp, dword ptr [rax+0x4]; 0x140029875 jg 0x1400298bc; 0x1400298bc mov eax, 0xfffffffd; 0x140029880 lea ebx, [rdi+rsi]; 0x140029883 shr ebx; 0x140029891 cmp ebp, dword ptr [rax+0x4]; 0x140029894 jl 0x14002989a; 0x1400298a0 cmp eax, 0x1; 0x1400298a3 ja 0x140029880; 0x1400298b1 mov eax, dword ptr [rax] (the record's ID); 0x1400298b5 mov eax, 0xfffffffe; 0x1400298c3 or eax, -0x1. Game table class slots (bytes at 0x140b798c0): 0x18 by id 0x1407c10d0 (0x1407c1112 mov edx, dword ptr [rax+4*rdi] through the lookup), 0x20 by record number 0x1407c11b0 (0x1407c11e8 cmp edi, dword ptr [r8+0x30]; 0x1407c11fa imul eax, edi), 0x28 the count 0x1407c1210 (0x1407c123b mov eax, dword ptr [rax+0x30]). XpPerLevel.tbl: 201 records, ID = position + 1, minXpForLevel 0, 655, 1710, ..., 26360090 (ID 50), 2147483647 from ID 51 on. GameFormula.tbl row 145: dataint0 50. Callers: 0x140021d40 (0x140021ee1) and 0x1403c6d80 (0x1403c6d9f)."
grade = "fairly sure"
gap = "That the table objects reached through 0x14024e020 (0x140c63988) and 0x140200220 (0x140c64c58) are of the game table class at 0x140b798c0 is inferred from the table names and shared loaders, not read; reading the loader 0x14024dd60 would settle it. The example levels are worked by hand from the rows, not emulated."
name = "GetLevelForExperience"

["XpPerLevel.minXpForLevel"]
statement = "The least experience of the level that is the record's ID. The client's level for an amount of experience is the highest ID, from 1 to GameFormula 145's dataint0 (50), whose minXpForLevel is at most it (GetLevelForExperience); the client takes the records by position, not by ID, and in the data the two agree (ID = position + 1). IDs 51 to 201 hold 2147483647, so the level stops at 50."
proof = "GetLevelForExperience 0x140029820: 0x140029891 cmp ebp, dword ptr [rax+0x4] (minXpForLevel, the column after ID in XpPerLevel.tbl: ID, minXpForLevel, baseQuestXpPerLevel, abilityPointsPerLevel, attributePointsPerLevel, baseRepRewardPerLevel); 0x1400298b1 mov eax, dword ptr [rax] (ID). XpPerLevel.tbl rows read."
grade = "fairly sure"
gap = "As in GetLevelForExperience (0x140029820): the table object's class is inferred."

["0x140021d40"]
statement = "BuildCharacterCreationChoices: rebuilds the list of CharacterCreation rows offered for a new character. For each row in record order it keeps the row only when its id is in the set of offered ids (built from the enabled column and the 0x117 lists when empty); then a row that needs an entitlement is kept when the account holds that entitlement with a nonzero count; a row with an account-currency cost is kept; any other row is kept only when GetLevelForExperience of its xp is at most the account's highest character level (message 0x36; taken as at least 1), unless a client setting lifts that limit. Message 0x36 runs it after storing the level."
