["0x1400b3bb0"]
statement = "Handles the NC platform's notice that the account was logged out of the platform (PresenceUserLogout, with a reason): logs 'PresenceUserLogout [<name>:<name>] Reason [<reason>]' and queues NC platform event 24 with the reason. HandleNcPlatformEvent then, unless the login has already passed to character select, ends the login with: reason 0 'Your account has been kicked', 1 'Your account has been banned', 2 'Another client has tried to log in with this account', 3 'The credentials for this account have been changed', any other 'An unknown error was encountered.' Once the client is in character select or the world it ignores the event."
proof = "0x1400b3c46 call 0x1401a3130 (Log) with the descriptor 0x141d0e070, whose text 0x140a13a30 reads 'PresenceUserLogout [%S:%S] Reason [%d]'; 0x1400b3c55 mov edx, 0x18 / 0x1400b3c5a call 0x1400b2550 (queues the event, the reason as its value). HandleNcPlatformEvent 0x140037220: 0x140037226 mov eax, dword ptr [rcx+0xa8] / 0x14003722f cmp eax, 0xb (login passed on: ignored); 0x140037242 cmp r8d, 0x18; 0x14003724c mov edx, dword ptr [rdx+0x28] (the reason); 0x14003727e mov ecx, 0x62f75 (reason 2) / 0x14003728b call 0x1400383a0; 0x140037264 mov ecx, 0x62f76 (reason 3). Texts 405362, 405363, 405365, 405366 and 196357 in en-US.bin. The library's class names include IPresenceUserLogout (StsConnLib64.MT.dll strings)."
grade = "fairly sure"
gap = "The handler is reached through a notify object (0x140b560b0) whose registration with StsConnLib is not read, and which STS message carries the notice and its reason is not read in the library. Whether retail sent it to the first client when a second logged in is not shown by the client."
name = "HandlePresenceUserLogout"

["lua.CharacterSelection.OnRemoveCountdown"]
statement = "Character select's handling of a character of the account still in the world, which message 0x117 names (its realm and character id, with the time until it is removed, in milliseconds): while that time is above 0 every other listed character, the create entries and the delete button are blocked and that one character is selected and left playable; a half-second timer counts down showing 'Logging Off <name>' and 'Other characters available in <seconds> seconds.', and at 0 unblocks the list. The client's text for 0x162 result 4 FailedCharacterInWorld, 'Your account has another character still in the world. Please try again in a minute.', names the refusal of playing another character meanwhile, and its create, delete and rename results 44, 42 and 43 (the *_CharacterOnline values) name the same case. So the client is built for a second login that is accepted into character select while the first session's character lingers in the world."
proof = "UI/PreGame/CharacterSelection/CharacterSelect.lua in ClientData.archive: line 79 ApolloTimer.Create(0.5, true, 'OnRemoveCountdown'); lines 188, 268-272 (DisabledBlocker on every character but nCharacterIndex, which is force-selected), 311-313 (timer started), 324, 366, 383, 406 (create entries blocked), 540-565 (the countdown, nCharacterRemoveTime - 500 per tick, / 1000 for seconds); texts CharacterSelect_LogOffName 615937 'Logging Off $1n', CharacterSelect_LogOffMessage 615894, CharacterSelect_SelectErrorFailedCharacterInWorld 570352 (LocalizedEnum.tbl, en-US.bin). HandleMessage0117 0x140021540 (decompiled): the realm and character id kept, the remove time plus the clock base kept, and nCharacterRemoveTime (the raw 32-bit value) and nCharacterIndex (the matching character's place from 1) put in the CharacterList event's third table only when the realm, the id and the time are non-zero and a listed character has the id."
grade = "fairly sure"
gap = "The Lua is read from the archive with a scratch extractor. What retail did to the first session when the second logged in (disconnect it with 0x36a, and with which reason, or let it play on) is not in the client; a retail recording of a double login would settle it."
