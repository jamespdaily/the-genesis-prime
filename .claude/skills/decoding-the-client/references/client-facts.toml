["0x1401b4560"]
statement = "Mounts the client's archives under the game folder: opens Patch\\CoreData.archive when present (a failure is logged as 'Failed to open Core Archive'); opens Patch\\Patch.index with no expected record (missing: 'File not found' and 0x80070490); optionally Bootstrap\\Bootstrap.index; then, for each data set the flags select (bit 0 ClientDataEN, 1 ClientDataFR, 2 ClientDataDE, 3 ClientDataZH, 4 ClientData, 5 ServerData, 6 ToolsData, 7 SupportData under Patch, bit 8 LauncherData under Bootstrap), it looks up '<name>.index' in the Patch (or Bootstrap) index to get its expected file record, opens '<folder>\\<name>.index' checked against that record, and opens '<folder>\\<name>.archive'; each index joins the file system's index list and each archive its archive list. A data set whose index is missing is skipped when its parent index is not open, else logged 'File not found' and 0x80070490. Any error stops the mount and is returned."
