["opcode.0x244"]
statement = "Message 0x244 (580), client to server: the encrypted wrapper that every message the client sends travels in. Its body is one whole inner frame: the inner 32-bit length (counting its own 4 bytes, little-endian, in the clear), then the inner 16-bit id and body, encrypted with the connection's cipher (EncryptMessageBody over the inner length minus 4 bytes). On the wire: 32-bit length (6 + the inner length), 16-bit id 0x244, the inner frame. The inner message is 0x38c on the world connection (SendWorldMessage) and the message itself during login and character select (0x592, 0x58f, 0x7e0, 0x7a4). The client has no reader for 0x244, so it never accepts one."
proof = "Registered first in 0x14006c290: 0x14006c2d2 mov edx, 0x244; 0x14006c2d7 mov r8d, 0x8 (the record is one pointer); 0x14006c2cb lea r9, [0x140079ef0] (sizer); writer 0x140079f30 at 0x14006c2c6 mov [rsp+0x20], rcx; 0x14006c2bd mov qword ptr [rsp+0x28], 0x0 (no reader); 0x14006c2b5 mov dword ptr [rsp+0x30], 0x0 (mode 0); 0x14006c2ea call [rax] (RegisterMessage). Every sender serialises the inner frame (SerialiseMessageById), calls the cipher's encrypt slot with the frame + 4 and its size - 4 and sends 0x244 with a pointer to it: e.g. 0x1403f4a7b in SendWorldMessage and 0x14003a8ec in SendAuthLoginRequest; the 0x244 sends are at 0x1403f4aa7, 0x14003a91d, 0x140038261, 0x140020d88, 0x140045874, 0x140046488 and 15 more sites, all mov r8d, 0x244 before call [rax+0xf0]."
grade = "fairly sure"
gap = "The writer 0x140079f30 and the encrypt call's arguments at each sender are read from Ghidra's decompile; a recording of the real client's first 0x244 would confirm the bytes."

["opcode.0x38c"]
statement = "Message 0x38c (908), client to world server: carries one world message. Body: a 5-bit value (3 from SendWorldMessage, 0xb from its twin 0x1403f4740), zero bits to the next byte, then the world message's whole frame (its 32-bit length, 16-bit id and body). It is sent inside message 0x244, so on the wire after 0x244's header come 0x38c's 32-bit length in the clear and then, encrypted, 0x38c's id, the value's byte and the world message's frame. The client has no reader for 0x38c."
proof = "Registered at 0x14006d55c mov edx, 0x38c; 0x14006d561 mov r8d, 0x10 (record: a 32-bit value, then a pointer at 8); 0x14006d547 lea r9, [0x14007e180] (sizer); 0x14006d538 lea rcx, [0x14007e1c0] (writer, stored at 0x14006d557 mov [rsp+0x20], rcx); 0x14006d54e mov qword ptr [rsp+0x28], 0x0 (no reader); 0x14006d53f mov dword ptr [rsp+0x30], 0x0 (mode 0). SendWorldMessage's record: 0x1403f4a10 mov dword ptr [rbp-0x50], 0x3 and the serialised world frame's data pointer at 8 (decompiled)."
grade = "fairly sure"
gap = "What the values 3 and 0xb select is not read; the record's pointer at 8 is read from SendWorldMessage's decompile."

