# Message layouts: each body field by field, in wire order, from the routines RegisterMessage keeps

["opcode.0x592"]
statement = "Message 0x592 (1426), client to auth server: the login request, sent once (SendAuthLoginRequest). Body, in order: the build (32 bits, 16042); a 64-bit value folded from the client's file digests; the account name as a counted wide text (16-bit count of characters plus one, then the characters and a terminating zero, 16 bits each; at most 250 characters); two GUIDs (each 32 + 16 + 16 bits and 8 raw bytes): the STS login's UserId and its game token, each parsed from its text; four 32-bit values (the client's own IPv4 address on the STS connection, a value of the text table, a client setting, a global value); the machine's description: the processor's manufacturer, name and description (three wide texts), its family, level, revision, clock speed and core count (five 32-bit values), the installed memory in MiB (32 bits), the video adapter's description (wide text), the adapter's vendor id, device id, subsystem id and revision and its memory in MiB (five 32-bit values), the processor architecture code, the Windows version, the service pack and an OS flags word (four 32-bit values); and the realm data center id (32 bits). The client has no reader for it."
proof = "Registered at 0x14006d4ee mov edx, 0x592; 0x14006d4f6 mov r8d, 0x2a8 (record size); sizer 0x14006d4d9 lea r9, [0x14007dcd0]; writer 0x14006d4ca lea rcx, [0x14007dd40] stored at 0x14006d4e9; 0x14006d4e0 mov qword ptr [rsp+0x28], 0x0 (no reader); mode 0. Writer 0x14007dd40 (decompiled): 0x20 bits record 0; 0x40 bits record 8; 0x1400c2f70 (record 0x10, at most 0xfb units); 0x1400a8780 at 0x208 and 0x218; 0x1400a7110 width 0x20 at 0x228, 0x22c, 0x230, 0x234; 0x14007dc80 at 0x238 (0x14007d9c0: 0x140336040 three times, five 0x20-bit words; 0x14007d010: one 0x20-bit word; 0x14007da70: 0x140336040 and five 0x20-bit words; 0x14007d4a0: four 0x20-bit words); 0x20 bits at 0x2a0. Sizer 0x14007dcd0 with 0x14007dc10 and 0x14007d8f0 counts the same bits. Sources (SendAuthLoginRequest 0x14003a620, decompiled): record 0 = 0x3eaa; record 8 = game 0x1628, which FUN 0x140012780 folds from 0x718da9074f2deb91 by (h + byte) * 0xaa7f8ea9 over the 20-byte digests (0x1401b71d0) of the client's own file and of Patch.index; the name from the login object's 0xb0, copied into the record's 0xfb-unit field; GUIDs from UuidFromStringA on 0x140c671c0 and 0x140c67200; 0x228 = 0x140335360 of 0x140c66ff0, 0x22c = the dword at 8 of the text table 0x140c7aac0, 0x230 = game 0x1708, 0x234 = 0x140c67244; the machine block = game 0x15c..0x1594, filled by 0x140193f10 (decompiled): WMI Win32_Processor Manufacturer, Name, Description, Family, Level, Revision, CurrentClockSpeed or MaxClockSpeed, NumberOfCores (the processor count when 0); GlobalMemoryStatusEx total physical >> 20; IDirect3D9 adapter identifier 0 Description, VendorId, DeviceId, SubSysId, Revision; WMI Win32_VideoController AdapterRAM >> 20 matched by description; the architecture code (1 x86, 2 x64, 3 IA64, 4 ARM) | 0x10000; GetVersionExW major << 16 | minor; service pack major << 16 | minor; suite and product type << 8 with GetSystemMetrics 0x56..0x59 in bits 0..3; 0x2a0 = the RealmDataCenter row's ID. The bytes are in vector.opcode.0x