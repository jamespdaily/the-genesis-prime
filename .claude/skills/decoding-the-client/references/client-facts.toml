["opcode.0x82d"]
statement = "Message 0x82d (2093), client to game server: the store-catalog request. Body: one 14-bit value, the low 14 bits of the text table's 32-bit value (the same value message 0x592 carries). It is never sent bare: the client wraps it in message 0x38c with the value 0x13 and sends that inside 0x244, so the 0x38c frame is 15 bytes: its 32-bit length 15, id 0x38c, the byte 0x13, then the 0x82d frame 08 00 00 00 2d 08 and two bytes holding the value. On a new game connection it follows 0x58f and 0x7e0 at once (RequestStoreCatalogAfterLogin); the Lua RequestCatalog sends it again. Until the store gets an answer, IsStoreReady answers false; character select does not wait on it. The client has no reader for it."
proof = "Registered at 0x140078189 mov edx, 0x82d; 0x140078191 mov r8d, 0x4 (record size); 0x140078174 lea r9, [0x14007a600] (sizer: 0x14007a600 add qword ptr [rdx], 0xe, 14 bits); 0x140078165 lea rcx, [0x14007a610] stored at 0x140078184 (writer); 0x14007817b mov qword ptr [rsp+0x28], 0x0 (no reader); 0x14007816c mov dword ptr [rsp+0x30], 0x0 (mode 0). Writer: 0x14007a614 mov r10d, dword ptr [rdx] (the record's value); 0x14007a655 and eax, 0x3fff; 0x14007a68b add rax, 0xe (14 bits on); the slow path 0x14007a6ac mov r8d, 0xe; 0x14007a6b5 jmp 0x140336470 (WriteBits). Wrapper: SendGameMessageKind13 0x1400162d7 mov dword ptr [rbp-0x50], 0x13 and the 0x38c layout in opcode.0x38c's record. Senders: 0x14044dbbc and 0x1404eae47, both call 0x1400161d0 with edx 0x82d."
grade = "fairly sure"
gap = "What the text table's value is (likely the client's language) is not read; which server message makes the store ready again (sets the flag IsStoreReady reads) is not read. The 15-byte 0x38c layout rests on opcode.0x38c's record, which is fairly sure."

["opcode.0x241"]
statement = "Message 0x241 (577), client to game server during realm select and character select: an activity signal with an empty body, so the frame is 06 00 00 00 41 02, sent inside 0x244 like every message. The client sends it on its realm-select or character-select connection once 60 seconds of time on those screens have passed since the last one (the first counts from the client's start), but only while the player has used the keyboard or mouse in the last 60 seconds: a key press, a left, right or middle button press, or a mouse move of more than 3 pixels on both axes. A player who leaves the screens alone sends none. The 60 seconds is GameFormula row 525's dataint0 (60000 ms in the data; 60000 when the row is missing). The client waits for no answer and has no reader for 0x241."
proof = "Registered at 0x1400788a6 mov edx, 0x241; 0x1400788ab mov r8d, 0x1 (record size); 0x140078891 lea r9, [0x140001b70] (sizer, no bits); 0x140078882 lea rcx, [0x140001ba0] stored at 0x1400788a1 (writer, writes nothing); 0x140078898 mov qword ptr [rsp+0x28], 0x0 (no reader). Sender SendPreGameActivity 0x140047e50 (its record): 0x140047f1d mov r8d, 0x241; 0x140047f9f mov r8d, 0x244. Callers: the character-select update 0x140020dc0 (0x140020de5, with the connection the stage keeps) and the realm-select update (0x14004594f in 0x1400458f0, slot 0x30 of the realm-select class table at 0x140b55940: entry 0x140b55970; with the realm-select connection). GameFormula.tbl row 525: dataint0 60000 (the record's first word after ID)."
grade = "fairly sure"
gap = "That the updates' elapsed-time argument is in seconds is inferred from the 0.001 factor that turns the row's milliseconds into the threshold, not from the frame loop; a first 0x241 well under 60 s after character select opens would say otherwise. What the server is meant to do with it (for example, drop players who stop sending it) is not in the client."

