["opcode.0x262.unit_fields"]
statement = "What the client does with message 0x262's values after the type's data that the schema leaves unnamed, for every unit type. The 8-bit value after the type data is a set of flags: 1, 4, 32 and 64 each set a unit flag; 2 clears a movement word after the movement commands; 4 with the first tagged value marks the unit for a text the client shows when a prerequisite passes; 16 hides the unit (Lua sees UnitDestroyed for it, unless it is the controlled unit); 128 removes the unit without its fade when it is destroyed. The 32-bit value after the item visuals' trailing list is the cast in progress: the client looks it up among its live casts, and Unit:IsCasting, GetCastName, GetCastDuration, GetCastElapsed and GetCastTotalPercent use it; 0 is no cast. The 32-bit and 64-bit values after the base faction are who tagged the unit, a unit id and a group id: Unit:IsTagged is true when either is non-zero and Unit:IsTaggedByMe when the unit id is the player's or the group id is the player's group's; both 0 is untagged. The first tagged value, for tag 1, is a Prerequisite id the flag 4 text waits on; for tag 0 its one bit is never read. The second, for tag 1, is a 64-bit id and a WorldSocket id: a non-zero 64-bit id links the unit to a unit the world resolves from the pair instead of giving it its own world unit, and the WorldSocket id is what housing plot checks compare (HousingPlotInfo.worldSocketId); for tag 0, or tag 1 with both 0, the unit gets its own world unit and no socket. The third, for tag 1, is a cluster id and an 18-bit value: units with the same non-zero cluster id are one cluster (Unit:GetClusterUnits, GetClusterInformation); 0, or tag 0, is no cluster. Of the last three values, the 14-bit one is a MiniMapMarker id that overrides the unit's minimap marker (0 keeps the unit's own), the 17-bit one is a Creature2DisplayInfo id and the 15-bit one a Creature2OutfitInfo id; 0 sets none, and a non-zero id with no row is reported. For a player character standing in the world, 0 in each of these, and tag 0 (or tag 1 with zeros) in each tagged value, is the client's own no-value case."
proof = "Record places from ReadMessage0262Body 0x140096fa0 (decompiled): 0x80 the 8-bit value, 0xd0 the 32-bit value after the 9-bit list, 0xdc and 0xe0 the values after the factions, 0xe8 tag and 0xec data, 0xf0 tag and 0xf8/0x100 data, 0x108 tag and 0x10c/0x110 data, 0x114, 0x118, 0x11c. InitUnitFromCreate 0x140456960 (listing): 0x140457858 cmp dword ptr [rbx+0xe8], 0x1 before 0x140457861 mov eax, dword ptr [rbx+0xec]; 0x1404577fe and 0x140457821 cmp dword ptr [rbx+0xf0], 0x1 before 0x140457807 (0xf8) and 0x14045782a (0x100); 0x140457e93 and 0x140457eae cmp dword ptr [rbx+0x108], 0x1 before 0x140457e9c (0x10c) and 0x140457eb7 (0x110); 0x14045787b mov eax, dword ptr [rbx+0x114]; 0x140456a80 mov edx, dword ptr [rbx+0x118]; 0x140456a9e mov edx, dword ptr [rbx+0x11c]; 0x140457cf2 mov edx, dword ptr [rbx+0xd0]; 0x1404578e0 and 0x1404578e7 (0xe0, 0xdc); 0x140457a1e and eax, 0x2 for ApplyCreateMovementCommands 0x1404586e0, which then clears the unit's 0xd5c; 0x140457ec7 test byte ptr [rbx+0x80], 0x40. Decompiled: flag 1 to the unit's 0x2a8, 4 to 0x36d4, 16 to the unit's virtual slot 0xb0 (0x14047dcf0: a non-zero argument hides the unit and raises 'UnitDestroyed' unless it is the controlled unit), 32 to 0x214 (GetUnitMiniMapMarkerId 0x14047a890 uses the creature's harvest marker only when it is 0), 64 to byte 0x1b0, 128 to byte 0x1b1 (the destructor 0x1404550d0 uses no fade time when it is set). 0xd0 to SetUnitCast 0x1404697a0 (unit 0x1600); IsCasting 0x140653530 and GetCastBarType 0x140656440 look it up with 0x140561c30 in the object at 0x140c65b70. 0xdc/0xe0 to SetUnitTagger 0x14045bcd0 (unit 0x124/0x128); IsTagged 0x1406612c0, IsTaggedByMe 0x140661360. Tag 1 of the first: 0xec to the unit's 0x36d0; 0x140479560 sets the unit's byte 0x26dc when 0x36d4 is set and the id is 0 or the prerequisite object at 0x140c659a0 passes it (its slot 0x18, 0x14049bf10, looks the id up in a map whose rows hold flags then condition slots and runs 0x1404a2100, the prerequisite type switch