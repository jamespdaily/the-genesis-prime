["0x1404240b0"]
statement = "Builds the path of an addon's saved data for a save level 0 to 3 (GameLib.CodeEnumAddonSaveLevel), under <roaming application data>\\NCSOFT\\WildStar\\AddonSaveData; from level 1 up the path also takes the logged-in account's name. A level above 3 or no addon builds nothing."
