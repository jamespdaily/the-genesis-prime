name = "UpdateStages"

["0x1400344d0"]
statement = "The update of the world stage, the stage that makes and owns the game object, given the frame's time: after some per-frame work, while it still owns the game object, has been drawn at least once and the game object is not yet a stage of its own, it runs the game object's update (UpdateGame) with the frame's time; it then checks whether the world is ready and, when it is, hands the game object over as a stage placed after itself and lets it go. What it waits for before the hand-over is CheckWorldLoaded (slot 0x28 of the world handler): with the world loaded, the player unit set by message 0x19b and given its model, and the world's flags set by messages 0xf1 and 0x61."
