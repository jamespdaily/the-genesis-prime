["0x1403e6af8"]
statement = "The in-world interface, and with it every user addon, starts when the client enters a world from character select: message 0xad leads to StartWorldSession and SetWorldConnection, which builds the world's systems before LoadWorld; that build starts the in-world interface here."
proof = "0x1403e6af8 call 0x140538fd0 in 0x1403e68f0; 0x1403e68f0's only caller is 0x1403e5de0 (0x1403e6422); 0x1403e5de0's only caller is SetWorldConnection 0x1403e7ea0 (0x1403e7edc call 0x1403e5de0, with no test before it), which calls LoadWorld at 0x1403e7fd1; SetWorldConnection is reached from StartWorldSession (HandleMessage00AD). Callers by the query process."
