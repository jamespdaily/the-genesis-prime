["opcode.0x7e0"]
statement = "Message 0x7e0 (2016), client to game server, sent when character select starts: its body is empty. The client fills a one-byte record with 0, but the message's sizer counts no bits and its writer writes nothing, so the frame is only the header: 06 00 00 00 e0 07. The client has no reader for it."
proof = "Registered at 0x14006d782 mov edx, 0x7e0; 0x14006d787 mov r8d, 0x1 (a one-byte record); 0x14006d76d lea r9, [0x140001b70] (sizer); 0x14006d75e lea rcx, [0x140001ba0] stored at 0x14006d77d mov [rsp+0x20], rcx (writer); 0x14006d774 mov qword ptr [rsp+0x28], 0x0 (no reader); 0x14006d765 mov dword ptr [rsp+0x30], 0x0 (mode 0). Sizer: 0x140001b70 ret 0x0 (adds nothing). Writer: 0x140001ba0 xor eax, eax; 0x140001ba2 ret (writes nothing, succeeds). So WriteMessageFrame counts 16 + 0 + 32 bits = 6 bytes."
grade = "sure"

["vector.opcode.0x7e0.frame"]
statement = "Message 0x7e0 as the client sends it inside 0x244 under the base key 0xD283F5B34A8DC685 is the 12 bytes 0c 00 00 00 44 02 06 00 00 00 03 89: the 0x244 frame's length 12 and id 0x244, then the inner frame's length 6 in the clear and its id e0 07 encrypted to 03 89."
proof = "Ghidra's p-code emulator (scratch script outside the repository), on a stream planted in the emulator's stack block (stream object with its chunk pointer at 8 and bit offset at 0x10 zero; chunk end at 0x18 and write pointer at 0x20 over 64 zero bytes): WriteBits 0x140336380 run with (stream, 6, 0x20) then (stream, 0x7e0, 0x10), its one call (0x140336413 call to the 4-byte writer, 0x1403363f9 to the 2-byte one) followed on the emulator, gave 06000000e007; EncryptMessageBody 0x1400c2d10 run on its bytes 4..5 (rcx = the base-key object built as in vector.0x1400c2eb0.base_key, rdx = the planted frame + 4, r8 = 2) gave 0389; WriteBits on a fresh stream with (12, 0x20) then (0x244, 0x10) gave 0c0000004402. By hand: n = 2 starts at key word 4 (0xbb4864fac37046aa) with p = h (0x7d546d1d1994c849): e0 xor aa xor 49 = 03, 07 xor 46 xor c8 = 89."
grade = "fairly sure"
gap = "The frame is assembled from the client's routines run one by one, with WriteMessageFrame's order (length, id, sizer and writer, no padding for a whole-byte frame), 0x244's whole-frame copy (WriteWholeFrameBody) and the senders' cipher call (frame + 4, size - 4) taken from their decodes; the whole path from StartCharacterSelect 0x140020bc0 through SerialiseMessageById and QueueMessageSend cannot run on the emulator, because the network object (0x140c65808), its registration table and its buffers exist only in a running client and the path allocates memory. A recording of the real client's 0x7e0 would settle it."
