["opcode.0x25b.counts"]
statement = "How many customisations and bone values the real client puts in a create request (0x25b), and in what order. Bone values: one 32-bit float per entry of the chosen race and sex's bone list, built from CustomizationParameterMap: for each map row of that raceId and genderEnum, one entry per part its CustomizationParameter row sets, of sclX, sclY, sclZ, rotX, rotY, rotZ, posX, posY, posZ in that order; rows in dataOrder order (rows with equal dataOrder in table order). The count depends only on race and sex, never on what the player moved: 48 for race 1 male, race 3 male and race 12 male; 46 for race 1 female, race 3 female, races 4 and 5 (both sexes), race 13 male and race 16 (both sexes); 41 for race 12 female; so at most 48. A part is sent as 0.0 when the actor holds no adjustment for that row's parameter or when the map row has flags bit 1. A race above 16 or a sex above 2 gets the table's default entry instead. Customisations: one CharacterCustomizationLabel id and one value per look the player set, each label at most once, only labels whose faction2Id is 0 or the character's faction and that the race and sex's customisation table holds, and only values that table lists for the label; in label id order. The label table allows at most 27. 0x25b carries no other client-given list (no item ids)."
