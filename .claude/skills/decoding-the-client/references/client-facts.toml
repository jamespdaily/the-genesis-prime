proof = "Character select: HandleMessage00AD 0x140022480 stores word 4 and 5 at its object's 0x1d8 and 0x1dc (0x1400224ca, 0x1400224d8); a search of the listing of 0x140010000..0x140060000 finds no other instruction with those offsets on that object; StartWorldSession 0x140034330 reads the record's 0x50 and 0x4c (0x140034343, 0x14003438c) and passes the record only to SetWorldConnection 0x1403e7ea0, which reads 0x50..0x5c (0x1403e7f54..0x1403e7fbe) and passes the name's address and LoadWorld those four values (0x1403e7fd1). In world: HandleWorldMessage's case calls 0x1403b6de0, whose decompile reads the message's words 0 to 3 only (LogMessage, LoadWorld, ShowWorldLoadingScreen)."
grade = "fairly sure"
