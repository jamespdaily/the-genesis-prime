["0x14057a2c0"]
statement = "Sends the player's queued movement commands, as a self-repeating timer. When there is no player unit or it is not under client control, it clears the queue and stops the timer. Otherwise it collapses the queue (CollapseMovementCommands) and, when any command is left to send, sends message 0x637 with the clock, the count and the commands; it sends message 0x63a with the old and new value when a unit state value has changed; then it re-arms itself to run again after the movement send interval. UpdatePlayerMovement also calls it directly to send at once."
