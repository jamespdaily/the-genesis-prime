["opcode.0x241"]
statement = "Message 0x241 (577), client to game server during realm select and character select: an activity signal with an empty body, so the frame is 06 00 00 00 41 02, sent inside 0x244 like every message. The client sends it on its realm-select or character-select connection once 60 seconds of time on those screens have passed since the last one (the first counts from the client's start), but only while the player has used the keyboard or mouse in the last 60 seconds: a key press, a left, right or middle button press, or a mouse move of more than 3 pixels on both axes. A player who leaves the screens alone sends none. The 60 seconds is GameFormula row 525's dataint0 (60000 ms in the data; 60000 when the row is missing). The client waits for no answer and has no reader for 0x241."
