name = "RegisterNetworkMessages"

["0x140332dd0"]
statement = "Sends the network layer's pings: at most once every 500 ms, for each connection the network object holds that is connected and uses the base id space, when the connection's last ping has been answered (the last answered number plus one, mod 20, is its next number), it keeps the time, sends message 0 with the next number and moves the next number on by one, mod 20. A connection starts with next number 0 and last answered 19, so its first ping goes out without waiting; a connection whose ping is never answered gets no more pings, and nothing here closes it. The network object's update runs it."
proof = "0x140332dd9 mov ecx, [0x140c636a8]; 0x140332de1 sub eax, [0x140c8a618]; 0x140332de7 cmp eax, 0x1f4; 0x140332dec jb 0x140332f51; 0x140332df2 mov [0x140c8a618], ecx. 0x140332e07 call [0x140959660] (kernel32 QueryPerformanceCounter). Walks the map at network object 0xd8 (0x140332e0d .. 0x140332f3c), node 0x28 the connection index into the array at 0xa8 (0x140332e32 movzx edi, word ptr [rbx+0x28]). 0x140332e5b cmp dword ptr [rax+0x118], 0x3 (connected, as SocketConnect sets it); 0x140332e68 cmp dword ptr [rdi+0x20], 0x0; 0x140332e6e mov ecx, [rdi+0x1a0] (last answered); 0x140332e74 mov r8d, [rdi+0x19c] (next number); 0x140332e80 inc ecx and mod 20 by 0x140332e7b mov eax, 0xcccccccd; 0x140332e8f cmp ecx, r8d; 0x140332e92 jne 0x140332ee5; 0x140332e94 mov [rdi+r8*8+0xa8], rbp (send time); 0x140332e9c movzx eax, byte ptr [rdi+0x19c]; 0x140332eb9 xor r8d, r8d; 0x140332ebf call [rax+0xf0]; 0x140332ec5..0x140332edf next = (next + 1) mod 20. Start values in the connection constructor 0x1403303e0: 0x1403304fb mov qword ptr [rbx+0x198], r14 (zero: round-trip sum and next number); 0x140330502 mov dword ptr [rbx+0x1a0], 0x13. Caller: 0x14033349b call 0x140332dd0 in 0x140333430 when bit 1 of its flags is set (0x140333492 test sil, 0x2)."
grade = "fairly sure"
gap = "0x140c636a8 is taken to count milliseconds; 0x14018cdf0, whose result 0x14018cddc stores there, is not read. What sets a connection's id space (connection 0x20) to 1 is not read, so a connection in the second id space would get no pings."
name = "SendNetworkPings"

["0x140333790"]
statement = "Handles a pong (message 1) on a connection: a sequence number of 20 or more is ignored; otherwise it becomes the connection's last answered number, the ping's round trip is the time since that number's ping was sent, in milliseconds, and it replaces that number's slot in a running total of 20 round trips. The connection keeps the total divided by 20 as its average round trip and this round trip as its last."
proof = "0x140333796 movzx edi, dx (connection index); 0x1403337ba movzx eax, byte ptr [r8]; 0x1403337c6 cmp eax, 0x14; 0x1403337c9 jae 0x140333847; 0x1403337cb mov [rdi+0x1a0], eax; 0x1403337e4 sub [rdi+0x198], eax (old slot out of the total); 0x1403337ea call [0x140959660] (QueryPerformanceCounter); 0x1403337f5 sub rax, [rdi+rbx*8+0xa8] (the ping's send time); 0x140333806 imul rax, rax, 0x3e8; 0x14033380d div qword ptr [0x140c636b8] (the counter's frequency); 0x140333814 mov [rdi+rbx*4+0x148], eax; 0x14033381b add [rdi+0x198], eax; 0x140333826 mul by 0xcccccccd and 0x14033382c shr edx, 0x4 (divide by 20); 0x14033382f mov [rdi+0x2f8], edx; 0x140333841 mov [rdi+0x2fc], eax. Called only from ReadMessageFrame (0x14033214a)."
grade = "sure"
name = "HandleNetworkPong"

