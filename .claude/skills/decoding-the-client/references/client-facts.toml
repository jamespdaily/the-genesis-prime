statement = "Writes a value of up to 64 bits one byte's worth at a time, least significant bits first, moving to a new chunk of the stream when one fills. When the stream has no room and no chunk list to grow into, it fails with 0x80004005 after writing the bytes that fit. Every writer falls back to it when fewer than 64 bits of room are left in the current chunk."
