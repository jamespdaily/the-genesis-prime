statement = "Queues a file into an archive index opened for writing: given a wide path and a 48-byte file record, it converts the path to UTF-8 (at most 260 bytes) and appends the pair to the index's pending list. It refuses an index without write access (E_ACCESSDENIED), a null path (E_INVALIDARG), a path too long (0x8007007A), and an index whose build is set: 0xA0030004, E_Asset_BuildSet, 'Index cannot be modified - build set'."
