["0x1400370d0"]
statement = "Handles server messages during login. Once the login has passed to character select it handles nothing (returns 1). From the auth server it handles message 3 (the server hello: CheckAuthServerVersion), 0x591 (login accepted, only while waiting for it: loads the account's settings file and keeps bit 0 of the first field), 0x3db (the hand-off to a game server: HandleMessage03DB), 0x3ef (ignored) and 0x63d (login refused); any other message ends the login with error 0x801B2. From the game server it was handed to it handles only message 3; any other ends the login with that error. While the login runs, ids it ignores or refuses and any message on another connection return 0 (taken), so no later handler sees them; the four handlers it passes messages to return their own results."
proof = "0x1400370e6 cmp ecx, 0xb (state) / 0x1400370eb lea eax, [rcx-0xa] (returns 1); 0x140037109 cmp edx, [rax+0x98] (the auth connection at 0xe8); 0x140037118 sub eax, 3 -> 0x1400371d6 jmp 0x140037b70; 0x140037121 sub eax, 0x3d8 -> 0x1400371c1 jmp 0x140037f30; 0x14003712c sub eax, 0x14 (0x3ef) -> return 0; 0x140037131 sub eax, 0x1a2 (0x591): 0x14003716e test (state - 6) & ~2, 0x140037183 call 0x1400114e0 (L'Account.%s.ini'), 0x140037191 and ecx, 1, 0x14003719a state 9; 0x14003713b cmp eax, 0xac (0x63d) -> 0x140037166 jmp 0x140037db0; 0x140037142 mov edx, 0x801b2; 0x140037147 call 0x1400383a0; 0x14003714c xor eax, eax. 0x1400371db mov rax, [rbx+0xf0] (the game connection); 0x1400371e5 je 0x14003714c and 0x1400371f1 jne 0x14003714c (neither connection: return 0); 0x1400371eb cmp edx, [rax+0x98]; 0x1400371fa cmp r8d, 3 -> 0x140037211 jmp 0x140038120, else 0x1400371fe jne 0x140037142. Every instruction of the .pdata range 0x1400370d0..0x140037216 read in llvm-objdump's listing."
grade = "sure"
name = "HandleLoginMessage"

["opcode.0x3"]
statement = "Message 3, server to client: the hello every server sends on a new connection. Body, in order: the build (32 bits), a 32-bit value the game-server hello's handler keeps, two more 32-bit values, a 64-bit value, a 16-bit value, a 5-bit value, the message table checksum (32 bits), a 32-bit value, a 64-bit value and a 32-bit value: 373 bits, padded to 47 bytes. From the auth server the client checks the build (16042) and the checksum (0x097998A0) and answers with its login request 0x592, or ends the login with 'versions do not match' or 'messages do not match'; from a game server it answers with 0x58f, its session key, and starts character select (or, after a realm switch, the same). The client registers a writer for message 3 but no part of it sends one."
