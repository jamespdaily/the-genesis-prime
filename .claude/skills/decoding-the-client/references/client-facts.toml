["0x1401b7af0"]
statement = "Loads an existing PACK archive for reading. It opens the file read-only (shared read), and when given an expected file record, verifies the file against it (size, write time, SHA-1). A file shorter than the 0x230-byte header is an empty archive when its size is 0 and corrupt otherwise. It reads the header, checks it, fails as corrupt when the file is shorter than the header's archive end, reads the block table (block count times 16 bytes at the header's table offset) and checks it. On any failure it closes the file, resets the header in memory to an empty archive (signature PACK, version 1, archive end 0x238, no blocks), and returns the error only when an expected record was given; otherwise it returns success with the empty archive."
proof = "0x1401b7b35/0x1401b7b5a CreateFileW(path, 0x80000000 GENERIC_READ, 1 FILE_SHARE_READ, 0, 3 OPEN_EXISTING, 0x10000000 or 0x50000000); 0x1401b7bbc GetFileSizeEx; 0x1401b7c6f call 0x1401ba2a0 (path record r14 = the second argument); 0x1401b7c83 cmp size, 0x230; 0x1401b7c8b neg/sbb/and 0xa0030001; 0x1401b7caa call 0x1401bc1a0(offset 0, object 0x38, 0x230); 0x1401b7cbc call 0x1401ba550; 0x1401b7cd0 cmp [rsi+0x240], size -> 0xa0030001; 0x1401b7ce3 resize the table to [rsi+0x258] entries; 0x1401b7cf5 shl r9, 4; 0x1401b7d16 call 0x1401bc1a0; 0x1401b7d28 call 0x1401ba600. Failure path 0x1401b7bdf: CloseHandle both handles, 0x1401b7c1b clear 0x230 bytes, 0x1401b7c29 mov dword [rsi+0x38], 0x5041434b, 0x1401b7c30 [rsi+0x3c] = 1, 0x1401b7c37 [rsi+0x240] = 0x238, table size 0; 0x1401b7c47 test r14, r14; cmovne ebp, edi (ebp = 0 from 0x1401b7b02)."
grade = "sure"
name = "PackFileLoad"

["0x1401ba550"]
statement = "Checks a PACK header: signature 0x5041434B and version 1; each of the 64 header offsets is 0 or a multiple of 16 at or after 0x240 with 24 bytes inside the archive end; with blocks, the block table offset obeys the same rule and the two block indexes (the one at 0x224 and the root at 0x228) are below the block count; with no blocks, the table offset and both indexes are 0. It returns 0, or 0xA0030001 (E_Asset_Corrupt) on any failure."
