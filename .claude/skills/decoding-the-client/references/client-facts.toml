grade = "fairly sure"
gap = "0x140466520 (current vital) and 0x1404667c0 (maximum vital) are read as switches, not each case; which Prerequisite.tbl columns feed comparison, object id and value is unread."
name = "CheckPrerequisiteVitalPercent"

