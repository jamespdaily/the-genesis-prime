name = "LuaReloadUI"

["0x1400446d0"]
statement = "Reloads the in-world interface, only when a world exists: writes the addon settings to <roaming application data>\\NCSOFT\\WildStar\\Addons.xml, then stops and restarts the interface (RestartWorldInterface), which runs every addon's OnSave before the restart."
