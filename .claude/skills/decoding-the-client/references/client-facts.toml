# The player's path (message 0x6bc), PathTracker and the level-up unlock state

["opcode.0x6bc"]
statement = "Message 0x6bc (1724), game server to client: the player's path. Body, in wire order: the path (3 bits, PlayerPathLib.PlayerPathType: 0 Soldier, 1 Settler, 2 Scientist, 3 Explorer), the path experience of each of the four paths (16 bytes: four 32-bit little-endian values in path order, Soldier first), the unlocked paths (4 bits, bit n set when path n is unlocked) and the last path change (a float of days added to the client's clock when the message arrives, so a negative value is that many days ago). The client ignores it, and reports nothing, until the world has a player (message 0x19b). After that it replaces the player's path record, sets each path's level from its experience by the PathLevel rows (the highest pathLevel whose pathXP is at most it; 0 experience is level 1), raises PlayerPathRefresh (while PlayerPathLib.GetPlayerPathType still gives the previous path, nil the first time) and then SetPlayerPath with no arguments. From then PlayerPathLib.GetPlayerPathType gives the path, GetPathXP and GetPathLevel each path's experience and level, IsPathUnlocked the path's bit, and GetPathChangeCooldown the seconds left of GameFormula 2366's 1800 seconds since the last path change (0 days gives the whole 1800 seconds; -1 gives none). Before the first one PlayerPathLib.GetPlayerPathType gives nil, GetPathLevel and GetPathXP give 1, IsPathUnlocked gives nothing, and GetEpisodes an empty table. The path is not checked: a value of 4 to 7 is kept and given to Lua as it is."
proof = "Registered at 0x140071cba mov edx, 0x6bc with 0x140071cb6 lea r8d, [r9+0x1c] (record size 28), 0x140071c9e lea rcx, [0x14008d480] stored at 0x140071ca8 (reader) and 0x140071cad mov qword ptr [rsp+0x20], 0x0 (no writer). Reader ReadMessage06BCBody 0x14008d480. HandleWorldMessage's jump table entry for 1724 is 0x1403ecc9b: 0x1403ecc9b cmp qword ptr [rsi+0x78], 0x0 (the world's player, which HandleMessage019B sets); 0x1403ecca0 je 0x1403ec71b (the shared do-nothing case, result 0); 0x1403ecca9 call 0x1404927d0 (SetPlayerPath with the record); 0x1403eccc3 lea rdx, [0x140afbaa0] ('SetPlayerPath'); 0x1403eccb5 lea r8, [0x1409d1142] (an empty format: bytes at 0x1409d1140 are 61 00 00); 0x1403eccca call 0x1400ea3e0 (the UI event raiser); 0x1403ecccf call 0x1405b3a80; 0x1403eccd4 xor ebx, ebx. The objdump reference index finds one call of 0x1404927d0, this one. CreatePlayerPath 0x14056e070 builds the record and raises PlayerPathRefresh at 0x14056e259, before SetPlayerPath stores it at 0x140492819. Lua readers, from the PlayerPathLib name and function pairs 0x140b72310..0x140b72520: GetPlayerPathType 0x1406f0740 (0x1406f074e jne when the record exists; else the Lua value type 0, nil; 0x1406f075c movd xmm0, dword ptr [rdx+0x8], the path); GetPathXP 0x1406edea0 (record 0x10 + 4n); GetPathLevel 0x1406eddd0 (record 0x20 + 4n); both give 1.0 (0x3ff0000000000000) with no player or no record and default to the player's own path; IsPathUnlocked 0x1406f1430 (0x1406f1465 mov edx, dword ptr [rcx+0xc]; 0x1406f1472 bt edx, eax; returns nothing with no record or n of 4 or more); GetPathChangeCooldown 0x1406f1190 calls 0x140527540: 0x14052757e sub rcx, qword ptr [rax+0x30] (now minus the stored time), divided by 10000000 (seconds), 0x1405275a0 mov ecx, 0x93e and 0x1405275b9 mov eax, dword ptr [rax+0x4] (GameFormula 2366 dataint0, 1800 in GameFormula.tbl), 0 when the elapsed seconds reach it, else the difference; GetEpisodes 0x1406edaa0 builds a table and leaves it empty with no player or no record. The days float goes through FileTimeFromDays 0x1401e82f0 (now plus days). Path type values: PlayerPathLib.PlayerPathType. Levels: PathLevel.pathXP."
grade = "fairly sure"
gap = "The layout and the handler's gate are read from the instructions; the Lua readers apart from the lines named, CreatePlayerPath's handling of a previous record (0x14056e480, which raises PlayerPathRefresh again, and 0x1404956e0, which carries a list over) and what 0x1405b3a80 refreshes (36 cached texts) are read from Ghidra's decompile. Whether retail sent it in the entry burst and with what unlocked bits or days is not in the client. Messages 0x6b3 to 0x6bf, 0x1aa, 0x7e, 0x56d and 0xf4 to 0xfa also call into the path code (their HandleWorldMessage cases call 0x14056f800, 0x14056e380, 0x14056e520, 0x140572030, 0x140572120, 0x140571ed0, 0x14056ed20, 0x14056f150, 0x14056ea80, 0x14056e610, 0x14056ac90, 0x14056aba0, 0x140572360 to 0x140572670); those carry the episodes and missions and are not read. A live entry that sends 0x6bc after 0x19b and checks that PathTracker builds would settle the end to end."

