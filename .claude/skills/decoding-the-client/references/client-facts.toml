# The client's game tables

["game_table.file"]
statement = "A game table file (ClientData DB\\<name>.tbl) is little-endian, in five parts: a 0x60-byte header, a column table, the column names, the record block (fixed-size records, then the string data) and the id lookup array. Header: 0x00 u32 signature 0x4454424C (the bytes 'LBTD'), checked before anything else; 0x04 u32, 0 in every file and not read by the loader; 0x08 u64 table name length in UTF-16 characters, counting the ending zero; 0x10 u64 table name offset; 0x18 u64 record size in bytes; 0x20 u64 column count; 0x28 u64 column table offset; 0x30 u64 record count; 0x38 u64 record block size in bytes, records plus string data; 0x40 u64 record block offset; 0x48 u64 lookup count; 0x50 u64 lookup offset; 0x58 u64, 0 in every file and not read by the loader. The loader uses only the low 32 bits of the record size, column count, record count, record block size and lookup count. Every header offset counts from the end of the header (file offset 0x60); each range (name, column table, each column name, record block, lookup) must lie inside the file, else the file is corrupt; a zero length or count makes that part absent. Column table: column-count entries of 24 bytes: 0x00 u32 name length in UTF-16 characters with the ending zero; 0x04 u32, 0 in every file; 0x08 u64 name offset, counted from the start of the column names, which begin at the column table's start plus 24 times the column count rounded up to a multiple of 16; 0x10 u16 the column's type (see game_table.column_type); 0x12 u16, 0 in every file; 0x14 u32 flags (8, 16, 24, 96, 104 or 112 in the files), not read by the loader. Records: record-count records of record-size bytes from the record block's start, fields placed as game_table.schema says. A string field is a u64 offset counted from the record block's start, which the loader turns into a pointer; in the files every one points past the records into the string data, at UTF-16 text ending in a zero character (an empty string is a lone zero character). Lookup: lookup-count u32 entries indexed by id, each the row index of the record with that id or 0xFFFFFFFF; in every file column 0 is the 32-bit integer ID and the lookup count is the highest id plus 1 (0 for an empty table). The client reads only through these offsets, so bytes after the lookup array (up to 668 bytes, in 9 files) are never read. The loader does not check the record count against the record block size; a lookup entry is checked against the record count only when a record is fetched."
proof = "Signature: 0x1407c16d4 cmp dword ptr [rbx], 0x4454424c on the file's first u32; otherwise 0x1407c18c4 logs 'Corrupt Tbl File' (descriptor 0x141e4e560, the string at 0x140b53f20 after the 0x12fa640 shift). Base: 0x1407c16e4 lea rdx, [rbx + 0x60], passed to 0x1407c1f00 with the file's start and end (0x1407c16e0, 0x1407c16f3). In 0x1407c1f00 (r8 = header): 0x1407c1f14 mov rax, [r8 + 0x10] (name offset); 0x1407c1f32 mov ecx, [r8 + 0x8]; 0x1407c1f36 lea rax, [rax + 2*rcx] (UTF-16 length) against the end; pointer stored at 0x1407c1f5d; 0x1407c1f6e mov rcx, [rbx + 0x40] and 0x1407c1f7b mov r8d, [rbx + 0x38] (record block); 0x1407c1f9a mov rax, [rbx + 0x50], 0x1407c1fa7 mov ecx, [rbx + 0x48], 0x1407c1faa lea rax, [rax + 4*rcx] (4-byte lookup entries); a zero count stores null (cmovne at 0x1407c1f52, 0x1407c1f92, 0x1407c1fc0). Columns, 0x1407c1e40 on header 0x20: 0x1407c1e47 mov r8, [r8 + 0x8] (header 0x28); 0x1407c1e61 mov ecx, [r10] (count); 0x1407c1e68 lea rax, [rcx + 2*rcx] / 0x1407c1e6c lea rbx, [8*rax] (24 bytes each); 0x1407c1e89 add rbx, 0xf / 0x1407c1e90 and rbx, -0x10 (names start); per entry 0x1407c1eb0 mov rax, [rdx + 0x8] (name offset), 0x1407c1ebd mov ecx, [rdx], 0x1407c1ebf lea rax, [rax + 2*rcx]. Type: 0x1407c1a5d add rbx, 0x10 then 0x1407c1a71 movzx eax, word ptr [rbx], stride 0x1407c1a80 add rbx, 0x18. Record size and column count: 0x1407c1a20 mov eax, [rbx + 0x10] and 0x1407c1a30 cmp ebp, [rbx + 0x18], rbx = header + 8. Strings: 0x1407c17f7 movzx eax, word ptr [rdx + r10 + 0x8] against 0x82 (0x1407c17fd); 0x1407c1806 cmp dword ptr [rbx + 0x30], r14d (record count); 0x1407c1814 mov r8, [rbx + 0x40] (record block pointer); 0x1407c182e add qword ptr [rcx + rax], r8. Lookup: 0x1407c1108 cmp edi, [r8 + 0x48]; 0x1407c110e mov rax, [r8 + 0x50]; 0x1407c1112 mov edx, [rax + 4*rdi]; 0x1407c1115 cmp edx, [r8 + 0x30]. Files: ClientData.index lists 384 DB/*.tbl (flag 1 stored, flag 5 LZMA); each stored block's SHA-1 equals the index's and its contents equal the copy under client-data/ClientData/DB. Parsing all 384 with this layout: signature 0x4454424c, header 0x04, 0x10 and 0x58 zero in all; column 0x04 and 0x12 zero in all; all 922,903 string fields point inside the string data at even offsets and end inside it; lookup[ID] equals the row index for every row, lookup count = highest ID + 1, and the other entries are 0xFFFFFFFF."
grade = "sure"

["game_table.schema"]
statement = "The client holds a compiled schema for each of its 384 game tables, and loads a table file only when the file's table name (ignoring case), record size, column count and each column's name (ignoring case) and type equal the schema's; otherwise it logs 'Your Tbl file does not match the Header file'. A schema is 24 bytes: a pointer to the table name (UTF-16), u32 record size, u32 column count, a pointer to the columns. A schema column is 40 bytes: a pointer to the name, u16 type, u16 zero, u32 the field's offset in the record, u64 size (4 for a 32-bit integer, float or boolean, 8 for a 64-bit integer, and for a string a number from 24 to 1028 whose use is unread), u64 flags (0x10 for every number column except HousingPlugItem.housingFeatureTypeFlags with 0x100000000; 0x60 for strings, or 0 for 11 of them), u64 the column's index. Fields lie in column order: a 4-byte field at the next multiple of 4, an 8-byte field (64-bit integer or string offset) at the next multiple of 8; the record size is the end rounded up to 8 when the record holds an 8-byte field, else to 4. Each table is read from a path the client names literally (DB\\<file>.tbl); two files differ from their table's name: DB\\Redacted.tbl holds MTXCategory and DB\\WordFilterAlt.tbl holds WordFilterChina."
proof = "Bytes at 0x140a61ca0: the Creature2 schema, name 0x140a7c5f0 ('Creature2'), 0x2b8 (696), 0xad (173), columns 0x140a4ef20. Bytes at 0x140a4ef20: column 0 name 0x1409ea98c ('id'), type 3, offset 0, size 4, flags 0x10, index 0; at 0x140a4ef70 'description' type 0x82, offset 8, size 0x130, flags 0x60, index 2. Compare, 0x1407c19f0: 0x1407c1a04 mov rcx, [rdi] (schema name) and 0x1407c1a07 call 0x14018e2c0 (CompareTextNoCase); 0x1407c1a23 cmp dword ptr [rdi + 0x8], eax (record size); 0x1407c1a2d mov ebp, [rdi + 0xc] (count); 0x1407c1a59 mov rdi, [rdi + 0x10] (columns); 0x1407c1a65 mov rcx, [rdi] and 0x1407c1a68 call 0x14018e2c0 (column name); 0x1407c1a74 cmp word ptr [rdi + 0x8], ax (type); 0x1407c1a7c add rdi, 0x28. Failure: 0x1407c17ae lea rax, [0x141e4e5c0] (string 0x140b53f80). Field offset: 0x1407c181f mov eax, [rax + r10 + 0xc]; flags: 0x1407c183f test byte ptr [rdx + r10 + 0x18], 0x10; record size: 0x1407c1124 mov eax, [rax + 0x8] / 0x1407c1127 imul eax, edx. Path: the file table class 0x140b798c0 has 0x1407c1390 in slot 0x60 (bytes at 0x140b79920), called at 0x1401e873b with 0x140ae3010 ('DB\\AccountCurrencyType.tbl') for the schema 0x140acd8c8. Count: a scan of .rdata for {UTF-16 name pointer, record size, column count, column pointer whose first entry names a UTF-16 text} finds 384 schemas, one matching each file in name, record size, column count, column names and types; the placement rule gives every one of the 4,964 schema offsets and all 384 record sizes. 'DB\\Redacted.tbl' and 'DB\\WordFilterAlt.tbl' are UTF-16 texts in .rdata; 'DB\\MTXCategory.tbl' and 'DB\\WordFilterChina.tbl' are not in the client."
grade = "sure"

["game_table.column_type"]
statement = "A game table column's type code, the same in the file and in the client's schema: 3, a 32-bit integer (4 bytes; 3,542 columns); 4, a 32-bit float (4 bytes; 1,188 columns); 11, a boolean held in 4 bytes (12 columns, in CharacterCreation, Emotes, InputAction, Quest2, Spell4Reagent and WorldZone); 20, a 64-bit integer (8 bytes; 4 columns, in AccountItem, CharacterCustomizationSelection, CurrencyType and TradeskillTier); 130, a string, held as an 8-byte offset to UTF-16 text in the string data (218 columns, in 110 tables). The loader also handles a type 128, a field of a u64 offset and a u32 length, but no table has a column of that type. No other type occurs."
proof = "Type counts over all 384 schemas and all 384 files are the same: 3: 3,542, 4: 1,188, 130: 218, 11: 12, 20: 4 (4,964 columns). Schema sizes: type 3, 4 and 11 size 4, type 20 size 8 (see game_table.schema). Loader: 0x1407c17c7 mov esi, 0x80; 0x1407c17d4 lea r15d, [rsi + 0x2] (0x82); 0x1407c17fd cmp ax, r15w, then 0x1407c182e add qword ptr [rcx + rax], r8 (string offset to pointer); 0x1407c183a cmp ax, si, 0x1407c183f test byte ptr [rdx + r10 + 0x18], 0x10, then for a nonzero u64 0x1407c1876 lea rdx, [rax + r8], 0x1407c187a mov r8d, [rcx + 0x8], 0x1407c187e call 0x1401e8450. The same pair is tested at 0x1407c13d3 and 0x1407c13d8 in 0x1407c1390. Float: Creature2.donutDrawDistance holds -1.0 in 55,977 rows read as IEEE single. Boolean values: every type-11 field in the files is 0 or 1."
grade = "fairly sure"
gap = "Whether types 3 and 20 are signed is not read; settled by a client reader that sign-extends or compares a type-3 field as signed. What 0x1401e8450 does with a type-128 field is not read."

["game_tables.ClientData"]
