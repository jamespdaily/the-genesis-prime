["0x14056e070"]
statement = "Builds the player's path record from message 0x6bc's body: the path, the unlocked-path bits, the last path change (now plus the message's days), and for each of the four paths its experience and its level, the pathLevel of the highest PathLevel row of that path whose pathXP is at most the experience (a path with no rows keeps level 0). When a record already exists it is cleared first and part of it carried over. It then drops pending path entries and raises PlayerPathRefresh with no arguments."
proof = "0x14056e094 mov edx, dword ptr [rdx] / 0x14056e099 call 0x140572a50 (base constructor: the path at record 0x8, 0x140572a66 mov ebx, edx); 0x14056e171 movzx eax, byte ptr [r14+0x14] / 0x14056e176 mov dword ptr [rsi+0xc], eax (unlocked bits); 0x14056e17e movss xmm1, dword ptr [r14+0x18] / 0x14056e184 call 0x1401e82f0 (FileTimeFromDays into record 0x30); loop 0x14056e190 mov r8d, dword ptr [rbx+r14-0x1c] (message experience n) / 0x14056e197 mov dword ptr [rbx-0x10], r8d (record 0x10 + 4n) / 0x14056e195 mov edx, edi (path n) / 0x14056e19b call 0x140491d60 / 0x14056e1a8 mov ecx, dword ptr [rax+0x8] (the row's pathLevel) / 0x14056e1b1 mov dword ptr [rbx], ecx (record 0x20 + 4n) / 0x14056e1b7 cmp edi, 0x4. 0x140491d60 looks the path up in the map at 0x50 of the object at 0x140c65968 (set at load by 0x140491f60) and binary-searches its rows by the word at 0xc (pathXP), taking the last at most the experience. Old record: 0x14056e1c4 call 0x14056e480. 0x14056e1f0..0x14056e216 destroy the entries of the list at 0x140c65920 whose word 0x38 is 0; 0x14056e252 lea rdx, [0x140afbf40] ('PlayerPathRefresh'); 0x14056e259 call 0x1400ea3e0. PathLevel.tbl columns ID, pathTypeEnum, pathLevel, pathXP (row words 0x0, 0x4, 0x8, 0xc)."
grade = "fairly sure"
gap = "That the map at 0x50 is built from PathLevel.tbl is inferred from the row words matching its columns; 0x140491f60 is not read. 0x14056e480 and the carried list are read from Ghidra's decompile only."
name = "CreatePlayerPath"

