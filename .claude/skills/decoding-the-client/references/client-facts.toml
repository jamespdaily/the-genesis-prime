["opcode.0x162.after_create"]
statement = "What the client does when 0x162 refuses the play that follows a create, and how a 0x117 sent after it lands. After create result 3 (CreateOk) for a Nexus (3) or Level50 (5) start the client sends 0x7dd at once, raising no Lua event, so the create screen stays up while it waits (state 4); for any other start (PreTutorial, the Novice choice, among them) it first plays an intro movie (kind 5 for faction 166, 4 for 167) and sends 0x7dd when the movie ends. While it waits for 0xad or 0x162 there is no timeout. 0x162 returns it to idle (state 0), where it handles 0x117 as it handles every message outside states 5 and 6, and raises CharacterSelectFail, for which character select shows its error box for 10 seconds or until closed ('We dropped the cryo pod. Sorry about that.' for 2 Failed and for 0 and 5 to 7). A 0x117 then raises CharacterList: the creation Lua closes the create screen and opens character select (unless the realm-full queue window is up), and that rebuild hides the error box at once and rebuilds the list with the preselection of lua.CharacterSelection.OnLoadFromCharacter.preselect. So a 0x117 sent straight after 0x162 leaves the refusal text on screen for no visible time. Of the 0x162 values, 2 Failed is the generic refusal; 4 FailedCharacterInWorld tells the player another character is still in the world and to try again in a minute."
proof = "HandleMessage00DC 0x140021fb0 (decompiled): state 1 to 0 on entry; row word 0x5c test; PlayCharacter 0x140023400 at once for 3 and 5; else AllocMemory(0x268), 0x14001c590, 0x14001c730 (starts Bink: BinkSetMemory, BinkSetSoundSystem, StartClient), the callback PlayCreatedCharacterAfterIntro 0x140021f40 handed over through the movie's slot 0x68, 0x14001ca90 with 5 or 4, 0x140048100 links and starts it; a movie that fails to start plays the character at once. States: record 0x140020ea0 (0x162 taken only in state 4, idle after). No timer: UpdateCharacterSelect 0x140020dc0 reads the state only for its idle flag, and the base stage update 0x14003dea0 (decompiled) reads neither the state nor a time of character select. Lua, scratch extraction of ClientData.archive: CharacterSelect.lua lines 50 and 836-851 (OnCharacterSelectResult), 697-703 (PopupError: DeleteFailedTimer 10 s, wndDeleteError shown), 820-822, 93-130 (OnLoadFromCharacter hides wndDeleteError at line 130); Character.lua lines 863-882 (OnCharacterList), 896-925 (OpenCharacterSelect: HideCharacterCreate, LoadFromCharacter), 1147-1170 (HideCharacterCreate)."
grade = "fairly sure"
gap = "Not read: the intro movie object (0x14001c590) and when it calls back, what slot 0 of the character-select class (called before the movie) does, and whether character select's screen is back when the movie ends; that the success path raises no Lua event is from the decompile; addons other than Character and CharacterSelection are not searched for a timer on the wait, nor the base update's callees 0x14004d360 and 0x1400e74a0. A live create against a server that answers 0x7dd with 0x162 and then 0x117, once for a Nexus and once for a PreTutorial start, would settle what the player sees."

["lua.CharacterSelection.OnLoadFromCharacter.preselect"]
