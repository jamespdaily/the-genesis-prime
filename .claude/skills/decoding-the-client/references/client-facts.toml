proof = "0x14008d4a5 mov r8d, 0x3 / 0x14008d4ae call ReadBits32 into record 0x0; 0x14008d4b7 lea rdx, [rbx+0x4] / 0x14008d4bb mov r8d, 0x10 / 0x14008d4c4 call ReadBytesAsBits (16 bytes, in order); 0x14008d4cd lea rdx, [rbx+0x14] / 0x14008d4d1 mov r8d, 0x4 / 0x14008d4da call ReadBits8; 0x14008d4e3 lea rdx, [rbx+0x18] / 0x14008d4ea call ReadFloat. Registered with 0x6bc at 0x140071cba."
