grade = "fairly sure"
gap = "The wire layout is run on the emulator (vector.opcode.0x592.body); the sources of the fields are read from Ghidra's decompile only, and what the text-table value, game 0x1708 and 0x140c67244 mean to the server is not read. The digest fold is read in FoldClientFileDigests 0x140012780. A recording of the real client's 0x592 would settle the values."

