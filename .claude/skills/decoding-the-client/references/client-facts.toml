statement = "Message 0x968 (2408), game server to client: the account's entitlements. Body: a count (32 bits), then that many pairs of an Entitlement id (32 bits) and the count held (32 bits). The client sets each entitlement's count in its account list without raising an update per entry, then calls the premium tier object's first method. Character select adds the BaseCharacterSlots (12) count to the character slots (lua.CharacterSelection.OnLoadFromCharacter). It is handled in every state, before the login, character-select and world handlers, when the game holds HandleMessages0966To0980. The client has no writer for it."
