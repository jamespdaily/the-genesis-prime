# Message plumbing

["0x14006c290"]
name = "RegisterMessage"
statement = """Registers one message type. Its arguments are, in order: (2) the opcode, \
(3) the size of the message's struct, (4) usually unused, though for 0x035B and 0x0597 it \
holds something else (for 0x0597, a size function), (5) the writer, which the client calls \
to send the message, and (6) the reader, which it calls to read a received one."""
proof = """Each call's disassembly: EDX is the opcode, R8D the size, R9 argument 4, [RSP+0x20] \
the writer and [RSP+0x28] the reader. Dumped to ~/Coding/wildstar/ghidra/register_fn.txt and \
parsed to client-opcodes.json. ClientFallingDamage (0x00FB) is one such call, at \
0x140070878."""
grade = "fairly sure"

