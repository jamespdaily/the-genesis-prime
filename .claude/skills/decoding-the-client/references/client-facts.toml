["0x14000ac90"]
statement = "Starts the client from its command line. The first word must be /auth or -auth (any case) and the second word must not be empty; otherwise the client starts the launcher and exits (RelaunchLauncherAndExit). It then reads the optional arguments processor, account, password, authtoken and Lang (en by default; en, de, fr and zh are known). An argument name begins with '-', '/' or the character 0x96 or 0x97, is matched ignoring case, and its value is the next word. Because the first word is /auth, the second word is also the value of the argument Auth: the auth server's host."
proof = "0x14000ae77 call [0x140959718] (CommandLineToArgvW), the word list kept in the game object; 0x14000aea2 lea rdx, L'/auth' (0x1409de840); 0x14000aeb3 call 0x14018e2c0 on the first word; 0x14000aebc lea rdx, L'-auth' (0x1409de850); 0x14000aecd jne 0x14000b67d; 0x14000aed3 test rbx, rbx (the second word); 0x14000aedc cmp word [rbx], di; je 0x14000b67d; 0x14000b680 call 0x1400112c0. Each argument loop tests the word's first character ((c - 0x2d) & ~2 == 0, or c - 0x96 < 2) and compares the rest with 0x14018e2c0 against L'processor' (0x1409de860), L'account' (0x1409de8b0), L'password' (0x1409de8c0), L'authtoken' (0x1409de8e0) and L'Lang' (0x1409de8f8); the Lang value is compared with 'en', 'de', 'fr' and 'zh' (0x1409d1884, 0x1409d1944, 0x1409d19d4, 0x1409d1a7c)."
grade = "sure"
name = "InitClientFromCommandLine"

