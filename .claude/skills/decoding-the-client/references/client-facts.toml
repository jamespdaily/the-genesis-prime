["0x140c3fea0"]
statement = "The setting video.framerateMax: the most frames a second the client runs, an integer setting with default 120, least 15 and most 180. It holds one value for each of five settings levels, each 120 at start, and is read at the level in use. Its set routine (SetIntSetting) clamps every value to 15..180 (ClampIntSetting) before storing it, and its other writers store the default or a value already held, so no level holds a value outside 15..180. Each pass of the main loop waits out one second divided by it unless vertical sync is on (RunFramePass)."
