grade = "fairly sure"
gap = "What 0x140021bb0 puts in the id set is taken from the opcode.0x117 record, not read here; the entitlement list's owner (word 0x15d0 of the object at 0x140c635f0) and the limit-lifting setting (word 0x1648 there) are read only by their use."
