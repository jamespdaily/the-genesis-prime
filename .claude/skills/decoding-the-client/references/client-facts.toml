["PathLevel.pathXP"]
statement = "The least path experience of a path level: each of the four paths (pathTypeEnum 0 to 3) has 30 rows, levels 1 to 30, with the same thresholds: level 1 at 0, 2 at 30, 3 at 120, 4 at 270, up to level 30 at 49470. The client sets a path's level from its experience with them when message 0x6bc arrives."
