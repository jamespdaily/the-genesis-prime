["lua.Character.OnNameChanged"]
statement = "Builds a new character's name as the first-name text, a space and the last-name text, exactly as typed (no change of case), and checks each part with IsCharacterNamePartValid and the whole with IsCharacterNameValid; CreateCharacter sends that text. Rename builds its name the same way (CharacterSelection:OnRenameConfirm) and RenameCharacter sends it. Nowhere does the client fold a character name's case before sending it, and its name rules (text rules 0 and 25) accept any case. The only case-free comparisons of character names in the pre-game Lua are confirmation boxes: delete is enabled only when the typed text equals the character's name ignoring case, and so are the two realm-transfer buttons."
proof = "UI/PreGame/Character/Character.lua lines 3514-3537 (string.format('%s %s', strFirstName, strLastName)), 1029, 1123 and 1134 (CharacterScreenLib.CreateCharacter(self.strName, ...)); UI/PreGame/CharacterSelection/CharacterSelect.lua lines 1049-1059 (rename) and 1018-1025 (OnDeleteNameChanged: Apollo.StringToLower(strName) == Apollo.StringToLower(strDelete)); UI/PreGame/AccountServices/AccountServices.lua lines 527-528 (transfer confirm, StringToLower on both sides). CheckTextRule 0x1403e1170 lowers a character only for flag 8 (0x1403e12e3 call 0x140056430; 0x1403e1314 test dil, 0x8), which rules 0 (0x506) and 25 (0x116) lack. Callees of CreateCharacter 0x140023e90 and RenameCharacter 0x140024dd0 include neither the lower-case routine 0x140056430, CompareTextNoCase 0x14018e2c0, LCMapStringW nor CompareStringW; 0x140056430 is called from no character select function except through CheckTextRule."
grade = "fairly sure"
gap = "The text helpers CreateCharacter and RenameCharacter call (0x14018f0e0, 0x14018f2d0, 0x140056bb0) are read only by their use as Lua and UTF-8 conversions; whether names are unique regardless of case is the server's rule, which the client cannot show. In-world name lookups (chat, friends, groups) are not read."

# The NC platform login library, StsConnLib64.MT.dll: the STS protocol the client speaks before the auth server



["StsConnLib64.MT.dll!0x180000000"]
statement = "StsConnLib64.MT.dll, shipped beside the client, is the NC platform login library the client loads (LoadStsConnLib). It is a 64-bit DLL loaded at 0x180000000 exporting CreateStsConn (ordinal 1), FinalizeStsConnLib (2) and InitializeStsConnLib (3). It speaks the STS protocol over one TCP connection: text messages with an HTTP-like first line and headers, XML bodies, a login by SRP-6a (SHA-256, the 1024-bit group of RFC 5054, little-endian numbers) and, after the login, RC4 over every byte in both directions."
proof = "File SHA-256 aa0ef5888d17eb65da28b1cbef178d1650a837303c10a6fafc9f3c646c2f3fd1, 1899520 bytes. llvm-readobj: ImageBase 0x180000000, AddressOfEntryPoint 0x46894; sections .text (0x1000, 0x121e3c), .rdata (0x123000), .data (0x170000), .pdata, .rsrc, .reloc. Export table: CreateStsConn RVA 0x36b0, FinalizeStsConnLib 0x1140, InitializeStsConnLib 0x10f0. Imported into the Ghidra project beside the client as /StsConnLib64.MT.dll and analysed (40 s). Source paths in its strings name the NC platform's StsConnLib, StsInetSocket, InetMsg, RapidXml, Srp and SocketCrypt modules."
grade = "fairly sure"
gap = "The fact checker accepts a sure grade only for addresses of the client (0x14...), so a fact read in StsConnLib64.MT.dll is graded fairly sure; teaching check_facts.py the library's addresses (0x18...) would let it be graded sure."

["StsConnLib64.MT.dll!0x180001c30"]
statement = "Starts a connection object (CreateStsConn's method 0) with the client's three numbers: 400, 1001 and the NC program id (902 by default). It makes the library's socket manager named StsConn2Gate with connection type 1281 (0x501) when the first number is 400, else 1280, and a transaction time-out of 100000 ms. The client then passes the server address list (StsConnSetServerAddresses), and the library opens the TCP connection itself."
proof = "Decompiled: uVar1 = 0x500; if (param_2 == 400) uVar1 = 0x501; FUN_1800346d0(L'StsConn2Gate', conn+0x20, param_2, 0, 0, uVar1, 100000, param_3, param_4, 0) kept at conn+0x18; log '[Info] StsConnLib Initialized.'. The client's call: StartNcPlatform's manager method 0x1400b4340 calls the new connection's slot 0 with the manager's 0xc4, 0xc8 and 0xcc, set by the manager constructor 0x1400b2a60 to 400 (0x140c67034) and 0x3e9 (0x140c67038) and by 0x1400b4340 to its program id argument. 0x180002b10 copies each address into a list and calls the socket manager's slot 0x40 with it."
grade = "fairly sure"
gap = "Which of the socket's fields the three numbers become (Program, Build, Process in the Connect message) is not traced through the socket manager 0x180033fd0 to the socket. The fact checker accepts a sure grade only for addresses of the client (0x14...), so a fact read in StsConnLib64.MT.dll is graded fairly sure; teaching check_facts.py the library's addresses (0x18...) would let it be graded sure."

["StsConnLib64.MT.dll!0x180022cb0"]
statement = "Writes an STS request's first line: POST, a space, /<protocol>/<command> with every byte outside A-Z, a-z, 0-9, '-', '.', '_', '~' percent-encoded, a space, STS/1.0 and CR LF. The protocol and the command must each be under 65 characters, or the line is not written. The login uses protocol Auth (commands LoginStart, KeyData, LoginFinish, RequestGameToken), GameAccount (ListMyAccounts) and Sts (Connect, Ping)."
