proof = "Read by 0x1403ec70e mov ecx, [r9+rax*4+0x3f1344] with r9 = 0x140000000, after 0x1403ec6eb lea eax, [rbx-0x61] (the id less 97) and 0x1403ec6fc cmp eax, 0x911; 0x1403ec701 ja 0x1403f12d2 (the default). Bytes at 0x1403f1344: ffc93e00 d2123f00 d2123f00 d2123f00 (id 97 -> 0x1403ec9ff, ids 98..100 -> the default 0x1403f12d2); the last entry, id 2418, is f8fc3e00 (0x1403efcf8), followed by cccccccc padding. The list is every k in 0..2321 whose entry plus 0x140000000 is not 0x1403f12d2, read twice: from the file's bytes with client_pe (ClientPE.read) and from jump_tables.read_function's targets for the jmp at 0x1403ec719, which agree; 645 ids in 313 runs, first 97, last 2418. Every case target lies on an instruction start in llvm-objdump's listing of 0x1403ec6a0..0x1403f1344. .pdata of 0x1403ec6a0 includes the range 0x1403f1344..0x1403f378c (0x2448 = 2,322 x 4 bytes). Ghidra function_at returns null; refs_to: 0x1403ec70e and an unwind record at 0x140e03708. test_jump_tables.py (test_the_2322_case_switch_targets_are_the_table_entries_in_the_file, test_the_2322_case_switch_has_636_distinct_targets) checks the entries and the default, from which the list follows; no test pins the list or its count of 645."
grade = "sure"

["0x140612b08"]
statement = "The jump of a 6-case switch on the number of arguments (0 to 5) in function 0x1406128b0, which raises a UI event a server message names by its LuaEvent table id. That function builds a type letter for each of up to five arguments (i, s, U, b, o, Q for types 0 to 5), fails if the LuaEvent row's parameters text does not begin with those letters, and then each case raises the row's eventName with that many arguments (case 0 with an empty format). The default 0x140612c13 is the shared clean-up. The table is 6 four-byte image-relative entries at 0x140612c94. Ghidra recovers only the first target."
proof = "0x1406128d9 call 0x140211f40 (looks up the message's first value in the 'LuaEvent' table; LuaEvent.tbl columns: ID, eventName, parameters, record 0x18 bytes); 0x140612988..0x140612992 a second switch (table 0x140612c7c) appends 'i' 's' 'U' 'b' 'o' 'Q'; 0x140612a66 and 0x140612ae0 call 0x14018f0e0 on the row's parameters and eventName texts; 0x140612a7e..0x140612aaa compare; 0x140612ae9 sub r14, rbx (letter count); 0x140612aec cmp r14, 5; 0x140612af0 ja 0x140612c13; 0x140612afd mov eax, [rcx+r14*4+0x612c94]; 0x140612b05 add rax, rcx; 0x140612b08 jmp rax. Table gives 0x140612b0a, 0x140612b29, 0x140612b48, 0x140612b70, 0x140612b9e, 0x140612bd5; each calls 0x1400ea3e0 with the name, the letters (case 0: 0x1409d143a, an empty text) and 0..5 values, then reaches 0x140612c13. Ghidra switch_targets returns only 0x140612b0a. test_query_process.py (test_ghidra_agrees_with_the_jump_table_reader_on_299_of_302_switches) lists it among the three that differ."
grade = "fairly sure"
gap = "Which server message reaches 0x1406128b0 is unread: it has no direct callers, only function-table entries at 0x140bf1938, 0x140bf1974 and 0x140bf1994."

["0x140009d00"]
statement = "The client's main window procedure. On WM_DESTROY it posts quit; before the window object exists it calls DefWindowProcW. Otherwise it keeps the window at least 640 by 480, takes the mouse capture on a button press and releases it when no button is left down, hides the system cursor over the client area and shows it outside (WM_SETCURSOR), clips the cursor to the window on activation in one window mode, raises timer resolution and sets above-normal priority while the application is active (normal priority when not), refuses a suspend query, and passes every message on to the window object's own handler."
proof = "Decompiled signature LRESULT (HWND, UINT, WPARAM, LPARAM). msg 2 (WM_DESTROY) -> PostQuitMessage(0); no object -> DefWindowProcW (import 0x1409597c8). 0x24 (WM_GETMINMAXINFO) raises min track size to 0x280 x 0x1e0; 0x201/0x204/0x207 SetCapture, 0x202/0x205/0x208 ReleaseCapture when no button bits; 0x20 (WM_SETCURSOR) ShowCursor at 0x14000a061 and 0x14000a0bb; 7 (WM_SETFOCUS) SetForegroundWindow, GetWindowRect, ClipCursor; 0x1c (WM_ACTIVATEAPP) timeBeginPeriod/timeEndPeriod and SetPriorityClass 0x8000 or 0x20; 0x218 (WM_POWERBROADCAST) with wParam 0 returns 0x424d5144 (BROADCAST_QUERY_DENY); 0x112 (WM_SYSCOMMAND) swallows some commands; then calls the window object's handler. 0x140008966 lea rax, [0x140009d00] is stored next to class style 0xb in the window-class record built in 0x140008910 (RegisterClassW is imported). .pdata ranges 0x140009d00..0x14000a30e. test_client_refs.py checks that the two ShowCursor calls lie in it."
grade = "sure"
name = "MainWindowProc"

["0x14000a061"]
statement = "In MainWindowProc's WM_SETCURSOR handling, the call to ShowCursor(TRUE) that shows the system cursor again when the cursor is outside the client area and the client had hidden it; the hidden flag is then cleared."
proof = "0x14000a053 test dword [rdi+0x40], 0x800; 0x14000a05a je 0x14000a06e; 0x14000a05c mov ecx, 1; 0x14000a061 call [0x1409598f8] (user32.dll!ShowCursor, import table read by client_pe); 0x14000a067 and dword [rdi+0x40], 0xfffff7ff. Reached when the cursor point fails the client-rectangle tests at 0x14000a040..0x14000a051. Ghidra refs_to 0x1409598f8: READ from 0x14000a061 in 0x140009d00. test_client_refs.py (test_the_showcursor_slot_is_referenced_by_two_calls_and_a_jmp_through_it) checks it as a call-mem reference in 0x140009d00."
grade = "sure"

["0x14000a0bb"]
statement = "In MainWindowProc's WM_SETCURSOR handling, the call to ShowCursor(FALSE) that hides the system cursor while it is over the client area (or the window holds the mouse capture), if the client has not hidden it already; the hidden flag is then set."
proof = "0x14000a097..0x14000a0aa tell the window object whether to show its own cursor; 0x14000a0b0 test dword [rdi+0x40], 0x800; 0x14000a0b7 jne 0x14000a0c8; 0x14000a0b9 xor ecx, ecx; 0x14000a0bb call [0x1409598f8] (user32.dll!ShowCursor); 0x14000a0c1 or dword [rdi+0x40], 0x800. Ghidra refs_to 0x1409598f8: READ from 0x14000a0bb in 0x140009d00. test_client_refs.py (test_the_showcursor_slot_is_referenced_by_two_calls_and_a_jmp_through_it) checks it."
grade = "sure"

["0x1402801f3"]
statement = "A tail jump through the ShowCursor import slot, ending a small function at 0x1402801d0 that sets an object's cursor-shown flag and calls ShowCursor with the new value only when the flag turns on or off. The function has no .pdata entry, so by .pdata the jump lies outside every function; it is reached only through a function table."
proof = "0x1402801d0 xor r8d, r8d; 0x1402801d3 test edx, edx; 0x1402801d8 sete al; 0x1402801db cmp [rcx+0x2170], r8d; 0x1402801e2 sete r8b; 0x1402801e6 cmp r8d, eax; 0x1402801e9 je 0x1402801fa (ret); 0x1402801eb mov [rcx+0x2170], edx; 0x1402801f1 mov ecx, edx; 0x1402801f3 jmp [0x1409598f8] (user32.dll!ShowCursor). client_pe root_of(0x1402801f3) is None. Ghidra: function seed_1402801d0 (seeded), no callers, one data reference from 0x140b61450 (a function-table slot); refs_to 0x1409598f8 lists it as INDIRECTION. test_client_refs.py (test_the_showcursor_slot_is_referenced_by_two_calls_and_a_jmp_through_it) checks it as jmp-mem outside every .pdata function."
grade = "sure"

["0x1408296a0"]
statement = "Converts an angle in degrees to radians as a 32-bit float: (x - trunc(x / 360)) * pi / 180. It subtracts the count of whole turns, not 360 times it, so it does not wrap at 360 degrees: 720 gives 718 degrees in radians. A quotient beyond the 32-bit integer range truncates to -2147483648, as the CPU does."
proof = "0x1408296a0 movaps xmm1, xmm0; 0x1408296a3 mulss xmm1, [0x140b79d14] (bytes 610b363b = 0.0027777778, 1/360); 0x1408296ab cvttss2si eax, xmm1; 0x1408296af movd xmm2, eax; 0x1408296b3 cvtdq2ps xmm2, xmm2; 0x1408296b6 subss xmm0, xmm2; 0x1408296ba mulss xmm0, [0x140b79d50] (bytes 35fa8e3c = 0.017453292, pi/180); 0x1408296c2 ret. No .pdata entry (leaf). emulate: 180.0 -> 0x40490fdb (pi), 720.0 -> 0x41487ee0 (12.5315), -90.0 -> 0xbfc90fdb. Callers: 0x1408688f0 (two sites). test_emulator.py checks it against formulas_by_hand.py formula_b."
grade = "sure"
name = "DegreesToRadians"

["0x140882470"]
statement = "Returns the index (0 to 63) of the highest set bit of a 64-bit value, and 0xffffffff (-1) for 0. It tests the upper 32 bits first and otherwise searches the lower 32 bits, narrowing by 16, 8, 4, 2 and 1 bits."
proof = "0x140882470 mov rdx, rcx; 0x140882473 mov eax, 0x20; 0x140882478 shr rdx, 0x20; 0x14088247c test edx, edx; 0x14088247e je 0x1408824c4; 0x140882480..0x1408824b7 test 0xffff0000/0xff000000/0xf0000000/0xc0000000 and shift by 16/8/4/2, subtracting; 0x1408824ba test edx, edx; js; 0x1408824be dec eax; 0x1408824c0 add eax, 0x1f; ret. Low half 0x1408824c4..0x14088250e ends dec eax; dec eax (when not negative); ret. No .pdata entry (leaf). emulate: 0 -> 0xffffffff, 1 -> 0, 0x80000000 -> 31, 2^32 -> 32, 2^63 -> 63. Callers: 0x140881ec0, 0x140881f60 (two sites), 0x1408821b0. test_emulator.py checks it against formulas_by_hand.py formula_a."
grade = "sure"
name = "HighestSetBitIndex64"

["0x1408824c4"]
statement = "In HighestSetBitIndex64, the start of the search of the lower 32 bits, taken when the value's upper 32 bits are zero; it begins from 32, or from 31 when the lower 32 bits are zero too, so that 0 returns -1."
proof = "0x14088247c test edx, edx; 0x14088247e je 0x1408824c4; 0x1408824c4 test ecx, ecx; 0x1408824c6 mov edx, 0x1f; 0x1408824cb cmove eax, edx (eax was 0x20 from 0x140882473); then 0x1408824ce test ecx, 0xffff0000 ... 0x14088250c dec eax; 0x14088250e ret. emulate 0 -> 0xffffffff. formulas_by_hand.py formula_a follows these lines; test_emulator.py checks it."
grade = "sure"

["0x140663030"]
statement = "Pushes a quest onto the Lua stack as a full userdata that holds the quest pointer and carries the 'Game.Quest' metatable, and returns 1 (one value pushed). A null quest pushes nothing and returns 0. Every Lua function that hands a quest to the UI goes through it."
proof = "0x140663040 test rdx, rdx; 0x140663043 jne / 0x140663045 xor eax, eax; ret (null quest returns 0). 0x140663057 call 0x140059170 with size 8 (lua_newuserdata: pushes a type-7 value and returns the block, Lua 5.1 layout); 0x140663069 mov [rax], rbx stores the quest pointer; 0x14066305c lea of 'Game.Quest', 0x140663063 mov r8d, 0xa, 0x140663073 call 0x140062650 (luaS_newlstr: the Lua 5.1 string hash, 'memory allocation error: block too big'); 0x140663090 mov [rsp+0x28], 4 (TValue tag string); 0x140663081 lea of the registry (global state +0xa0); 0x140663098 call 0x14005e8e0 (luaV_gettable: 'loop in gettable'); 0x14066309d add [rdi+0x10], 0x10 (top++); 0x1406630a2 mov edx, -2; 0x1406630aa call 0x140058bf0 (lua_setmetatable); 0x1406630b4 mov eax, 1. Its 18 callers by the query process: the 17 .pdata functions test_client_refs.py names plus 0x140420230. Checked by test_client_refs.py and test_query_process.py (caller lists only)."
grade = "sure"
name = "PushQuest"

["0x140420230"]
statement = "The push slot of the quest argument marshaller: takes the next 8-byte quest pointer from an argument cursor, advances the cursor, and pushes the quest to Lua through PushQuest. It is the middle entry of a three-entry table whose first entry returns the type letter 'Q' and whose last reads a 'Game.Quest' userdata back from the Lua stack. It has no .pdata entry."
proof = "0x140420230 add [r8], 8; 0x140420234 mov rcx, rdx (the Lua state); 0x140420237 mov rdx, [r8]; 0x14042023a mov rdx, [rdx-8]; 0x14042023e jmp 0x140663030. Table at 0x140b66d78: 0x140420220 (mov al, 0x51; ret), 0x140420230, 0x140420250 (0x14042025c lea of 'Game.Quest', 0x140420268 call 0x140056ab0 = luaL_checkudata, 0x14042027b stores the pointer through the cursor). client_pe.root_of(0x140420230) is None; Ghidra names it seed_140420230. Cited in test_query_process.py."
grade = "sure"
name = "PushQuestArgument"

["0x14042023e"]
statement = "The tail-call jump from the quest argument marshaller's push slot into PushQuest. It lies in code with no .pdata entry, so the .pdata reference index counts it in no function, while Ghidra's seeded project puts it in 0x140420230."
proof = "0x14042023e jmp 0x140663030 (llvm-objdump). client_pe.root_of(0x14042023e) is None; the query process's callers of 0x140663030 list it as the site of 0x140420230. test_client_refs.py asserts it is not among the index's call sites."
grade = "sure"

