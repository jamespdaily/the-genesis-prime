["0x140029820"]
statement = "GetLevelForExperience: returns the level for an amount of experience. The highest level is GameFormula row 145's dataint0 (50 in the data; 1 without the row). It takes XpPerLevel records by position, from record 0 to the record at the highest level; an amount below record 0's minXpForLevel or above that last record's gives -3 (-1 or -2 when a record is missing). Otherwise it finds by halving the last record, from 0 to one below the highest level, whose minXpForLevel is at most the amount, and returns that record's ID. Comparisons are signed. With the data (IDs 1 to 201 in order, record 50 at 2147483647) the level is the highest ID from 1 to 50 whose minXpForLevel is at most the experience: 0 to 654 is 1, 655 is 2, 1710 is 3, 26360090 and above is 50."
